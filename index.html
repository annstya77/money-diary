<html lang="id">

  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      theme: {

          fontFamily: {
            sans: ['Nunito', 'sans-serif']
          },
          colors: {
            // Primary Colors
            skyBlue: '#B9D5F5',
            cottonPink: '#F5B9D0',
            mintGreen: '#B8DFC3',
            // Supporting Colors
            butterYellow: '#FFE19B',
            lavender: '#C9B8EB',
            peach: '#FFB99F',
            // Neutral Colors
            cloudWhite: '#F8FAFF',
            softCream: '#FFF7F0',
            softGrey: '#E6ECF2',
            // Text Colors
            deepSlate: '#49647D',
            mutedBlue: '#8094A6',
            softBrown: '#6A5B4D',
            // Status Colors
            freshGreen: '#83B9A9',
            freshGreenLight: '#E9F5F1',
            sweetPink: '#F6A7B7',
            sweetPinkLight: '#FDECEF',

            skyMint: '#AEE0C6',

            // Alias kompatibilitas komponen
            cream: '#F8FAFF',

  <style>
    * {
      font-family: 'Nunito', sans-serif !important;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #F8FAFF;
      color: #49647D;
      font-weight: 400;
      overscroll-behavior-y: none;
    }

    strong, b, .font-bold {
      font-weight: 700 !important;
    }

    .font-semibold, .font-medium {
      font-weight: 600 !important;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes popIn {
      0% { transform: scale(0.95) translateY(8px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

</head>
<body class="min-h-screen flex justify-center bg-cloudWhite text-deepSlate">

  <div id="app-shell" class="w-full max-w-md min-h-screen bg-cloudWhite relative flex flex-col shadow-xl">

    <!-- Toast Notification -->
    <div id="toast-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[90] px-4 py-2.5 rounded-2xl shadow-lg text-xs font-semibold tracking-wide bg-deepSlate text-cloudWhite max-w-[90vw] text-center"></div>

    <!-- Lock Screen Overlay -->
    <div id="lock-screen" class="hidden fixed inset-0 z-[80] bg-cloudWhite flex flex-col items-center justify-center p-6">
      <div class="w-full max-w-xs bg-softCream rounded-3xl p-6 shadow-md border border-softGrey text-center space-y-5">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-skyBlue flex items-center justify-center shadow-inner">
          <svg class="w-8 h-8 text-deepSlate" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <div>
          <h2 class="text-base font-bold uppercase tracking-wider text-deepSlate">KUNCI APLIKASI</h2>
          <p class="text-xs text-mutedBlue mt-1">Masukkan 4–6 digit PIN untuk membuka sesi (48 jam)</p>
        </div>
        <input id="pin-unlock-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••"
          onkeydown="if(event.key==='Enter') unlockWithPin()"
          class="w-full text-center tracking-[0.5em] text-lg py-3 rounded-2xl bg-creamSoft border border-softGrey text-deepSlate focus:outline-none focus:border-skyBlue" />
        <button onclick="unlockWithPin()" class="w-full py-3 rounded-2xl bg-deepSlate text-cloudWhite text-xs font-semibold uppercase tracking-wider shadow-sm active:scale-95 transition-all">
          Buka Aplikasi
        </button>
      </div>
    </div>

    <!-- Main Content Container -->
    <main id="main-content" class="flex-1 pb-28 overflow-y-auto no-scrollbar"></main>

    <!-- Floating Action Button (+ Catat) -->
    <button id="fab-add-tx" onclick="handleFabCatatClick()"
      class="fixed bottom-24 right-5 z-40 flex items-center gap-2 px-4 py-3.5 rounded-full bg-deepSlate text-cloudWhite shadow-lg hover:opacity-95 active:scale-95 transition-all">

        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />

      <div id="bottom-nav-items" class="grid grid-cols-6 gap-0.5 text-center"></div>
    </nav>

    <!-- Reusable Modal Overlay -->
    <div id="modal-backdrop" onclick="closeModalOnBackdrop(event)"
      class="hidden fixed inset-0 z-50 bg-deepSlate/35 backdrop-blur-[2px] items-end sm:items-center justify-center p-0 sm:p-4">
      <div id="modal-box" class="w-full max-w-md bg-softCream rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl border border-softGrey max-h-[90vh] overflow-y-auto animate-pop"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. KONSTANTA, MATA UANG, PALET WARNA & IKON (TEMA NUNITO + PALET PASTEL)
    // =========================================================================
    const STORAGE_KEY = 'catatan_keuangan_pwa_v1';
    const PIN_SESSION_KEY = 'catatan_keuangan_pin_session_until';
    const MONTH_NAMES_ID = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

    const CURRENCY_META = {

      THB: { symbol: '฿', name: 'Baht Thailand', decimals: 2 },
      USD: { symbol: '$', name: 'US Dollar', decimals: 2 },

    const ICONS = {
      wallet: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm14 5h.01" /></svg>`,
      bank: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M5 10v8m4-8v8m6-8v8m4-8v8M2 18h20M12 3l10 5H2l10-5z" /></svg>`,
      card: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8h18M3 12h18M5 6h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z" /></svg>`,
      celengan: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10L7.5 5.5 10.5 9h3l3-3.5L19 10c1.2 1.2 1.8 2.8 1.8 4.5 0 3.2-3.9 5.5-8.8 5.5s-8.8-2.3-8.8-5.5c0-1.7.6-3.3 1.8-4.5z"/><circle cx="9.5" cy="13.5" r="0.8" fill="currentColor"/><circle cx="14.5" cy="13.5" r="0.8" fill="currentColor"/><path stroke-linecap="round" stroke-linejoin="round" d="M11 15.5q1 1 2 0"/></svg>`,
      coin: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v8m-2-6h4m-4 4h4" /></svg>`,
      shield: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 4v5c0 4.5-3 8.4-7 9-4-.6-7-4.5-7-9V7l7-4z" /></svg>`,
      plane: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 14l9-3 9-7-4 14-5-3-4 4v-5l-5 0z" /></svg>`,
      home: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9z" /></svg>`
    };

    // =========================================================================
    // 2. DATA DEFAULT & STATE PERSISTENCE (LOCALSTORAGE)
    // =========================================================================
    function getDefaultData() {
      const today = new Date().toISOString().slice(0, 10);
      return {
        exchangeRates: { IDR: 1, THB: 475, USD: 15850, SGD: 11800, MYR: 3550, JPY: 105, EUR: 17100 },
        exchangeRateMeta: { lastUpdated: '', source: 'Default' },
        gasConfig: { url: '', key: '', lastSyncAt: '', status: 'offline' },
        security: { enabled: false, pinHash: '' },
        accounts: [
          {
            id: 'acc_bca', name: 'Bank BCA', jenis: 'Bank', currency: 'IDR', colorId: 'emerald', icon: 'bank', urut: 1,
            pockets: [
              { id: 'pkt_bca_main', name: 'Pocket Utama', balance: 4500000, urut: 1 },
              { id: 'pkt_bca_darurat', name: 'Dana Darurat', balance: 3000000, urut: 2 }
            ]
          },
          {
            id: 'acc_cash', name: 'Dompet Tunai', jenis: 'Cash', currency: 'IDR', colorId: 'amber', icon: 'wallet', urut: 2,
            pockets: [{ id: 'pkt_cash_harian', name: 'Kas Harian', balance: 650000, urut: 1 }]
          },
          {
            id: 'acc_thb', name: 'Dompet Baht', jenis: 'Cash', currency: 'THB', colorId: 'teal', icon: 'wallet', urut: 3,
            pockets: [{ id: 'pkt_thb_travel', name: 'Travel Thailand', balance: 4200, urut: 1 }]
          }
        ],
        categories: [
          {
            id: 'cat_makan', name: 'Makan & Minum', type: 'expense', colorId: 'amber', directLimit: 1500000,
            subcategories: [
              { id: 'sub_makan_harian', name: 'Makan Harian', limit: 1000000 },
              { id: 'sub_kopi', name: 'Kopi & Jajan', limit: 500000 }
            ]
          },
          { id: 'cat_transport', name: 'Transportasi', type: 'expense', colorId: 'teal', directLimit: 600000, subcategories: [] },
          {
            id: 'cat_tagihan', name: 'Tagihan', type: 'expense', colorId: 'coral', directLimit: 650000,
            subcategories: [
              { id: 'sub_hp_wifi', name: 'Hp dan Wifi', limit: 350000 },
              { id: 'sub_listrik', name: 'Listrik', limit: 300000 }
            ]
          },
          { id: 'cat_gaji', name: 'Gaji & Bonus', type: 'income', colorId: 'emerald', directLimit: 0, subcategories: [] }
        ],
        monthlyBudgets: {},
        transactions: [
          { id: 'tx_init_1', type: 'expense', date: today, amount: 320000, categoryId: 'cat_tagihan', subcategoryId: 'sub_hp_wifi', title: 'Paket Internet & Wifi', accountId: 'acc_bca', pocketId: 'pkt_bca_main' },
          { id: 'tx_init_2', type: 'expense', date: today, amount: 45000, categoryId: 'cat_makan', subcategoryId: 'sub_makan_harian', title: 'Makan Siang', accountId: 'acc_cash', pocketId: 'pkt_cash_harian' },
          { id: 'tx_init_3', type: 'income', date: today, amount: 5000000, categoryId: 'cat_gaji', subcategoryId: '', title: 'Gaji Bulanan', accountId: 'acc_bca', pocketId: 'pkt_bca_main' }
        ],
        recurringTransactions: [],
        savingsGoals: [
          {
            id: 'sav_darurat', name: 'Dana Darurat', targetAmount: 10000000, currentAmount: 3000000,
            accountId: 'acc_bca', pocketId: 'pkt_bca_darurat', deadline: '', colorId: 'emerald', icon: 'shield',
            note: 'Cadangan 6 bulan biaya hidup', urut: 1,
            history: [{ id: 'sh_1', type: 'deposit', amount: 3000000, date: today, note: 'Saldo awal pocket Dana Darurat' }]
          }
        ],
        debts: [],
        pendingQueue: []
      };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultData();
        const parsed = JSON.parse(raw);
        const def = getDefaultData();
        return {
          ...def,
          ...parsed,
          exchangeRates: { ...def.exchangeRates, ...(parsed.exchangeRates || {}) },
          exchangeRateMeta: { ...def.exchangeRateMeta, ...(parsed.exchangeRateMeta || {}) },
          gasConfig: { ...def.gasConfig, ...(parsed.gasConfig || {}) },
          security: { ...def.security, ...(parsed.security || {}) },
          monthlyBudgets: parsed.monthlyBudgets || {},
          recurringTransactions: Array.isArray(parsed.recurringTransactions) ? parsed.recurringTransactions : []
        };
      } catch (e) {
        return getDefaultData();
      }
    }

    let db = loadData();

    const nowInit = new Date();
    const ui = {
      activeTab: 'akun',
      txPeriodMode: 'monthly',
      txYear: nowInit.getFullYear(),
      txMonth: nowInit.getMonth(),
      txTypeFilter: 'ALL',
      txSearchQuery: '',
      statPeriodMode: 'monthly',
      statYear: nowInit.getFullYear(),
      statMonth: nowInit.getMonth(),
      statPieMode: 'expense',
      expandedBudgetCats: {},
      akunPeriodMode: 'monthly',
      akunYear: nowInit.getFullYear(),
      akunMonth: nowInit.getMonth(),
      selectedPocketDetail: null,
      pocketDetailTab: 'daily',
      pocketDetailYear: nowInit.getFullYear(),
      pocketDetailMonth: nowInit.getMonth(),
      selectedSavingGoalId: null,
      debtFilter: 'ALL'
    };

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (e) {
        console.warn('Gagal menyimpan localStorage:', e);
      }
    }

    // =========================================================================
    // 3. FORMAT ANGKA (###.###.###) & KONVERSI MATA UANG
    // =========================================================================
    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || { symbol: currency + ' ', decimals: 0 };
      const num = Number(amount) || 0;
      const sign = num < 0 ? '-' : '';
      const absVal = Math.abs(num);

      if (meta.decimals === 0 || Number.isInteger(absVal)) {
        const formatted = Math.round(absVal).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return `${sign}${meta.symbol} ${formatted}`;
      }

      const fixed = absVal.toFixed(meta.decimals);
      const [intPart, decPart] = fixed.split('.');
      const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${sign}${meta.symbol} ${intFormatted},${decPart}`;
    }

    function toIDR(amount, currency = 'IDR') {
      const rate = Number(db.exchangeRates?.[currency]) || 1;
      return (Number(amount) || 0) * rate;
    }

    function getTxCurrency(tx) {
      if (tx.currency) return tx.currency;
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc?.currency || 'IDR';
    }

    function getColorObj(colorId) {
      return ACCOUNT_COLORS.find(c => c.id === colorId) || ACCOUNT_COLORS[0];
    }

    function getAccountTotalBalance(acc) {
      return (acc.pockets || []).reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    // =========================================================================
    // 4. HELPER MODAL, FORMAT INPUT RIBUAN & TOMBOL CEPAT "00" / "000"
    // =========================================================================
    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      box.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      box.innerHTML = '';
    }

    function closeModalOnBackdrop(e) {
      if (e.target && e.target.id === 'modal-backdrop') {
        closeModal();
      }
    }

    function parseFormattedNumber(str) {
      if (typeof str === 'number') return str;
      const cleaned = String(str || '').replace(/[^\d]/g, '');
      return Number(cleaned) || 0;
    }

    function formatDigitsWithDots(digitsStr) {
      const cleaned = String(digitsStr || '').replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
      if (!cleaned) return '';
      return cleaned.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function handleMoneyInput(inputEl) {
      if (!inputEl) return;
      inputEl.value = formatDigitsWithDots(inputEl.value);
    }

    function appendQuickZeros(inputId, zerosStr) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const currentDigits = String(el.value || '').replace(/[^\d]/g, '');
      if (!currentDigits) return;
      el.value = formatDigitsWithDots(currentDigits + zerosStr);
      el.focus();
    }

    function buildQuickZeroButtons(inputId) {
      return `
        <div class="flex items-center gap-1.5 mt-1.5">
          <button type="button" onclick="appendQuickZeros('${inputId}', '00')"
            class="px-2.5 py-1 rounded-xl bg-creamSoft border border-softGrey text-[11px] font-semibold text-deepSlate active:scale-95 transition-all">
            +00
          </button>
          <button type="button" onclick="appendQuickZeros('${inputId}', '000')"
            class="px-2.5 py-1 rounded-xl bg-creamSoft border border-softGrey text-[11px] font-semibold text-deepSlate active:scale-95 transition-all">
            +000
          </button>
        </div>
      `;
    }

    // =========================================================================
    // 5. PWA MANIFEST & SERVICE WORKER
    // =========================================================================
    function initPWAAssets() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="32" fill="#B9D5F5"/><circle cx="64" cy="68" r="34" fill="#FFF7F0"/><path d="M40 44 L48 26 L60 40 Z" fill="#FFF7F0"/><path d="M88 44 L80 26 L68 40 Z" fill="#FFF7F0"/><circle cx="53" cy="66" r="4" fill="#49647D"/><circle cx="75" cy="66" r="4" fill="#49647D"/><path d="M59 75 Q64 80 69 75" stroke="#49647D" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
      const appleIcon = document.getElementById('apple-touch-icon');
      if (appleIcon) appleIcon.href = iconUrl;

      const manifest = {
        name: 'Catatan Keuangan',
        short_name: 'Keuangan',
        start_url: './',
        display: 'standalone',
        background_color: '#F8FAFF',
        theme_color: '#B9D5F5',
        icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml' }]
      };
      const manifestEl = document.getElementById('pwa-manifest');
      if (manifestEl) {
        manifestEl.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      }

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    // =========================================================================
    // 6. KEAMANAN PIN, TOAST & NAVIGASI
    // =========================================================================
    function simpleHashPin(pin) {
      let h = 2166136261;
      for (let i = 0; i < pin.length; i++) {
        h ^= pin.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return (h >>> 0).toString(16);
    }

    function isAppLocked() {
      if (!db.security?.enabled || !db.security?.pinHash) return false;
      const until = Number(localStorage.getItem(PIN_SESSION_KEY) || 0);
      return Date.now() > until;
    }

    function updateLockScreenVisibility() {
      const lockEl = document.getElementById('lock-screen');
      if (!lockEl) return;
      lockEl.classList.toggle('hidden', !isAppLocked());
    }

    function unlockWithPin() {
      const inp = document.getElementById('pin-unlock-input');
      const val = (inp?.value || '').trim();
      if (simpleHashPin(val) === db.security.pinHash) {
        localStorage.setItem(PIN_SESSION_KEY, String(Date.now() + 48 * 3600 * 1000));
        if (inp) inp.value = '';
        updateLockScreenVisibility();
        showToast('Aplikasi terbuka');
      } else {
        showToast('PIN salah', 'error');
      }
    }

    let toastTimer = null;

        type === 'error' ? 'bg-sweetPink text-deepSlate' : 'bg-deepSlate text-cloudWhite'

      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(tx => {
        if (!tx.date) return false;
        const parts = tx.date.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        if (mode === 'yearly') return y === year;
        return y === year && m === month;
      });
    }

    function shiftPeriod(scope, delta) {
      if (scope === 'tx') {
        if (ui.txPeriodMode === 'yearly') {
          ui.txYear += delta;
        } else {
          ui.txMonth += delta;
          if (ui.txMonth < 0) { ui.txMonth = 11; ui.txYear--; }
          if (ui.txMonth > 11) { ui.txMonth = 0; ui.txYear++; }
        }
      } else if (scope === 'stat') {
        if (ui.statPeriodMode === 'yearly') {
          ui.statYear += delta;
        } else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear--; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear++; }
        }
      } else if (scope === 'pocket') {
        if (ui.pocketDetailTab === 'monthly') {
          ui.pocketDetailYear += delta;
        } else {
          ui.pocketDetailMonth += delta;
          if (ui.pocketDetailMonth < 0) { ui.pocketDetailMonth = 11; ui.pocketDetailYear--; }
          if (ui.pocketDetailMonth > 11) { ui.pocketDetailMonth = 0; ui.pocketDetailYear++; }
        }
      }
      render();
    }

    function getAllPocketOptions() {
      const list = [];
      db.accounts.forEach(acc => {
        (acc.pockets || []).forEach(pkt => {
          list.push({
            accId: acc.id,
            accName: acc.name,
            currency: acc.currency || 'IDR',
            pktId: pkt.id,
            pktName: pkt.name,
            balance: Number(pkt.balance) || 0,
            key: `${acc.id}::${pkt.id}`
          });
        });
      });
      return list;
    }

    function updateTransferTargetHint() {
      const srcKey = document.getElementById('tf-source')?.value || '';
      const dstKey = document.getElementById('tf-target')?.value || '';
      const amt = parseFormattedNumber(document.getElementById('tf-amount-input')?.value || '0');
      const hintEl = document.getElementById('tf-conversion-hint');
      if (!hintEl) return;

      const opts = getAllPocketOptions();
      const src = opts.find(o => o.key === srcKey);
      const dst = opts.find(o => o.key === dstKey);
      if (!src || !dst) {
        hintEl.textContent = '';
        return;
      }

      if (src.currency === dst.currency) {
        hintEl.textContent = `Saldo asal: ${formatCurrency(src.balance, src.currency)} • Mata uang sama (${src.currency})`;
      } else {
        const idrVal = toIDR(amt, src.currency);
        const dstRate = Number(db.exchangeRates?.[dst.currency]) || 1;
        const converted = dstRate > 0 ? (idrVal / dstRate) : amt;
        hintEl.textContent = `Estimasi diterima di tujuan: ≈ ${formatCurrency(converted, dst.currency)}`;
      }
    }

    function submitTransferPocket(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const date = String(fd.get('date') || '').trim();
      const sourceKey = String(fd.get('sourceKey') || '');
      const targetKey = String(fd.get('targetKey') || '');
      const amount = parseFormattedNumber(fd.get('amount'));
      const title = String(fd.get('title') || '').trim();

      if (!date || amount <= 0) {
        showToast('Isi tanggal dan nominal transfer dengan benar', 'error');
        return;
      }
      if (!sourceKey || sourceKey === targetKey) {
        showToast('Pilih pocket asal dan tujuan yang berbeda', 'error');
        return;
      }

      const [srcAccId, srcPktId] = sourceKey.split('::');
      const [dstAccId, dstPktId] = targetKey.split('::');
      const srcAcc = db.accounts.find(a => a.id === srcAccId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === srcPktId);
      const dstAcc = db.accounts.find(a => a.id === dstAccId);
      const dstPkt = dstAcc?.pockets?.find(p => p.id === dstPktId);

      if (!srcAcc || !srcPkt || !dstAcc || !dstPkt) {
        showToast('Pocket tidak ditemukan', 'error');
        return;
      }

      const srcCur = srcAcc.currency || 'IDR';
      const dstCur = dstAcc.currency || 'IDR';
      let nilaiKe = amount;
      if (srcCur !== dstCur) {
        const idrVal = toIDR(amount, srcCur);
        const dstRate = Number(db.exchangeRates?.[dstCur]) || 1;
        nilaiKe = dstRate > 0 ? Number((idrVal / dstRate).toFixed(2)) : amount;
      }

      srcPkt.balance = (Number(srcPkt.balance) || 0) - amount;
      dstPkt.balance = (Number(dstPkt.balance) || 0) + nilaiKe;

      db.transactions.push({
        id: 'tx_tf_' + Date.now(),
        type: 'transfer',
        date,
        amount,
        nilaiKe,
        currency: srcCur,
        toCurrency: dstCur,
        accountId: srcAcc.id,
        pocketId: srcPkt.id,
        toAccountId: dstAcc.id,
        toPocketId: dstPkt.id,
        categoryId: '',
        subcategoryId: '',
        title: title || `${srcPkt.name} → ${dstPkt.name}`
      });

      saveData();
      closeModal();
      showToast('Transfer antar-pocket berhasil');
      render();
    }

      const cat = db.categories.find(c => c.id === catId);

        return `<option value="">— Tanpa Sub-Kategori —</option>`;

      return `<option value="">— Pilih Sub-Kategori —</option>` + subs.map(s => `

    function refreshTxSubcategories() {
      const catSel = document.getElementById('tx-category-select');

    function switchTxModalType(newType) {
      const typeField = document.getElementById('tx-type-field');
      const catSel = document.getElementById('tx-category-select');
      const expBtn = document.getElementById('tx-tab-expense');
      const incBtn = document.getElementById('tx-tab-income');
      if (typeField) typeField.value = newType;

      if (expBtn && incBtn) {
        expBtn.className = `py-2 rounded-xl text-xs font-semibold transition-all ${newType === 'expense' ? 'bg-sweetPink text-deepSlate' : 'text-mutedBlue'}`;
        incBtn.className = `py-2 rounded-xl text-xs font-semibold transition-all ${newType === 'income' ? 'bg-mintGreen text-deepSlate' : 'text-mutedBlue'}`;
      }

      if (catSel) {

        catSel.innerHTML = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        refreshTxSubcategories();

    function submitTxForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const type = String(fd.get('type') || 'expense');
      const date = String(fd.get('date') || '').trim();
      const pocketKey = String(fd.get('pocketKey') || '');
      const amount = parseFormattedNumber(fd.get('amount'));
      const categoryId = String(fd.get('categoryId') || '');
      const subcategoryId = String(fd.get('subcategoryId') || '');
      const title = String(fd.get('title') || '').trim();

      if (!date || amount <= 0 || !pocketKey.includes('::')) {
        showToast('Lengkapi tanggal, pocket, dan nominal transaksi', 'error');
        return;
      }

      const [accId, pktId] = pocketKey.split('::');
      const acc = db.accounts.find(a => a.id === accId);
      const pkt = acc?.pockets?.find(p => p.id === pktId);
      if (!acc || !pkt) {
        showToast('Akun atau pocket tidak ditemukan', 'error');
        return;
      }

      if (type === 'income') {
        pkt.balance = (Number(pkt.balance) || 0) + amount;
      } else {
        pkt.balance = (Number(pkt.balance) || 0) - amount;
      }

      const cat = db.categories.find(c => c.id === categoryId);
      const sub = cat?.subcategories?.find(s => s.id === subcategoryId);

      db.transactions.push({
        id: 'tx_' + Date.now(),
        type,
        date,
        amount,
        currency: acc.currency || 'IDR',
        accountId: acc.id,
        pocketId: pkt.id,
        categoryId,
        subcategoryId,
        title: title || sub?.name || cat?.name || (type === 'income' ? 'Pemasukan' : 'Pengeluaran')
      });

      saveData();
      closeModal();
      showToast(type === 'income' ? 'Pemasukan tersimpan' : 'Pengeluaran tersimpan');
      render();
    }

    function getPocketFlowOnTx(tx, accId, pktId) {
      const amt = Number(tx.amount) || 0;
      if (tx.type === 'income' && tx.accountId === accId && tx.pocketId === pktId) {
        return amt;
      }
      if (tx.type === 'expense' && tx.accountId === accId && tx.pocketId === pktId) {
        return -amt;
      }
      if (tx.type === 'transfer') {
        let delta = 0;
        if (tx.accountId === accId && tx.pocketId === pktId) {
          delta -= amt;
        }
        if (tx.toAccountId === accId && tx.toPocketId === pktId) {
          delta += (Number(tx.nilaiKe ?? tx.amount) || 0);
        }
        return delta;
      }
      return 0;
    }

    function renderPocketDetailView() {
      const ref = ui.selectedPocketDetail;
      const acc = db.accounts.find(a => a.id === ref?.accId);
      const pkt = acc?.pockets?.find(p => p.id === ref?.pktId);
      if (!acc || !pkt) {
        ui.selectedPocketDetail = null;
        return renderAkunView();
      }

      const cur = acc.currency || 'IDR';
      const clr = getColorObj(acc.colorId);
      const currentBal = Number(pkt.balance) || 0;
      const tab = ui.pocketDetailTab || 'daily';
      const yr = ui.pocketDetailYear;
      const mo = ui.pocketDetailMonth;

      const pocketEvents = [];
      db.transactions.forEach(tx => {
        const flow = getPocketFlowOnTx(tx, acc.id, pkt.id);
        if (flow !== 0 && tx.date) {
          pocketEvents.push({
            id: tx.id,
            date: tx.date,
            flow,
            deposit: flow > 0 ? flow : 0,
            withdraw: flow < 0 ? Math.abs(flow) : 0,
            tx
          });
        }
      });

      const totalAllFlow = pocketEvents.reduce((s, e) => s + e.flow, 0);
      const baselineBeforeEvents = currentBal - totalAllFlow;

      let rowsHtml = '';
      let periodDeposit = 0;
      let periodWithdraw = 0;
      let periodTotal = 0;
      let periodLabel = '';

      if (tab === 'daily') {
        periodLabel = `${MONTH_NAMES_ID[mo]} ${yr}`;
        const monthPrefix = `${yr}-${String(mo + 1).padStart(2, '0')}`;
        const allSorted = [...pocketEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        let running = baselineBeforeEvents;
        const withRunning = allSorted.map(ev => {
          running += ev.flow;
          return { ...ev, runningBalance: running };
        });

        const monthRows = withRunning.filter(r => r.date.startsWith(monthPrefix)).reverse();
        periodDeposit = monthRows.reduce((s, r) => s + r.deposit, 0);
        periodWithdraw = monthRows.reduce((s, r) => s + r.withdraw, 0);
        periodTotal = periodDeposit - periodWithdraw;

        if (monthRows.length === 0) {
          rowsHtml = `<div class="py-10 text-center text-xs text-mutedBlue">Belum ada mutasi pada pocket ini di ${periodLabel}.</div>`;
        } else {
          rowsHtml = `
            <div class="divide-y divide-softGrey">
              ${monthRows.map(r => {
                const parts = r.date.split('-');
                const dayNum = parts[2] || '';
                const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
                const dtObj = new Date(Number(parts[0]), (Number(parts[1]) || 1) - 1, Number(parts[2]) || 1);
                const dayName = dayNames[dtObj.getDay()] || '';
                const cat = db.categories.find(c => c.id === r.tx.categoryId);
                const sub = cat?.subcategories?.find(s => s.id === r.tx.subcategoryId);
                const titleText = r.tx.title || (r.tx.type === 'transfer' ? 'Transfer Antar-Pocket' : (sub?.name || cat?.name || 'Transaksi'));

                return `
                  <div class="py-3 flex items-center justify-between gap-2.5">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 text-center shrink-0">
                        <div class="text-sm font-bold text-deepSlate leading-none">${dayNum}</div>
                        <span class="inline-block mt-1 px-1.5 py-0.5 rounded bg-creamSoft text-[10px] text-mutedBlue">${dayName}</span>
                      </div>
                      <div class="min-w-0">
                        <div class="text-xs font-semibold text-deepSlate truncate">${titleText}</div>
                        <div class="text-[11px] text-mutedBlue truncate">${r.date} • ${r.tx.type === 'transfer' ? 'Transfer' : (cat?.name || 'Umum')}</div>
                      </div>
                    </div>

                    <div class="text-right shrink-0">
                      <div class="text-xs font-semibold ${r.flow >= 0 ? 'text-freshGreen' : 'text-sweetPink'}">
                        ${r.flow >= 0 ? '+' : '-'}${formatCurrency(Math.abs(r.flow), cur)}
                      </div>
                      <div class="text-[10px] text-mutedBlue">Saldo: ${formatCurrency(r.runningBalance, cur)}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }
      } else {
        periodLabel = `${yr}`;
        const allSorted = [...pocketEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const monthBuckets = Array.from({ length: 12 }, (_, mIdx) => ({
          mIdx,
          deposit: 0,
          withdraw: 0,
          net: 0,
          endBalance: baselineBeforeEvents
        }));

        allSorted.forEach(ev => {
          const parts = ev.date.split('-');
          const eYr = parseInt(parts[0], 10);
          const eMo = parseInt(parts[1], 10) - 1;
          if (eYr === yr && eMo >= 0 && eMo < 12) {
            monthBuckets[eMo].deposit += ev.deposit;
            monthBuckets[eMo].withdraw += ev.withdraw;
            monthBuckets[eMo].net += ev.flow;
          }
        });

        let accBeforeYr = baselineBeforeEvents;
        allSorted.forEach(ev => {
          const eYr = parseInt(ev.date.split('-')[0], 10);
          if (eYr < yr) accBeforeYr += ev.flow;
        });

        let runYr = accBeforeYr;
        for (let m = 0; m < 12; m++) {
          runYr += monthBuckets[m].net;
          monthBuckets[m].endBalance = runYr;
        }

        periodDeposit = monthBuckets.reduce((s, b) => s + b.deposit, 0);
        periodWithdraw = monthBuckets.reduce((s, b) => s + b.withdraw, 0);
        periodTotal = periodDeposit - periodWithdraw;

        rowsHtml = `
          <div class="divide-y divide-softGrey">
            ${monthBuckets.map(b => `
              <div class="py-2.5 flex items-center justify-between gap-2 text-xs">
                <div class="w-16 font-semibold text-deepSlate">${MONTH_NAMES_ID[b.mIdx]}</div>
                <div class="text-right text-freshGreen font-semibold">+${formatCurrency(b.deposit, cur)}</div>
                <div class="text-right text-sweetPink font-semibold">-${formatCurrency(b.withdraw, cur)}</div>
                <div class="text-right font-semibold text-deepSlate">${formatCurrency(b.endBalance, cur)}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      return `
        <div class="p-4 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <button onclick="closePocketDetail()" class="px-3 py-1.5 rounded-2xl bg-softCream border border-softGrey text-xs font-semibold text-deepSlate">
              ← Kembali
            </button>
            <div class="flex items-center gap-1.5">
              <button onclick="openTransferPocketModal('${acc.id}', '${pkt.id}')"
                class="px-3 py-1.5 rounded-2xl bg-butterYellow border border-softOrange text-xs font-semibold text-deepSlate">
                ⇄ Transfer
              </button>
              <button onclick="openTxModal('expense', '${acc.id}', '${pkt.id}')"
                class="px-3 py-1.5 rounded-2xl bg-deepSlate text-cloudWhite text-xs font-semibold">
                + Catat
              </button>
            </div>
          </div>

          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: ${clr.bg}; border-color: ${clr.border};">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-[11px] font-semibold text-softBrown block">${acc.name} • ${cur}</span>
                <h2 class="text-base font-bold text-deepSlate mt-0.5">${pkt.name}</h2>
              </div>
              <div class="text-right">
                <span class="text-[10px] text-softBrown block">Saldo Saat Ini</span>
                <div class="text-base font-bold text-deepSlate">${formatCurrency(currentBal, cur)}</div>
              </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1">
              <div class="inline-flex rounded-2xl bg-softCream p-1">
                <button onclick="setPocketDetailTab('daily')"
                  class="px-3 py-1 rounded-xl text-xs font-semibold ${tab === 'daily' ? 'bg-deepSlate text-cloudWhite' : 'text-deepSlate'}">
                  Harian
                </button>
                <button onclick="setPocketDetailTab('monthly')"
                  class="px-3 py-1 rounded-xl text-xs font-semibold ${tab === 'monthly' ? 'bg-deepSlate text-cloudWhite' : 'text-deepSlate'}">
                  Bulanan
                </button>
              </div>

              <div class="flex items-center gap-1.5 bg-softCream rounded-2xl px-2 py-1">
                <button onclick="shiftPeriod('pocket', -1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-deepSlate">‹</button>
                <span class="text-xs font-semibold text-deepSlate px-1">${periodLabel}</span>
                <button onclick="shiftPeriod('pocket', 1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-deepSlate">›</button>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div class="bg-softCream rounded-2xl p-2">
                <span class="text-[10px] text-softBrown block">Masuk</span>
                <span class="text-xs font-semibold text-freshGreen">+${formatCurrency(periodDeposit, cur)}</span>
              </div>
              <div class="bg-softCream rounded-2xl p-2">
                <span class="text-[10px] text-softBrown block">Keluar</span>
                <span class="text-xs font-semibold text-sweetPink">-${formatCurrency(periodWithdraw, cur)}</span>
              </div>
              <div class="bg-softCream rounded-2xl p-2">
                <span class="text-[10px] text-softBrown block">Selisih</span>
                <span class="text-xs font-semibold text-deepSlate">${periodTotal >= 0 ? '+' : '-'}${formatCurrency(Math.abs(periodTotal), cur)}</span>
              </div>
            </div>
          </div>

          <div class="bg-softCream rounded-3xl p-4 shadow-sm border border-softGrey">
            ${rowsHtml}
          </div>
        </div>
      `;
    }

                <button onclick="setTxPeriodMode('yearly')"

                <span class="text-xs font-semibold text-deepSlate px-1">${periodLabel}</span>
                <button onclick="shiftPeriod('tx', 1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-deepSlate">›</button>
              </div>

            <div class="grid grid-cols-3 gap-2">
              <div class="bg-softCream rounded-2xl p-2.5">
                <span class="text-[10px] text-softBrown block">Pemasukan</span>
                <span class="text-xs font-semibold text-freshGreen">+${formatCurrency(totalIn)}</span>
              </div>
              <div class="bg-softCream rounded-2xl p-2.5">
                <span class="text-[10px] text-softBrown block">Pengeluaran</span>
                <span class="text-xs font-semibold text-sweetPink">-${formatCurrency(totalOut)}</span>
              </div>
              <div class="bg-softCream rounded-2xl p-2.5">
                <span class="text-[10px] text-softBrown block">Selisih</span>
                <span class="text-xs font-semibold ${totalNet >= 0 ? 'text-deepSlate' : 'text-sweetPink'}">${totalNet >= 0 ? '+' : '-'}${formatCurrency(Math.abs(totalNet))}</span>
              </div>
            </div>
          </div>

          <div class="relative flex items-center">
            <input id="tx-search-input" type="text" value="${ui.txSearchQuery.replace(/"/g, '&quot;')}"
              oninput="handleTxSearchInput(this.value)"
              placeholder="Cari catatan, kategori, akun, atau pocket..."
              class="w-full px-4 py-2.5 rounded-2xl bg-softCream border border-softGrey text-xs text-deepSlate placeholder:text-mutedBlue focus:outline-none focus:border-skyBlue" />
            ${ui.txSearchQuery ? `
              <button onclick="clearTxSearch()" class="w-6 h-6 rounded-full bg-creamSoft text-mutedBlue text-xs flex items-center justify-center absolute right-2.5">✕</button>

    function setStatPeriodMode(m) { ui.statPeriodMode = m; render(); }
    function setStatPieMode(m) { ui.statPieMode = m; render(); }

    function renderStatistikView() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth);
      const periodLabel = ui.statPeriodMode === 'yearly' ? `${ui.statYear}` : `${MONTH_NAMES_ID[ui.statMonth]} ${ui.statYear}`;
      const multiplier = ui.statPeriodMode === 'yearly' ? 12 : 1;

      let totalIncome = 0;
      let totalExpense = 0;
      periodTxs.forEach(t => {
        const val = toIDR(t.amount, getTxCurrency(t));
        if (t.type === 'income') totalIncome += val;
        if (t.type === 'expense') totalExpense += val;
      });

      const pieMode = ui.statPieMode === 'income' ? 'income' : 'expense';
      const expCats = db.categories.filter(c => c.type === 'expense');

      const budgetCards = expCats.map(cat => {
        const catLimit = (Number(cat.directLimit) || 0) * multiplier;
        const catSpent = periodTxs
          .filter(t => t.type === 'expense' && t.categoryId === cat.id)
          .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        const catPct = catLimit > 0 ? Math.min(100, (catSpent / catLimit) * 100) : (catSpent > 0 ? 100 : 0);
        const overLimit = catLimit > 0 ? catSpent > catLimit : catSpent > 0;
        const barColor = overLimit ? '#F6A7B7' : '#83B9A9';

        return `
          <div class="bg-softCream rounded-3xl p-4 shadow-sm border border-softGrey space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="font-semibold text-deepSlate">${cat.name}</span>
              <div>
                <span class="font-semibold ${overLimit ? 'text-sweetPink' : 'text-deepSlate'}">${formatCurrency(catSpent)}</span>
                <span class="text-mutedBlue"> / ${formatCurrency(catLimit)}</span>
              </div>
            </div>
            <div class="w-full h-2.5 rounded-full bg-creamSoft overflow-hidden">
              <div class="h-full rounded-full transition-all" style="width: ${catPct}%; background-color: ${barColor};"></div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="p-4 space-y-4">
          <div class="rounded-3xl p-4 shadow-sm border border-skyBlue space-y-3 bg-skyBlue">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 bg-softCream rounded-2xl px-2 py-1">
                <button onclick="shiftPeriod('stat', -1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-deepSlate">‹</button>
                <span class="text-xs font-semibold text-deepSlate px-1">${periodLabel}</span>
                <button onclick="shiftPeriod('stat', 1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-deepSlate">›</button>

              <div class="inline-flex rounded-2xl bg-softCream p-1">
                <button onclick="setStatPeriodMode('monthly')" class="px-3 py-1 rounded-xl text-xs font-semibold ${ui.statPeriodMode === 'monthly' ? 'bg-deepSlate text-cloudWhite' : 'text-deepSlate'}">Bulanan</button>
                <button onclick="setStatPeriodMode('yearly')" class="px-3 py-1 rounded-xl text-xs font-semibold ${ui.statPeriodMode === 'yearly' ? 'bg-deepSlate text-cloudWhite' : 'text-deepSlate'}">Tahunan</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="setStatPieMode('income')" class="text-left rounded-2xl p-3 bg-mintGreen border ${pieMode === 'income' ? 'ring-2 ring-deepSlate' : 'border-transparent'}">
                <span class="text-[11px] font-semibold block text-deepSlate">Pendapatan</span>
                <span class="text-sm font-semibold text-deepSlate mt-0.5 block">${formatCurrency(totalIncome)}</span>
              </button>
              <button onclick="setStatPieMode('expense')" class="text-left rounded-2xl p-3 bg-sweetPink border ${pieMode === 'expense' ? 'ring-2 ring-deepSlate' : 'border-transparent'}">
                <span class="text-[11px] font-semibold block text-deepSlate">Pengeluaran</span>
                <span class="text-sm font-semibold text-deepSlate mt-0.5 block">${formatCurrency(totalExpense)}</span>
              </button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div class="text-xs font-semibold uppercase tracking-wider text-deepSlate px-1">Evaluasi Anggaran</div>
            ${budgetCards}
          </div>
        </div>
      `;
    }

                <div class="bg-softCream rounded-3xl p-4 shadow-sm border border-softGrey space-y-3">
                  <div class="flex items-center justify-between">

                        <div class="text-[11px] text-mutedBlue">${acc.jenis} • ${acc.currency}</div>
                      </div>
                    </div>
                    <div class="text-right">
                      <div class="text-sm font-semibold text-deepSlate">${formatCurrency(totalAcc, acc.currency)}</div>
                      ${acc.currency !== 'IDR' ? `<div class="text-[10px] text-mutedBlue">≈ ${formatCurrency(toIDR(totalAcc, acc.currency))}</div>` : ''}
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-2 pt-1">
                    ${(acc.pockets || []).map(p => `
                      <button type="button" onclick="openPocketDetail('${acc.id}', '${p.id}')"
                        class="text-left rounded-2xl p-2.5 border transition-all active:scale-98" style="background-color: ${clr.bg}; border-color: ${clr.border};">
                        <div class="text-[11px] font-semibold text-deepSlate truncate">${p.name}</div>
                        <div class="text-xs font-semibold text-deepSlate mt-0.5">${formatCurrency(p.balance, acc.currency)}</div>
                      </button>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderTabunganView() {
      return `
        <div class="p-4 space-y-3">
          <div class="rounded-3xl p-4 bg-mintGreen border border-freshGreen/40 space-y-1">
            <div class="text-xs text-softBrown">Target Tabungan</div>
            <div class="text-lg font-bold text-deepSlate">Pantau Progres & Pocket</div>
          </div>
          ${db.savingsGoals.map(g => {
            const pct = g.targetAmount > 0 ? Math.min(100, (g.currentAmount / g.targetAmount) * 100) : 0;
            return `
              <div class="bg-softCream rounded-3xl p-4 border border-softGrey space-y-2">
                <div class="flex justify-between text-xs font-semibold text-deepSlate">
                  <span>${g.name}</span>
                  <span>${formatCurrency(g.currentAmount)} / ${formatCurrency(g.targetAmount)}</span>
                </div>
                <div class="w-full h-2.5 rounded-full bg-creamSoft overflow-hidden">
                  <div class="h-full rounded-full bg-freshGreen" style="width: ${pct}%;"></div>
                </div>
                <p class="text-[11px] text-mutedBlue">${g.note || ''}</p>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderHutangView() {
      return `
        <div class="p-4 space-y-3">
          <div class="rounded-3xl p-4 bg-butterYellow border border-peach/40 space-y-1">
            <div class="text-xs text-softBrown">Hutang & Piutang</div>
            <div class="text-lg font-bold text-deepSlate">${db.debts.length} Catatan Aktif</div>
          </div>
          <div class="bg-softCream rounded-3xl p-6 text-center text-xs text-mutedBlue border border-softGrey">
            ${db.debts.length === 0 ? 'Belum ada catatan hutang atau piutang.' : db.debts.map(d => `${d.person}: ${formatCurrency(d.amount)}`).join('<br>')}
          </div>
        </div>
      `;
    }

    function renderPengaturanView() {
      const palettePreview = [
        { name: 'Sky Blue', hex: '#B9D5F5', role: 'Header, Accent' },
        { name: 'Cotton Pink', hex: '#F5B9D0', role: 'Highlight' },
        { name: 'Mint Green', hex: '#B8DFC3', role: 'Success' },
        { name: 'Butter Yellow', hex: '#FFE19B', role: 'Reminder' },
        { name: 'Lavender', hex: '#C9B8EB', role: 'Category' },
        { name: 'Peach', hex: '#FFB99F', role: 'Alert' },
        { name: 'Fresh Green', hex: '#83B9A9', role: 'Income/Success' },
        { name: 'Sweet Pink', hex: '#F6A7B7', role: 'Expense/Alert' },
        { name: 'Dream Purple', hex: '#C9B8E8', role: 'Budget/Info' },
        { name: 'Sky Mint', hex: '#AEE0C6', role: 'Decorative' },
        { name: 'Soft Orange', hex: '#FFD3A5', role: 'Highlight' }
      ];

      return `
        <div class="p-4 space-y-4">
          <div class="bg-softCream rounded-3xl p-4 border border-softGrey space-y-3">
            <div class="text-xs font-semibold uppercase tracking-wider text-deepSlate">Tipografi & Palet Aktif</div>
            <div class="text-xs text-softBrown">Font: <strong class="text-deepSlate">Nunito</strong> (400, 600, 700) • Background: <strong class="text-deepSlate">#F8FAFF</strong> • Card: <strong class="text-deepSlate">#FFF7F0</strong></div>
            <div class="grid grid-cols-2 gap-2 pt-1">
              ${palettePreview.map(p => `
                <div class="flex items-center gap-2 p-2 rounded-2xl bg-cloudWhite border border-softGrey">
                  <span class="w-5 h-5 rounded-full shrink-0 border border-softGrey" style="background-color: ${p.hex};"></span>
                  <div class="min-w-0">
                    <div class="text-[11px] font-semibold text-deepSlate truncate">${p.name}</div>
                    <div class="text-[10px] text-mutedBlue truncate">${p.hex} • ${p.role}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      updateLockScreenVisibility();
      updateFabVisibility();
      renderBottomNav();

      const mainEl = document.getElementById('main-content');
      if (!mainEl) return;

      if (ui.activeTab === 'transaksi') mainEl.innerHTML = renderTransaksiView();
      else if (ui.activeTab === 'statistik') mainEl.innerHTML = renderStatistikView();
      else if (ui.activeTab === 'tabungan') mainEl.innerHTML = renderTabunganView();
      else if (ui.activeTab === 'hutang') mainEl.innerHTML = renderHutangView();
      else if (ui.activeTab === 'pengaturan') mainEl.innerHTML = renderPengaturanView();
      else mainEl.innerHTML = renderAkunView();
    }

    initPWAAssets();
    render();
  </script>
</body>
</html>
