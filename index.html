    // --- Backup & Restore JSON ---
    function exportBackupJSON() {
      const payload = { app: 'PeanutButterMoneyDiary', version: '3.0', exportedAt: new Date().toISOString(), data: db };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `peanut-butter-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON berhasil diunduh');
    }

    function openRestoreModal() {
      ui.pendingRestoreData = null;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">RESTORE DATA JSON</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>
          <label class="block w-full p-4 rounded-2xl border-2 border-dashed border-[#E8DEC5] bg-creamSoft text-center cursor-pointer">
            <span class="text-xs font-medium text-ink block">Pilih File Backup (.json)</span>
            <input type="file" accept=".json,application/json" onchange="handleRestoreFileSelect(event)" class="hidden" />
          </label>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-creamSoft text-slate-600 text-xs font-medium">Batal</button>
            <button type="button" id="btn-confirm-restore" onclick="executeRestoreData()" disabled
              class="flex-1 py-3 rounded-2xl bg-ink disabled:bg-stone-300 text-[#FBF6EA] text-xs font-medium">Pulihkan</button>
          </div>
        </div>
      `);
    }

    function handleRestoreFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const candidate = parsed.data ? parsed.data : parsed;
          if (!candidate || !Array.isArray(candidate.accounts)) throw new Error('Invalid');
          ui.pendingRestoreData = { ...getDefaultData(), ...candidate };
          const btn = document.getElementById('btn-confirm-restore');
          if (btn) btn.disabled = false;
          showToast('File backup valid, ketuk Pulihkan');
        } catch {
          showToast('File JSON tidak valid', 'error');
        }
      };
      reader.readAsText(file);
    }

    function executeRestoreData() {
      if (!ui.pendingRestoreData) return;
      db = ui.pendingRestoreData;
      ui.pendingRestoreData = null;
      saveData();
      closeModal();
      showToast('Data berhasil dipulihkan');
      render();
    }

    // =========================================================================
    // 16. MAIN RENDER LOOP
    // =========================================================================
    function render() {
      renderBottomNav();
      const mainEl = document.getElementById('main-content');
      switch (ui.activeTab) {
        case 'transaksi': mainEl.innerHTML = renderTransaksiView(); break;
        case 'statistik': mainEl.innerHTML = renderStatistikView(); break;
        case 'akun': mainEl.innerHTML = renderAkunView(); break;
        case 'tabungan': mainEl.innerHTML = renderTabunganView(); break;
        case 'hutang': mainEl.innerHTML = renderHutangView(); break;
        case 'pengaturan': mainEl.innerHTML = renderPengaturanView(); break;
        default: mainEl.innerHTML = renderAkunView();
      }
      updateLockScreenVisibility();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPWAAssets();
      render();
      updateLockScreenVisibility();
      fetchLiveExchangeRates(true);
      if (db.gasConfig?.url && db.gasConfig?.key) {
        syncPullFromSheets(true);
      }
    });
  </script>
