  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      letter-spacing: 0.015em;
    }
    body {

      color: #422F0E;
      font-family: 'Fredoka', sans-serif;
      font-weight: 400;
      margin: 0;
      padding: 0;
    }
    .font-extrabold, .font-bold {
      font-weight: 500 !important;
      letter-spacing: 0.02em;
    }
    .font-semibold {
      font-weight: 400 !important;
      letter-spacing: 0.015em;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(66, 47, 14, 0.16);
      border-radius: 999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes catSway {
      0%, 100% { transform: rotate(-4deg) translateY(0); }
      50% { transform: rotate(4deg) translateY(-3px); }
    }
    @keyframes catSwayR {
      0%, 100% { transform: rotate(4deg) translateY(0); }
      50% { transform: rotate(-4deg) translateY(-3px); }
    }
    @keyframes catBob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.04); }
    }
    .cat-peanut { animation: catSway 3.4s ease-in-out infinite; }
    .cat-butter { animation: catSwayR 3.4s ease-in-out infinite; }
    .cat-bob { animation: catBob 2.6s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen flex justify-center">

  <!-- Mobile-First App Container -->
  <div id="app" class="w-full max-w-md bg-cream min-h-screen relative shadow-2xl flex flex-col pb-24 overflow-x-hidden">

    <!-- Lock Screen Overlay (PIN / Password Sesi 48 Jam) -->
    <div id="lock-screen" class="fixed inset-0 z-[90] hidden items-center justify-center p-5 bg-[#FBF6EA]/95 backdrop-blur-md">
      <div class="w-full max-w-sm bg-creamCard rounded-3xl p-6 shadow-xl border border-[#E8DEC5] space-y-5 text-center">
        <img id="lock-cat-img" alt="Peanut Cat" class="w-16 h-16 rounded-2xl mx-auto border-2 border-butter shadow-sm cat-bob" />
        <div>
          <h2 class="text-lg font-medium uppercase tracking-wider text-ink">APLIKASI TERKUNCI</h2>
          <p class="text-xs text-slate-500 mt-1">Masukkan PIN / password Anda untuk membuka buku harian keuangan</p>
        </div>

        <form onsubmit="submitUnlockApp(event)" class="space-y-3.5 text-left">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">PIN / Password</label>
            <input type="password" id="lock-pin-input" inputmode="numeric" autocomplete="current-password" required
              placeholder="Masukkan PIN / password..."
              class="w-full px-4 py-3 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-center text-base font-medium tracking-widest text-ink focus:outline-none focus:border-peanut" />
            <p id="lock-error-msg" class="text-[11px] font-medium text-coral mt-1.5 hidden">PIN / password salah, silakan coba lagi.</p>
          </div>
          <button type="submit"
            class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium shadow-md hover:opacity-95 active:scale-95 transition-all">
            Buka Aplikasi
          </button>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] hidden max-w-[90vw]">
      <div id="toast-inner" class="bg-ink text-[#FBF6EA] text-xs font-normal px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2.5">
        <span id="toast-icon"></span>
        <span id="toast-msg">Tersimpan</span>
      </div>
    </div>

    <!-- Main Dynamic View Area -->
    <main id="main-content" class="flex-1 w-full"></main>

    <!-- Floating Action Button (+ Catat dengan Ikon Kucing Koin) -->
    <button onclick="openTxModal()" aria-label="Tambah Transaksi"
      class="fixed bottom-20 right-4 sm:right-[calc(50%-210px)] z-40 h-14 px-4 rounded-full bg-butter text-ink shadow-xl hover:opacity-95 active:scale-95 transition-all flex items-center gap-2 border-2 border-peanut">

      <span class="text-xs font-medium">+ Catat</span>
    </button>

    <!-- Bottom Navigation Bar (6 Menu) -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-creamCard/95 backdrop-blur-md border-t border-[#E8DEC5] z-30 px-1.5 py-1.5 shadow-[0_-4px_20px_rgba(66,47,14,0.05)]">
      <div class="grid grid-cols-6 items-center text-center" id="bottom-nav"></div>

    function loadData() {

    function saveData() {

    // =========================================================================
    // 3. BRIDGE KOMUNIKASI LANGSUNG KE GOOGLE APPS SCRIPT (Code.gs)
    // =========================================================================
    async function callGasApi(fn, args = []) {
      const url = (db.gasConfig?.url || '').trim();
      const key = (db.gasConfig?.key || '').trim();
      if (!url || !key) {
        throw new Error('URL Web App atau Kunci Rahasia belum diisi');
      }

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key, fn, args })
      });

      const json = await res.json();
      if (!json || !json.ok) {
        throw new Error(json?.error || 'Respons API gagal');
      }
      return json.data;
    }

    // Optimistic UI: langsung simpan di UI & localStorage, lalu antrekan ke Code.gs di latar belakang
    function enqueueGasCall(fn, args = []) {
      if (!db.gasConfig?.url || !db.gasConfig?.key) return;
      db.pendingQueue.push({ id: 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), fn, args });
      saveData();
      flushGasQueue(true);
    }

    async function flushGasQueue(silent = true) {
      if (isSyncingGas) return;
      if (!db.gasConfig?.url || !db.gasConfig?.key) return;
      if (!db.pendingQueue || db.pendingQueue.length === 0) return;

      isSyncingGas = true;
      db.gasConfig.status = 'syncing';
      if (!silent) render();

      try {
        while (db.pendingQueue.length > 0) {
          const job = db.pendingQueue[0];
          await callGasApi(job.fn, job.args);
          db.pendingQueue.shift();
          saveData();
        }
        const now = new Date();
        db.gasConfig.lastSyncAt = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
        db.gasConfig.status = 'ok';
        saveData();
        if (!silent) showToast('Semua perubahan tersinkron ke Google Sheets');
      } catch (err) {
        db.gasConfig.status = 'error';
        saveData();
        if (!silent) showToast('Sync tertunda: ' + err.message, 'error');
      } finally {
        isSyncingGas = false;
        render();
      }
    }

    // Tarik seluruh data dari Google Sheets (fungsi load() di Code.gs) & gabungkan ke state lokal
    async function syncPullFromSheets(silent = false) {
      if (isSyncingGas) return;
      if (!db.gasConfig?.url || !db.gasConfig?.key) {
        if (!silent) showToast('Isi URL Web App & Kunci Rahasia di Pengaturan', 'error');
        return;
      }

      if (db.pendingQueue.length > 0) {
        await flushGasQueue(true);
      }

      isSyncingGas = true;
      db.gasConfig.status = 'syncing';
      if (!silent) render();

      try {
        const remote = await callGasApi('load', []);
        if (remote) {
          applyRemoteSheetsData(remote);
        }
        const now = new Date();
        db.gasConfig.lastSyncAt = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
        db.gasConfig.status = 'ok';
        saveData();
        if (!silent) showToast('Data berhasil dimuat dari Google Sheets!');
      } catch (err) {
        db.gasConfig.status = 'error';
        saveData();
        if (!silent) showToast('Gagal sync Sheets: ' + err.message, 'error');
      } finally {
        isSyncingGas = false;
        render();
      }
    }

    function applyRemoteSheetsData(remote) {
      // 1. Akun & Pos (Pocket)
      if (Array.isArray(remote.akun) && remote.akun.length > 0) {
        const remotePos = Array.isArray(remote.pos) ? remote.pos : [];
        db.accounts = remote.akun
          .sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0))
          .map((a, idx) => {
            const oldAcc = db.accounts.find(x => x.id === a.id || x.name === a.nama);
            const matchedPos = remotePos
              .filter(p => p.akun === a.nama)
              .sort((x, y) => (Number(x.urut) || 0) - (Number(y.urut) || 0));

            const pockets = matchedPos.length > 0
              ? matchedPos.map((p, pi) => ({
                  id: p.id || ('pkt_' + a.id + '_' + pi),
                  name: p.nama,
                  balance: Number(p.saldo) || 0,
                  urut: Number(p.urut) || (pi + 1)
                }))
              : [{ id: 'pkt_' + a.id + '_0', name: 'Pocket Utama', balance: Number(a.saldo) || 0, urut: 1 }];

            return {
              id: a.id || ('acc_' + idx),
              name: a.nama,
              jenis: a.jenis || 'Bank',
              currency: a.cur || 'IDR',
              colorId: a.warna || oldAcc?.colorId || ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length].id,
              icon: oldAcc?.icon || (String(a.jenis).toLowerCase() === 'cash' ? 'wallet' : 'bank'),
              urut: Number(a.urut) || (idx + 1),
              pockets
            };
          });
      }

      // 2. Kategori & Anggaran
      if (Array.isArray(remote.kat) && remote.kat.length > 0) {
        const remoteAng = Array.isArray(remote.ang) ? remote.ang : [];
        db.categories = remote.kat
          .sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0))
          .map(k => {
            const type = k.type === 'in' ? 'income' : 'expense';
            const subNames = String(k.subs || '').split('|').map(s => s.trim()).filter(Boolean);
            const catBudgetRow = remoteAng.find(r => r.kat === k.nama && !r.sub);

            const subcategories = subNames.map((sn, si) => {
              const subBudgetRow = remoteAng.find(r => r.kat === k.nama && r.sub === sn);
              return {
                id: `sub_${k.id}_${si}`,
                name: sn,
                limit: subBudgetRow ? Number(subBudgetRow.nilai) || 0 : 0
              };
            });

            return {
              id: k.id,
              name: k.nama,
              type,
              grup: k.grup || 'Lainnya',
              directLimit: subcategories.length === 0 && catBudgetRow ? (Number(catBudgetRow.nilai) || 0) : 0,
              subcategories
            };
          });
      }

      // 3. Transaksi (Pemasukan, Pengeluaran, Transfer)
      const mergedTx = [];
      if (Array.isArray(remote.tx)) {
        remote.tx.forEach((t, idx) => {
          const type = t.type === 'in' ? 'income' : 'expense';
          const acc = db.accounts.find(a => a.name === t.akun) || db.accounts[0];
          const pkt = acc?.pockets?.find(p => p.name === t.pos) || acc?.pockets?.[0];
          const cat = db.categories.find(c => c.type === type && c.name === t.kat) || db.categories.find(c => c.type === type);
          const sub = cat?.subcategories?.find(s => s.name === t.sub);

          mergedTx.push({
            id: `tx_r_${t.type}_${t.row || idx}`,
            row: t.row,
            sig: t.sig,
            type,
            date: t.date,
            amount: Number(t.nilai) || 0,
            categoryId: cat ? cat.id : '',
            subcategoryId: sub ? sub.id : '',
            title: t.cat || '',
            accountId: acc ? acc.id : '',
            pocketId: pkt ? pkt.id : ''
          });
        });
      }

      if (Array.isArray(remote.trf)) {
        remote.trf.forEach(tr => {
          const srcAcc = db.accounts.find(a => a.name === tr.dariAkun) || db.accounts[0];
          const srcPkt = srcAcc?.pockets?.find(p => p.name === tr.dariPos) || srcAcc?.pockets?.[0];
          const dstAcc = db.accounts.find(a => a.name === tr.keAkun) || db.accounts[0];
          const dstPkt = dstAcc?.pockets?.find(p => p.name === tr.kePos) || dstAcc?.pockets?.[0];

          mergedTx.push({
            id: tr.id || ('trf_' + Date.now()),
            type: 'transfer',
            date: tr.tanggal,
            amount: Number(tr.nilai) || 0,
            nilaiKe: Number(tr.nilaiKe) || Number(tr.nilai) || 0,
            categoryId: '',
            subcategoryId: '',
            title: tr.catatan || `Transfer ke ${tr.kePos || tr.keAkun}`,
            accountId: srcAcc ? srcAcc.id : '',
            pocketId: srcPkt ? srcPkt.id : '',
            toAccountId: dstAcc ? dstAcc.id : '',
            toPocketId: dstPkt ? dstPkt.id : ''
          });
        });
      }

      if (mergedTx.length > 0) {
        db.transactions = mergedTx;
      }

      // 4. Target Tabungan
      if (Array.isArray(remote.target)) {
        db.savingsGoals = remote.target.map((tg, idx) => {
          const oldGoal = db.savingsGoals.find(x => x.id === tg.id);
          const acc = db.accounts.find(a => a.name === tg.akun) || db.accounts[0];
          const pkt = acc?.pockets?.find(p => p.name === tg.pos) || acc?.pockets?.[0];
          const balIDR = pkt ? toIDR(pkt.balance, acc.currency) : 0;

          return {
            id: tg.id,
            name: tg.nama,
            targetAmount: Number(tg.target) || 0,
            currentAmount: balIDR,
            accountId: acc ? acc.id : '',
            pocketId: pkt ? pkt.id : '',
            deadline: tg.tenggat || '',
            colorId: oldGoal?.colorId || ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length].id,
            icon: oldGoal?.icon || 'celengan',
            note: oldGoal?.note || 'Terhubung ke Google Sheets',
            history: oldGoal?.history || []
          };
        });
      }

      // 5. Hutang & Piutang
      if (Array.isArray(remote.hutang)) {
        db.debts = remote.hutang.map(h => {
          const isPiutang = String(h.jenis).toLowerCase() === 'piutang';
          const total = Number(h.total) || 0;
          const sisa = Number(h.sisa) || 0;
          return {
            id: h.id,
            type: isPiutang ? 'receivable' : 'payable',
            person: h.pihak,
            totalAmount: total,
            paidAmount: Math.max(0, total - sisa),
            dueDate: h.tempo || '',
            note: h.catatan || '',
            accountId: db.accounts[0]?.id || '',
            pocketId: db.accounts[0]?.pockets?.[0]?.id || ''
          };
        });
      }
    }

    // =========================================================================
    // 4. PWA ICON KUCING PEANUT & BUTTER + INSTALL APP
    // =========================================================================
    function generateCatIconDataURL(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FBF6EA';
      ctx.fillRect(0, 0, size, size);

      const cx = size / 2;
      const cy = size * 0.56;
      const r = size * 0.30;

      // Telinga kucing
      ctx.fillStyle = '#F6D57A';
      ctx.strokeStyle = '#422F0E';
      ctx.lineWidth = Math.max(3, size * 0.03);
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(cx - r * 0.85, cy - r * 0.35);
      ctx.lineTo(cx - r * 0.58, cy - r * 1.25);
      ctx.lineTo(cx - r * 0.12, cy - r * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + r * 0.85, cy - r * 0.35);
      ctx.lineTo(cx + r * 0.58, cy - r * 1.25);
      ctx.lineTo(cx + r * 0.12, cy - r * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Kepala kucing krem pastel
      ctx.fillStyle = '#FCE39C';
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.05, r * 0.88, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Mata & hidung
      ctx.fillStyle = '#422F0E';
      ctx.beginPath();
      ctx.arc(cx - r * 0.38, cy - r * 0.08, r * 0.11, 0, Math.PI * 2);
      ctx.arc(cx + r * 0.38, cy - r * 0.08, r * 0.11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#EF6545';
      ctx.beginPath();
      ctx.moveTo(cx, cy + r * 0.08);
      ctx.lineTo(cx - r * 0.12, cy + r * 0.22);
      ctx.lineTo(cx + r * 0.12, cy + r * 0.22);
      ctx.closePath();
      ctx.fill();

      // Koin emas "Rp"
      const coinR = size * 0.14;
      const coinX = cx + r * 0.82;
      const coinY = cy + r * 0.68;
      ctx.fillStyle = '#F4C95D';
      ctx.beginPath();
      ctx.arc(coinX, coinY, coinR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#422F0E';
      ctx.font = `600 ${Math.round(coinR * 1.05)}px "Fredoka", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Rp', coinX, coinY + 1);

      return canvas.toDataURL('image/png');
    }

    function simpleHashPin(pin) {
      let hash = 0;
      const str = String(pin || '');
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return 'pin_' + Math.abs(hash).toString(36) + '_' + str.length;
    }

    function isSessionExpired() {
      if (!db.security?.enabled || !db.security?.pinHash) return false;
      if (db.security.lockedNow) return true;
      const last = Number(db.security.lastActiveAt) || 0;
      return (Date.now() - last) > SESSION_TIMEOUT_MS;
    }

    function touchSessionActivity() {
      if (!db.security) return;
      db.security.lastActiveAt = Date.now();
      saveData();
    }

    function updateLockScreenVisibility() {
      const lockEl = document.getElementById('lock-screen');
      if (!lockEl) return;
      if (isSessionExpired()) {
        lockEl.classList.remove('hidden');
        lockEl.classList.add('flex');
      } else {
        lockEl.classList.add('hidden');
        lockEl.classList.remove('flex');
        if (db.security?.enabled) {
          db.security.lastActiveAt = Date.now();
          saveData();
        }
      }
    }

    function submitUnlockApp(e) {
      e.preventDefault();
      const input = document.getElementById('lock-pin-input');
      const errMsg = document.getElementById('lock-error-msg');
      const entered = input?.value || '';

      if (simpleHashPin(entered) === db.security?.pinHash) {
        db.security.lockedNow = false;
        db.security.lastActiveAt = Date.now();
        saveData();
        if (input) input.value = '';
        if (errMsg) errMsg.classList.add('hidden');
        updateLockScreenVisibility();
        showToast('Aplikasi terbuka');
      } else {
        if (errMsg) errMsg.classList.remove('hidden');
      }
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      const icon = document.getElementById('toast-icon');
      const msgEl = document.getElementById('toast-msg');
      if (!toast || !msgEl) return;

      inner.className = type === 'error'
        ? 'bg-coral text-white text-xs font-normal px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2'
        : 'bg-ink text-[#FBF6EA] text-xs font-normal px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2';
      icon.textContent = type === 'error' ? '⚠️' : '✓';
      msgEl.textContent = msg;

      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    function formatNumberID(num, decimals = 0) {
      const n = Number(num) || 0;
      return n.toLocaleString('id-ID', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || CURRENCY_META.IDR;
      const n = Number(amount) || 0;
      const absStr = formatNumberID(Math.abs(n), meta.decimals);
      const sign = n < 0 ? '-' : '';
      return currency === 'IDR' ? `${sign}Rp ${absStr}` : `${sign}${meta.symbol} ${absStr}`;
    }

    function formatShortRupiah(amount) {
      const n = Math.abs(Number(amount) || 0);
      if (n >= 1000000000) return `${(n / 1000000000).toFixed(1).replace('.0', '')}M`;
      if (n >= 1000000) return `${(n / 1000000).toFixed(1).replace('.0', '')}jt`;
      if (n >= 1000) return `${Math.round(n / 1000)}rb`;
      return formatNumberID(n, 0);
    }

    function toIDR(amount, currency = 'IDR') {
      const rate = Number(db.exchangeRates?.[currency]) || 1;
      return (Number(amount) || 0) * rate;
    }

    function getTxCurrency(tx) {
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc ? acc.currency : 'IDR';
    }

    function getAccountTotalBalance(acc) {
      return (acc.pockets || []).reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    function getTotalNetWorthIDR() {
      return db.accounts.reduce((sum, acc) => sum + toIDR(getAccountTotalBalance(acc), acc.currency), 0);
    }

    function getCategoryLimit(cat) {
      if (cat.subcategories && cat.subcategories.length > 0) {
        return cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
      }
      return Number(cat.directLimit) || 0;
    }

    function getSavingGoalBalanceIDR(goal) {
      const acc = db.accounts.find(a => a.id === goal.accountId);
      const pkt = acc?.pockets?.find(p => p.id === goal.pocketId);
      if (acc && pkt) return Math.max(0, toIDR(pkt.balance, acc.currency));
      return Math.max(0, Number(goal.currentAmount) || 0);
    }

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(t => {
        if (!t.date) return false;
        const parts = t.date.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        return mode === 'yearly' ? y === year : (y === year && m === month);
      });
    }

    async function fetchLiveExchangeRates(silent = false) {
      if (isFetchingRates) return;
      isFetchingRates = true;
      if (!silent) render();
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/IDR');
        const data = await res.json();
        if (data && data.result === 'success' && data.rates) {
          Object.keys(CURRENCY_META).forEach(code => {
            if (code !== 'IDR' && data.rates[code] > 0) {
              const idrPerUnit = 1 / data.rates[code];
              db.exchangeRates[code] = code === 'JPY' ? Number(idrPerUnit.toFixed(2)) : Math.round(idrPerUnit);
            }
          });
          const now = new Date();
          const label = `${now.getDate()} ${MONTH_NAMES_ID[now.getMonth()]} ${now.getFullYear()}, ${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
          db.exchangeRateMeta = { source: 'live', lastUpdated: label };
          saveData();
          if (!silent) showToast('Kurs live (termasuk THB Baht) berhasil disinkronkan');
        }
      } catch (e) {
        if (!silent) showToast('Menggunakan kurs tersimpan lokal', 'error');
      } finally {
        isFetchingRates = false;
        render();
      }
    }

    function shiftPeriod(target, delta) {
      if (target === 'akun') {
        if (ui.akunPeriodMode === 'yearly') ui.akunYear += delta;
        else {
          ui.akunMonth += delta;
          if (ui.akunMonth < 0) { ui.akunMonth = 11; ui.akunYear -= 1; }
          if (ui.akunMonth > 11) { ui.akunMonth = 0; ui.akunYear += 1; }
        }
      } else if (target === 'stat') {
        if (ui.statPeriodMode === 'yearly') ui.statYear += delta;
        else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear -= 1; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear += 1; }
        }
      }
      render();
    }

    function setAkunPeriodMode(mode) { ui.akunPeriodMode = mode; render(); }

    function openPocketDetail(accountId, pocketId) {
      ui.selectedPocketDetail = { accountId, pocketId, year: ui.akunYear || 2026 };
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePocketDetail() { ui.selectedPocketDetail = null; render(); }

    function shiftPocketDetailYear(delta) {
      if (!ui.selectedPocketDetail) return;
      ui.selectedPocketDetail.year += delta;
      render();
    }

    function renderPocketDetailView() {
      const detail = ui.selectedPocketDetail;
      const acc = db.accounts.find(a => a.id === detail?.accountId);
      const pkt = acc?.pockets?.find(p => p.id === detail?.pocketId);
      if (!acc || !pkt) {
        ui.selectedPocketDetail = null;
        return renderAkunView();
      }

      const year = detail.year;
      const color = getColorObj(acc.colorId);
      const pocketTxs = db.transactions.filter(t =>
        (t.accountId === acc.id && t.pocketId === pkt.id) ||
        (t.type === 'transfer' && t.toAccountId === acc.id && t.toPocketId === pkt.id)
      );

      const monthlyRows = MONTH_NAMES_ID.map((mName, mIdx) => {
        let mIn = 0;
        let mOut = 0;
        pocketTxs.forEach(t => {
          if (!t.date) return;
          const parts = t.date.split('-');
          if (parseInt(parts[0], 10) !== year || (parseInt(parts[1], 10) - 1) !== mIdx) return;
          if (t.type === 'income') mIn += Number(t.amount) || 0;
          else if (t.type === 'expense') mOut += Number(t.amount) || 0;
          else if (t.type === 'transfer') {
            if (t.accountId === acc.id && t.pocketId === pkt.id) mOut += Number(t.amount) || 0;
            if (t.toAccountId === acc.id && t.toPocketId === pkt.id) {
              const srcAcc = db.accounts.find(a => a.id === t.accountId);
              const amountInIDR = toIDR(t.amount, srcAcc ? srcAcc.currency : acc.currency);
              const dstRate = db.exchangeRates[acc.currency] || 1;
              const received = t.nilaiKe ? Number(t.nilaiKe) : (acc.currency === (srcAcc?.currency || acc.currency) ? Number(t.amount) : Number((amountInIDR / dstRate).toFixed(2)));
              mIn += received;
            }
          }
        });
        return { mName, mIdx, mIn, mOut, diff: mIn - mOut };
      });

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">
          <div class="sticky top-0 z-20 bg-creamCard/95 backdrop-blur-md border-b border-[#E8DEC5] px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <button onclick="closePocketDetail()" class="p-1.5 -ml-1.5 rounded-xl hover:bg-creamSoft text-ink">

              </button>
              <div class="truncate">
                <h1 class="text-base font-medium uppercase text-ink truncate">${pkt.name}</h1>
                <div class="text-[11px] text-slate-500 truncate">${acc.name} (${acc.currency})</div>
              </div>
            </div>
            <button onclick="openPocketModal('${acc.id}', '${pkt.id}')" class="px-3 py-1.5 rounded-xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink shrink-0">
              Edit Saldo
            </button>
          </div>

          <div class="p-4 space-y-4">
            <div class="rounded-3xl p-5 text-white shadow-md" style="background-color: ${color.hex};">
              <span class="text-xs text-white/85 uppercase tracking-wider">SALDO SAAT INI</span>
              <div class="text-3xl font-medium mt-1">${formatCurrency(pkt.balance, acc.currency)}</div>
              ${acc.currency !== 'IDR' ? `<div class="text-xs text-white/85 mt-1">≈ ${formatCurrency(toIDR(pkt.balance, acc.currency), 'IDR')}</div>` : ''}
            </div>

            <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5] space-y-3">
              <div class="flex items-center justify-between gap-2">
                <h2 class="text-sm font-medium text-ink">Rincian Nominal Per Bulan (${year})</h2>
                <div class="flex items-center gap-1 bg-creamSoft px-2 py-1 rounded-xl border border-[#E8DEC5]">
                  <button onclick="shiftPocketDetailYear(-1)" class="p-1 text-slate-600 hover:text-ink">◀</button>
                  <span class="text-xs font-medium text-ink px-1">${year}</span>
                  <button onclick="shiftPocketDetailYear(1)" class="p-1 text-slate-600 hover:text-ink">▶</button>
                </div>
              </div>

              <div class="grid grid-cols-12 gap-1 px-2.5 pb-2 border-b border-stone-100 text-[10px] font-medium uppercase tracking-wider text-slate-400">
                <div class="col-span-3">BULAN</div>
                <div class="col-span-3 text-right">MASUK</div>
                <div class="col-span-3 text-right">KELUAR</div>
                <div class="col-span-3 text-right">SELISIH</div>
              </div>

              <div class="space-y-1.5">
                ${monthlyRows.map(row => {
                  const dec = CURRENCY_META[acc.currency]?.decimals || 0;
                  return `
                    <div class="grid grid-cols-12 gap-1 items-center px-2.5 py-2.5 rounded-2xl border bg-cream/60 border-[#E8DEC5]/60">
                      <div class="col-span-3 text-xs font-medium text-ink truncate">${row.mName} ${year}</div>
                      <div class="col-span-3 text-right text-[11px] font-medium text-sage tabular-nums">+${formatNumberID(row.mIn, dec)}</div>
                      <div class="col-span-3 text-right text-[11px] font-medium text-coral tabular-nums">-${formatNumberID(row.mOut, dec)}</div>
                      <div class="col-span-3 text-right text-[11px] font-medium text-ink tabular-nums">${row.diff >= 0 ? '+' : '-'}${formatNumberID(Math.abs(row.diff), dec)}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. VIEW 4: HUTANG & PIUTANG
    // =========================================================================
    function setDebtFilter(f) { ui.debtFilter = f; render(); }

    function renderHutangView() {
      const allDebts = db.debts || [];
      const payables = allDebts.filter(d => d.type === 'payable');
      const receivables = allDebts.filter(d => d.type === 'receivable');

      const totalPayableRem = payables.reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);
      const totalReceivableRem = receivables.reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);
      const list = ui.debtFilter === 'ALL' ? allDebts : allDebts.filter(d => d.type === ui.debtFilter);

      return `
        <div class="p-4 space-y-4">
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #FFD094; border-color: #F2BC77;">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h1 class="text-xl font-medium uppercase tracking-wider" style="color: #C83E67;">HUTANG & PIUTANG</h1>
                <p class="text-xs" style="color: #8A3E24;">Otomatis terhubung ke saldo akun & Google Sheets</p>
              </div>
              <button onclick="openDebtModal()" class="px-3.5 py-2 rounded-2xl text-xs font-medium shadow-sm active:scale-95 transition-all shrink-0" style="background-color: #422F0E; color: #FFD094;">
                + Catat
              </button>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div class="bg-creamCard rounded-2xl p-3">
                <span class="text-[11px] text-coral block">Sisa Hutang Saya</span>
                <span class="text-base font-medium text-ink">${formatCurrency(totalPayableRem)}</span>
              </div>
              <div class="bg-creamCard rounded-2xl p-3">
                <span class="text-[11px] text-sage block">Sisa Piutang (Tagihan)</span>
                <span class="text-base font-medium text-ink">${formatCurrency(totalReceivableRem)}</span>
              </div>
            </div>

            <div class="flex gap-1.5">
              ${[
                { id: 'ALL', label: 'Semua' },
                { id: 'payable', label: 'Hutang Saya' },
                { id: 'receivable', label: 'Piutang' }
              ].map(t => `
                <button onclick="setDebtFilter('${t.id}')"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all ${ui.debtFilter === t.id ? 'bg-[#422F0E] text-[#FFD094]' : 'bg-creamCard text-ink'}">
                  ${t.label}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="space-y-3">
            ${list.length === 0 ? `
              <div class="bg-creamCard rounded-3xl p-8 text-center border border-[#E8DEC5] text-xs text-slate-400">
                Belum ada catatan hutang atau piutang.
              </div>
            ` : list.map(d => {
              const isPayable = d.type === 'payable';
              const rem = Math.max(0, d.totalAmount - d.paidAmount);
              const isPaidOff = rem <= 0;
              const pct = d.totalAmount > 0 ? Math.min(100, Math.round((d.paidAmount / d.totalAmount) * 100)) : 100;
              const cardStyle = isPayable ? 'background-color: #FEF3F0; border-color: #FAD7CE;' : 'background-color: #EFF9F7; border-color: #CCEBE5;';

              return `
                <div class="rounded-3xl p-4 shadow-sm border space-y-2.5" style="${cardStyle}">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-creamCard ${isPayable ? 'text-coral' : 'text-sage'}">
                          ${isPayable ? 'HUTANG SAYA' : 'PIUTANG'}
                        </span>
                        ${isPaidOff ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-creamCard text-sage">LUNAS</span>` : ''}
                      </div>
                      <h3 class="text-base font-medium text-ink mt-1 truncate">${d.person}</h3>
                      <p class="text-[11px] text-slate-500 truncate">${d.note || 'Tanpa keterangan'} • Jatuh tempo: ${d.dueDate || '-'}</p>
                    </div>
                    <button onclick="deleteDebt('${d.id}')" class="p-1.5 rounded-xl bg-creamCard text-slate-400 hover:text-coral">✕</button>
                  </div>

                  <div class="flex items-baseline justify-between text-xs">
                    <div>
                      <span class="text-slate-500">Sisa: </span>
                      <span class="text-sm font-medium ${isPayable ? 'text-coral' : 'text-sage'}">${formatCurrency(rem)}</span>
                    </div>
                    <span class="text-slate-500">Total: ${formatCurrency(d.totalAmount)} (${pct}%)</span>
                  </div>

                  <div class="w-full h-2 bg-creamCard rounded-full overflow-hidden">
                    <div class="h-full rounded-full ${isPayable ? 'bg-coral' : 'bg-sage'}" style="width: ${pct}%"></div>
                  </div>

                  ${!isPaidOff ? `
                    <div class="pt-1">
                      <button onclick="openSettleDebtModal('${d.id}')"

    // =========================================================================
    // 12. STATISTIK EVALUASI ANGGARAN & PER KATEGORI
    // =========================================================================
    function setStatPeriodMode(mode) { ui.statPeriodMode = mode; render(); }
    function setStatSubTab(tab) { ui.statSubTab = tab; render(); }
    function toggleBudgetCatExpand(catId) { ui.expandedBudgetCats[catId] = !ui.expandedBudgetCats[catId]; render(); }
    function openCategoryDrilldown(catId) { ui.drilldownCategoryId = catId; ui.drilldownSubcategoryId = 'ALL'; render(); }
    function closeCategoryDrilldown() { ui.drilldownCategoryId = null; render(); }
    function setDrilldownSubcategory(subId) { ui.drilldownSubcategoryId = subId; render(); }

    function renderBudgetEvaluationSection() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense');
      const multiplier = ui.statPeriodMode === 'yearly' ? 12 : 1;
      const expenseCats = db.categories.filter(c => c.type === 'expense');

      let totalBudget = 0;
      let totalSpent = 0;

      const catRows = expenseCats.map(cat => {
        const limit = getCategoryLimit(cat) * multiplier;
        const catTxs = periodTxs.filter(t => t.categoryId === cat.id);
        const spent = catTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        totalBudget += limit;
        totalSpent += spent;
        const pct = limit > 0 ? Math.round((spent / limit) * 100) : 0;
        const isOver = limit > 0 && spent > limit;
        const isWarn = limit > 0 && !isOver && pct >= 80;
        return { cat, limit, spent, pct, isOver, isWarn };
      });

      const overallPct = totalBudget > 0 ? Math.round((totalSpent / totalBudget) * 100) : 0;
      const overallRemaining = totalBudget - totalSpent;

      return `
        <div class="space-y-3">
          <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5] space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-medium uppercase tracking-wider text-slate-500">
                TOTAL ANGGARAN ${ui.statPeriodMode === 'yearly' ? 'TAHUNAN' : 'BULANAN'}
              </span>
              <button onclick="openBulkBudgetModal()" class="px-3 py-1 rounded-xl bg-creamSoft hover:bg-stone-200/70 border border-[#E8DEC5] text-xs font-medium text-ink">
                Atur Semua
              </button>
            </div>
            <div class="flex items-baseline gap-1.5 flex-wrap">
              <span class="text-2xl font-medium text-ink">${formatCurrency(totalSpent)}</span>
              <span class="text-xs text-slate-400">/ ${formatCurrency(totalBudget)}</span>
            </div>
            <div class="w-full h-2.5 bg-creamSoft rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-300 ${overallPct > 100 ? 'bg-coral' : 'bg-sage'}" style="width: ${Math.min(100, overallPct)}%"></div>
            </div>
            <div class="flex items-center justify-between text-xs text-slate-500">
              <span>Terpakai ${overallPct}%</span>
              <span class="${overallRemaining < 0 ? 'text-coral' : 'text-sage'}">
                ${overallRemaining < 0 ? `Lebih ${formatCurrency(Math.abs(overallRemaining))}` : `Sisa ${formatCurrency(overallRemaining)}`}
              </span>
            </div>
          </div>

          ${catRows.map(({ cat, limit, spent, pct, isOver, isWarn }) => {
            const hasSubs = cat.subcategories && cat.subcategories.length > 0;
            const expanded = Boolean(ui.expandedBudgetCats[cat.id]);
            const badgeCls = isOver ? 'bg-coralLight text-coral' : isWarn ? 'bg-amber-50 text-amber-700' : 'bg-sageLight text-sage';
            const badgeText = isOver ? 'Melebihi' : isWarn ? 'Hampir' : 'Aman';
            const barColor = isOver ? 'bg-coral' : isWarn ? 'bg-amber-500' : 'bg-sage';

            return `
              <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5] space-y-2.5">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0 flex-1">
                    ${hasSubs ? `
                      <button onclick="toggleBudgetCatExpand('${cat.id}')" class="w-7 h-7 rounded-xl bg-creamSoft border border-[#E8DEC5] flex items-center justify-center text-slate-600 shrink-0">
                        <svg class="w-4 h-4 transition-transform ${expanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                      </button>
                    ` : ''}
                    <div class="min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <button onclick="openCategoryDrilldown('${cat.id}')" class="text-sm font-medium text-ink hover:underline text-left truncate">${cat.name}</button>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-medium ${badgeCls}">${badgeText}</span>
                      </div>
                      <div class="text-xs text-slate-500 mt-0.5">
                        <span class="font-medium text-ink">${formatCurrency(spent)}</span> dari ${formatCurrency(limit)} (${pct}%)
                      </div>
                    </div>
                  </div>
                  <button onclick="openEditCategoryLimitModal('${cat.id}')" class="px-2.5 py-1.5 rounded-xl bg-creamSoft border border-[#E8DEC5] text-[11px] font-medium text-ink shrink-0">
                    Edit Limit
                  </button>
                </div>

                <div class="w-full h-2 bg-creamSoft rounded-full overflow-hidden">
                  <div class="h-full rounded-full ${barColor}" style="width: ${Math.min(100, pct)}%"></div>
                </div>

                ${hasSubs && expanded ? `
                  <div class="pt-2 mt-2 border-t border-stone-100 space-y-2 pl-2">
                    ${cat.subcategories.map(sub => {
                      const subLimit = (Number(sub.limit) || 0) * multiplier;
                      const subSpent = periodTxs
                        .filter(t => t.categoryId === cat.id && t.subcategoryId === sub.id)
                        .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
                      const subPct = subLimit > 0 ? Math.round((subSpent / subLimit) * 100) : 0;
                      return `
                        <div class="bg-creamSoft/80 rounded-2xl p-2.5 border border-[#E8DEC5]/70 space-y-1.5">
                          <div class="flex items-center justify-between gap-2 text-xs">
                            <span class="font-medium text-ink truncate">${sub.name}</span>
                            <button onclick="openEditSubLimitModal('${cat.id}', '${sub.id}')" class="text-[11px] text-sage hover:underline shrink-0">Atur Limit</button>
                          </div>
                          <div class="flex items-center justify-between text-[11px] text-slate-500">
                            <span>${formatCurrency(subSpent)} / ${formatCurrency(subLimit)}</span>
                            <span>${subPct}%</span>
                          </div>
                          <div class="w-full h-1.5 bg-creamCard rounded-full overflow-hidden">
                            <div class="h-full rounded-full ${subPct > 100 ? 'bg-coral' : 'bg-sage'}" style="width: ${Math.min(100, subPct)}%"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCategoryBreakdownSection() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense');
      const totalExpense = periodTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
      const expenseCats = db.categories.filter(c => c.type === 'expense');

      const items = expenseCats.map((cat, idx) => {
        const spent = periodTxs.filter(t => t.categoryId === cat.id).reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        const share = totalExpense > 0 ? Math.round((spent / totalExpense) * 100) : 0;
        const color = ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length];
        return { cat, spent, share, color };
      }).sort((a, b) => b.spent - a.spent);

      return `
        <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5] space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wider text-slate-500">TOTAL PENGELUARAN PERIODE INI</span>
            <span class="text-base font-medium text-coral">${formatCurrency(totalExpense)}</span>
          </div>
          <div class="divide-y divide-stone-100">
            ${items.map(({ cat, spent, share, color }) => `
              <button onclick="openCategoryDrilldown('${cat.id}')" class="w-full py-3 flex items-center justify-between gap-3 text-left hover:bg-creamSoft/60 rounded-2xl px-2">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${color.hex};"></span>
                  <div class="min-w-0">
                    <div class="text-sm font-medium text-ink truncate">${cat.name}</div>
                    <div class="text-[11px] text-slate-400">${share}% dari total pengeluaran</div>
                  </div>
                </div>
                <span class="text-sm font-medium text-ink shrink-0">${formatCurrency(spent)}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCategoryDrilldown() {
      const cat = db.categories.find(c => c.id === ui.drilldownCategoryId);
      if (!cat) { ui.drilldownCategoryId = null; return renderStatistikView(); }

      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense' && t.categoryId === cat.id);
      const filteredTxs = ui.drilldownSubcategoryId === 'ALL'
        ? periodTxs
        : periodTxs.filter(t => t.subcategoryId === ui.drilldownSubcategoryId);
      const totalSpent = filteredTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);

      return `
        <div class="p-4 space-y-4 animate-fade-in">
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #9CA4E4; border-color: #848ED6;">
            <div class="flex items-center gap-2.5">
              <button onclick="closeCategoryDrilldown()" class="p-2 rounded-xl bg-creamCard text-ink">◀</button>
              <div>
                <h1 class="text-base font-medium uppercase tracking-wider" style="color: #FFF6D6;">${cat.name}</h1>
                <p class="text-xs" style="color: #F4F5FF;">Total: ${formatCurrency(totalSpent)} (${filteredTxs.length} transaksi)</p>
              </div>
            </div>
            ${(cat.subcategories && cat.subcategories.length > 0) ? `
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-1">
                <button onclick="setDrilldownSubcategory('ALL')" class="px-3 py-1.5 rounded-xl text-xs font-medium shrink-0 ${ui.drilldownSubcategoryId === 'ALL' ? 'bg-ink text-[#FFF6D6]' : 'bg-creamCard text-ink'}">Semua</button>
                ${cat.subcategories.map(sub => `
                  <button onclick="setDrilldownSubcategory('${sub.id}')" class="px-3 py-1.5 rounded-xl text-xs font-medium shrink-0 ${ui.drilldownSubcategoryId === sub.id ? 'bg-ink text-[#FFF6D6]' : 'bg-creamCard text-ink'}">${sub.name}</button>
                `).join('')}
              </div>
            ` : ''}
          </div>
          <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5]">
            ${filteredTxs.length === 0 ? `<div class="py-8 text-center text-xs text-slate-400">Belum ada transaksi di kategori ini.</div>` : `
              <div class="divide-y divide-stone-100">
                ${filteredTxs.sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(tx => renderTransactionRow(tx)).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 13. VIEW 5: TABUNGAN (TERHUBUNG KE AKUN & POCKET)
    // =========================================================================
    function renderTabunganView() {
      if (ui.selectedSavingGoalId) return renderSavingGoalDetailView();

      const goals = db.savingsGoals || [];
      const totalSaved = goals.reduce((s, g) => s + getSavingGoalBalanceIDR(g), 0);
      const totalTarget = goals.reduce((s, g) => s + (Number(g.targetAmount) || 0), 0);
      const overallPct = totalTarget > 0 ? Math.min(100, Math.round((totalSaved / totalTarget) * 100)) : 0;

      return `
        <div class="p-4 space-y-4">
          <div class="rounded-3xl p-4 shadow-sm border flex items-center justify-between gap-2" style="background-color: #B0C965; border-color: #9BB550;">
            <div>
              <h1 class="text-xl font-medium uppercase tracking-wider" style="color: #233814;">TABUNGAN</h1>
              <p class="text-xs" style="color: #2F4A1C;">Terhubung ke Pocket & masuk dalam Total Aset</p>
            </div>
            <button onclick="openSavingGoalModal()" class="px-3.5 py-2 rounded-2xl text-xs font-medium shadow-sm shrink-0" style="background-color: #233814; color: #F5FCE8;">
              + Target
            </button>
          </div>

          <div class="rounded-3xl p-5 shadow-sm border relative overflow-hidden" style="background: linear-gradient(135deg, #F3FBE7 0%, #E4F5CB 100%); border-color: #C7E39D;">
            <div class="flex items-center justify-between">
              <span class="text-xs font-medium uppercase tracking-wider text-[#233814]">TOTAL TABUNGAN TERKUMPUL</span>
              <span class="px-2.5 py-0.5 rounded-full bg-creamCard text-[#233814] text-[11px] font-medium">${overallPct}% dari Target</span>
            </div>
            <div class="text-2xl sm:text-3xl font-medium tracking-tight mt-1 text-ink">${formatCurrency(totalSaved)}</div>
            <div class="text-xs text-slate-600 mt-1">Target Keseluruhan: <span class="text-ink">${formatCurrency(totalTarget)}</span></div>
            <div class="w-full h-2 bg-creamCard rounded-full overflow-hidden mt-3">
              <div class="h-full bg-sage rounded-full transition-all duration-300" style="width: ${overallPct}%"></div>
            </div>
          </div>

          <div class="space-y-3.5">
            ${goals.length === 0 ? `
              <div class="bg-creamCard rounded-3xl p-8 text-center border border-[#E8DEC5] space-y-2">
                <div class="text-sm font-medium text-ink">Belum ada target tabungan</div>
                <p class="text-xs text-slate-400">Buat target tabungan dan pilih pocket penyimpanannya.</p>
              </div>
            ` : goals.map(g => {
              const color = getColorObj(g.colorId || 'emerald');
              const iconSvg = ICONS[g.icon] || ICONS.celengan;
              const currentSavedIDR = getSavingGoalBalanceIDR(g);
              const pct = g.targetAmount > 0 ? Math.min(100, Math.round((currentSavedIDR / g.targetAmount) * 100)) : 0;
              const linkedAcc = db.accounts.find(a => a.id === g.accountId);
              const linkedPkt = linkedAcc?.pockets?.find(p => p.id === g.pocketId);

              return `
                <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: ${color.bg}; border-color: ${color.border};">
                  <div class="flex items-start justify-between gap-2">
                    <button onclick="openSavingGoalDetail('${g.id}')" class="flex items-center gap-3 text-left min-w-0 flex-1">
                      <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shrink-0" style="background-color: ${color.hex};">
                        ${iconSvg}
                      </div>
                      <div class="min-w-0">
                        <h3 class="text-base font-medium text-ink truncate">${g.name}</h3>
                        <span class="inline-block px-2 py-0.5 rounded-md bg-creamCard text-[10px] text-ink mt-0.5">
                          🏦 ${linkedAcc ? `${linkedAcc.name} • ${linkedPkt?.name || ''}` : 'Belum ditautkan'}
                        </span>
                      </div>
                    </button>
                    <button onclick="openSavingGoalModal('${g.id}')" class="p-2 rounded-xl bg-creamCard text-slate-600 shrink-0">✎</button>
                  </div>

                  <div>
                    <div class="flex items-baseline justify-between text-xs mb-1.5">
                      <div>
                        <span class="text-sm font-medium" style="color: ${color.hex};">${formatCurrency(currentSavedIDR)}</span>
                        <span class="text-slate-500"> / ${formatCurrency(g.targetAmount)}</span>
                      </div>
                      <span class="font-medium text-ink">${pct}%</span>
                    </div>
                    <div class="w-full h-2.5 bg-creamCard rounded-full overflow-hidden">
                      <div class="h-full rounded-full" style="width: ${pct}%; background-color: ${color.hex};"></div>
                    </div>
                  </div>

                  <div class="grid grid-cols-3 gap-2 pt-1">
                    <button onclick="openSavingTransferModal('${g.id}', 'deposit')" class="py-2 px-2.5 rounded-2xl text-white text-xs font-medium" style="background-color: ${color.hex};">+ Setor</button>
                    <button onclick="openSavingTransferModal('${g.id}', 'withdraw')" class="py-2 px-2.5 rounded-2xl bg-creamCard text-ink text-xs font-medium">↓ Tarik</button>
                    <button onclick="openSavingGoalDetail('${g.id}')" class="py-2 px-2.5 rounded-2xl bg-creamCard/80 text-slate-600 text-xs font-medium">Riwayat</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openSavingGoalDetail(goalId) { ui.selectedSavingGoalId = goalId; render(); }
    function closeSavingGoalDetail() { ui.selectedSavingGoalId = null; render(); }

    function renderSavingGoalDetailView() {
      const g = (db.savingsGoals || []).find(item => item.id === ui.selectedSavingGoalId);
      if (!g) { ui.selectedSavingGoalId = null; return renderTabunganView(); }
      const color = getColorObj(g.colorId || 'emerald');
      const currentSavedIDR = getSavingGoalBalanceIDR(g);
      const pct = g.targetAmount > 0 ? Math.min(100, Math.round((currentSavedIDR / g.targetAmount) * 100)) : 0;
      const history = [...(g.history || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">
          <div class="sticky top-0 z-20 bg-creamCard/95 backdrop-blur-md border-b border-[#E8DEC5] px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <button onclick="closeSavingGoalDetail()" class="p-1.5 -ml-1.5 rounded-xl hover:bg-creamSoft text-ink">◀</button>
              <h1 class="text-base font-medium uppercase text-ink truncate">${g.name}</h1>
            </div>
            <button onclick="openSavingGoalModal('${g.id}')" class="px-3 py-1.5 rounded-xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink">Edit</button>
          </div>
          <div class="p-4 space-y-4">
            <div class="rounded-3xl p-5 text-white shadow-md" style="background-color: ${color.hex};">
              <div class="text-3xl font-medium">${formatCurrency(currentSavedIDR)}</div>
              <div class="text-xs text-white/85 mt-0.5">Target: ${formatCurrency(g.targetAmount)} (${pct}%)</div>
              <div class="grid grid-cols-2 gap-2.5 mt-4 pt-3 border-t border-white/20">
                <button onclick="openSavingTransferModal('${g.id}', 'deposit')" class="py-2.5 rounded-2xl bg-creamCard text-ink text-xs font-medium">+ Setor</button>
                <button onclick="openSavingTransferModal('${g.id}', 'withdraw')" class="py-2.5 rounded-2xl bg-black/25 text-white text-xs font-medium">↓ Tarik</button>
              </div>
            </div>
            <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5]">
              <h2 class="text-sm font-medium text-ink mb-3">Riwayat Mutasi (${history.length})</h2>
              ${history.length === 0 ? `<div class="py-6 text-center text-xs text-slate-400">Belum ada riwayat setoran/penarikan.</div>` : `
                <div class="divide-y divide-stone-100">
                  ${history.map(h => `
                    <div class="py-3 flex items-center justify-between text-xs">
                      <div>
                        <div class="font-medium text-ink">${h.note || (h.type === 'deposit' ? 'Setor' : 'Tarik')}</div>
                        <div class="text-[11px] text-slate-400">${h.date}</div>
                      </div>
                      <span class="font-medium ${h.type === 'deposit' ? 'text-sage' : 'text-amber-700'}">${h.type === 'deposit' ? '+' : '-'}${formatCurrency(h.amount)}</span>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function parseFormattedNumber(raw) {
      const cleaned = String(raw || '').replace(/\./g, '').replace(',', '.');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    }

    function formatTxAmountInput(el) {
      let val = el.value.replace(/[^0-9,]/g, '');
      const parts = val.split(',');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      el.value = parts.length > 1 ? parts[0] + ',' + parts[1].slice(0, 2) : parts[0];
    }

    function appendTxZeros(zeros) {
      const el = document.getElementById('tx-amount');
      if (!el) return;
      const num = parseFormattedNumber(el.value);
      if (num <= 0) return;
      const next = Math.round(num * Math.pow(10, zeros.length));
      el.value = next.toLocaleString('id-ID');
    }

    function switchTxModalType(type) {
      document.getElementById('tx-type').value = type;
      ['expense', 'income', 'transfer'].forEach(t => {
        const btn = document.getElementById(`tx-tab-${t}`);
        if (t === type) {
          const activeBg = t === 'expense' ? 'bg-coral text-white' : t === 'income' ? 'bg-sage text-white' : 'bg-ink text-[#FBF6EA]';
          btn.className = `py-2 rounded-xl transition-all ${activeBg}`;
        } else {
          btn.className = 'py-2 rounded-xl transition-all text-slate-600';
        }
      });

      const catSec = document.getElementById('tx-category-section');
      const toSec = document.getElementById('tx-to-section');
      const accLbl = document.getElementById('tx-acc-label');
      const pktLbl = document.getElementById('tx-pkt-label');

      if (type === 'transfer') {
        catSec.classList.add('hidden');
        toSec.className = 'grid grid-cols-2 gap-2.5 pt-1';
        accLbl.textContent = 'Dari Akun';
        pktLbl.textContent = 'Dari Pocket';
      } else {
        catSec.className = 'space-y-3';
        toSec.classList.add('hidden');
        accLbl.textContent = 'Akun';
        pktLbl.textContent = 'Pocket';
        populateTxCategories(type);
      }
    }

    function populateTxCategories(type) {
      const sel = document.getElementById('tx-category');
      if (!sel) return;
      const cats = db.categories.filter(c => c.type === type);
      sel.innerHTML = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      onTxCategoryChange();

    function onTxCategoryChange() {
      const catId = document.getElementById('tx-category')?.value;
      const cat = db.categories.find(c => c.id === catId);
      const wrap = document.getElementById('tx-subcategory-wrap');
      const subSel = document.getElementById('tx-subcategory');
      if (!wrap || !subSel) return;

      if (cat && cat.subcategories && cat.subcategories.length > 0) {
        wrap.classList.remove('hidden');
        subSel.innerHTML = `<option value="">-- Umum --</option>` +
          cat.subcategories.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

        wrap.classList.add('hidden');

    function onTxAccountChange() { populateTxPockets('tx-account', 'tx-pocket'); }
    function onTxToAccountChange() { populateTxPockets('tx-to-account', 'tx-to-pocket'); }

    function populateTxPockets(accSelectId, pktSelectId, preferredPktId = null) {
      const accId = document.getElementById(accSelectId)?.value;
      const pktSel = document.getElementById(pktSelectId);
      const acc = db.accounts.find(a => a.id === accId);
      if (!acc || !pktSel) return;
      pktSel.innerHTML = (acc.pockets || []).map(p =>
        `<option value="${p.id}" ${preferredPktId === p.id ? 'selected' : ''}>${p.name} (${formatCurrency(p.balance, acc.currency)})</option>`
      ).join('');
    }

    function submitTxModal(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const amount = parseFormattedNumber(document.getElementById('tx-amount').value);
      const date = document.getElementById('tx-date').value;
      const accountId = document.getElementById('tx-account').value;
      const pocketId = document.getElementById('tx-pocket').value;
      const title = document.getElementById('tx-title').value.trim();

      if (amount <= 0) {
        showToast('Nominal harus lebih dari 0', 'error');
        return;
      }

      const srcAcc = db.accounts.find(a => a.id === accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === pocketId);
      if (!srcAcc || !srcPkt) return;

      const cid = 'cid_' + Date.now();

      if (type === 'transfer') {
        const toAccountId = document.getElementById('tx-to-account').value;
        const toPocketId = document.getElementById('tx-to-pocket').value;
        if (accountId === toAccountId && pocketId === toPocketId) {
          showToast('Pocket tujuan harus berbeda', 'error');
          return;
        }
        const dstAcc = db.accounts.find(a => a.id === toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === toPocketId);
        if (!dstAcc || !dstPkt) return;

        srcPkt.balance = Number(srcPkt.balance) - amount;
        const amountInIDR = toIDR(amount, srcAcc.currency);
        const dstRate = db.exchangeRates[dstAcc.currency] || 1;
        const convertedToDst = dstAcc.currency === srcAcc.currency ? amount : Number((amountInIDR / dstRate).toFixed(2));
        dstPkt.balance = Number(dstPkt.balance) + convertedToDst;

        db.transactions.unshift({
          id: 'trf_' + Date.now(),
          type: 'transfer',
          date,
          amount,
          nilaiKe: convertedToDst,
          categoryId: '',
          subcategoryId: '',
          title: title || `Transfer ke ${dstPkt.name}`,
          accountId,
          pocketId,
          toAccountId,
          toPocketId
        });

        enqueueGasCall('upsert', ['Transfer', {
          tanggal: date,
          dariAkun: srcAcc.name,
          dariPos: srcPkt.name,
          keAkun: dstAcc.name,
          kePos: dstPkt.name,
          nilai: amount,
          nilaiKe: convertedToDst,
          catatan: title
        }]);
        enqueueGasCall('upsert', ['Pos', { id: srcPkt.id, akun: srcAcc.name, nama: srcPkt.name, saldo: srcPkt.balance }]);
        enqueueGasCall('upsert', ['Pos', { id: dstPkt.id, akun: dstAcc.name, nama: dstPkt.name, saldo: dstPkt.balance }]);
      } else {
        const categoryId = document.getElementById('tx-category').value;
        const subcategoryId = document.getElementById('tx-subcategory')?.value || '';
        const cat = db.categories.find(c => c.id === categoryId);
        const sub = cat?.subcategories?.find(s => s.id === subcategoryId);

        if (type === 'expense') srcPkt.balance = Number(srcPkt.balance) - amount;
        else srcPkt.balance = Number(srcPkt.balance) + amount;

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type,
          date,
          amount,
          categoryId,
          subcategoryId,
          title,
          accountId,
          pocketId
        });

        // Kirim ke Code.gs saveTx({ type: 'in'|'out', date, akun, kat, sub, nilai, cat, pos, cur, cid })
        enqueueGasCall('saveTx', [{
          type: type === 'income' ? 'in' : 'out',
          date,
          akun: srcAcc.name,
          kat: cat ? cat.name : 'Lainnya',
          sub: sub ? sub.name : '',
          nilai: amount,
          cat: title,
          pos: srcPkt.name,
          cur: srcAcc.currency,
          cid
        }]);
        enqueueGasCall('upsert', ['Pos', { id: srcPkt.id, akun: srcAcc.name, nama: srcPkt.name, saldo: srcPkt.balance }]);
      }

      touchSessionActivity();
      saveData();
      closeModal();
      showToast('Transaksi tersimpan');
      render();
    }

    function deleteTransaction(txId) {
      const idx = db.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = db.transactions[idx];
      const srcAcc = db.accounts.find(a => a.id === tx.accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === tx.pocketId);

      if (srcPkt) {
        if (tx.type === 'expense') srcPkt.balance += Number(tx.amount) || 0;
        else if (tx.type === 'income') srcPkt.balance -= Number(tx.amount) || 0;
        else if (tx.type === 'transfer') {
          srcPkt.balance += Number(tx.amount) || 0;
          const dstAcc = db.accounts.find(a => a.id === tx.toAccountId);
          const dstPkt = dstAcc?.pockets?.find(p => p.id === tx.toPocketId);
          if (dstPkt) dstPkt.balance -= Number(tx.nilaiKe || tx.amount) || 0;
        }
        enqueueGasCall('upsert', ['Pos', { id: srcPkt.id, akun: srcAcc.name, nama: srcPkt.name, saldo: srcPkt.balance }]);
      }

      if (tx.row && tx.sig) {
        enqueueGasCall('deleteTx', [tx.type === 'income' ? 'in' : 'out', tx.row, tx.sig]);
      }

      db.transactions.splice(idx, 1);
      saveData();
      showToast('Transaksi dihapus');
      render();
    }

    function submitAccountModal(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('acc-name').value.trim();
      const currency = document.getElementById('acc-currency').value;
      const colorId = document.getElementById('acc-color').value;
      const icon = document.getElementById('acc-icon').value;

      if (existingId) {
        const acc = db.accounts.find(a => a.id === existingId);
        if (acc) {
          acc.name = name;
          acc.currency = currency;
          acc.colorId = colorId;
          acc.icon = icon;
          enqueueGasCall('upsert', ['Akun', {
            id: acc.id, nama: acc.name, jenis: acc.jenis || 'Bank',
            saldo: getAccountTotalBalance(acc), cur: acc.currency, urut: acc.urut || 1, warna: acc.colorId
          }]);
        }
        showToast('Perubahan akun disimpan');
      } else {

    function syncCategoryBudgetToGas(cat) {
      const subsMap = {};
      (cat.subcategories || []).forEach(s => { if (s.limit > 0) subsMap[s.name] = s.limit; });
      enqueueGasCall('saveKategori', [{
        id: cat.id,
        type: cat.type === 'income' ? 'in' : 'out',
        nama: cat.name,
        grup: cat.grup || 'Lainnya',
        subs: (cat.subcategories || []).map(s => s.name),
        ang: {
          kat: (cat.subcategories && cat.subcategories.length > 0) ? 0 : (cat.directLimit || 0),
          subs: subsMap
        }
      }]);
    }

    function submitEditCategoryLimit(e, catId) {
      e.preventDefault();
      const cat = db.categories.find(c => c.id === catId);
      if (!cat) return;
      const newLimit = Math.max(0, Number(document.getElementById('input-cat-limit').value) || 0);
      if (cat.subcategories && cat.subcategories.length > 0) {
        const oldSubSum = cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
        if (oldSubSum > 0) {
          let allocated = 0;
          cat.subcategories.forEach((sub, idx) => {
            if (idx === cat.subcategories.length - 1) sub.limit = Math.max(0, newLimit - allocated);
            else {
              const share = Math.round((sub.limit / oldSubSum) * newLimit);
              sub.limit = share;
              allocated += share;
            }
          });
        } else cat.directLimit = newLimit;
      } else {
        cat.directLimit = newLimit;
      }
      syncCategoryBudgetToGas(cat);
      saveData();
      closeModal();
      showToast('Limit kategori diperbarui');
      render();
    }

    function submitSavingGoalModal(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('sav-name').value.trim();
      const targetAmount = Math.max(1000, Number(document.getElementById('sav-target').value) || 0);
      const deadline = document.getElementById('sav-deadline').value;
      const storageAccId = document.getElementById('sav-storage-acc').value;
      let storagePktId = document.getElementById('sav-storage-pkt').value;

      const storageAcc = db.accounts.find(a => a.id === storageAccId);
      if (!storageAcc) return;

      let isNewPocket = false;
      if (storagePktId === '__NEW_POCKET__') {
        isNewPocket = true;
        storagePktId = 'pkt_sav_' + Date.now();
        storageAcc.pockets.push({ id: storagePktId, name, balance: 0, urut: storageAcc.pockets.length + 1 });
      }

      const targetPkt = storageAcc.pockets.find(p => p.id === storagePktId);
      const rate = db.exchangeRates[storageAcc.currency] || 1;
      const todayStr = new Date().toISOString().slice(0, 10);

      if (existingId) {
        const g = db.savingsGoals.find(item => item.id === existingId);
        if (g) {
          g.name = name;
          g.targetAmount = targetAmount;
          g.deadline = deadline;
          g.accountId = storageAccId;
          g.pocketId = storagePktId;
          enqueueGasCall('saveTarget', [{
            id: g.id, nama: name, target: targetAmount, tenggat: deadline,
            akun: storageAcc.name, pos: isNewPocket ? '__new' : (targetPkt?.name || '')
          }]);
        }
        showToast('Target tabungan diperbarui');
      } else {
        const initAmountIDR = Math.max(0, Number(document.getElementById('sav-init')?.value) || 0);
        if (initAmountIDR > 0 && targetPkt) {
          const addInAccCur = storageAcc.currency === 'IDR' ? initAmountIDR : Number((initAmountIDR / rate).toFixed(2));
          targetPkt.balance = Number(targetPkt.balance) + addInAccCur;
        }
        const newGoalId = 'sav_' + Date.now();
        db.savingsGoals.push({
          id: newGoalId,
          name,
          targetAmount,
          currentAmount: initAmountIDR,
          accountId: storageAccId,
          pocketId: storagePktId,
          deadline,
          colorId: 'emerald',
          icon: 'celengan',
          note: '',
          history: initAmountIDR > 0 ? [{ id: 'sh_' + Date.now(), type: 'deposit', amount: initAmountIDR, date: todayStr, note: 'Saldo awal' }] : []
        });
        enqueueGasCall('saveTarget', [{
          nama: name, target: targetAmount, tenggat: deadline,
          akun: storageAcc.name, pos: isNewPocket ? '__new' : (targetPkt?.name || '')
        }]);
        showToast('Target tabungan dibuat');
      }

      saveData();
      closeModal();
      render();
    }

    function submitSavingTransfer(e, goalId, actionType) {
      e.preventDefault();
      const g = (db.savingsGoals || []).find(item => item.id === goalId);
      if (!g) return;
      const amountIDR = Number(document.getElementById('sav-tx-amount').value) || 0;
      const date = document.getElementById('sav-tx-date').value;
      const otherAccId = document.getElementById('sav-tx-acc').value;
      const otherPktId = document.getElementById('sav-tx-pkt').value;
      const note = document.getElementById('sav-tx-note').value.trim();

      const otherAcc = db.accounts.find(a => a.id === otherAccId);
      const otherPkt = otherAcc?.pockets?.find(p => p.id === otherPktId);
      const savAcc = db.accounts.find(a => a.id === g.accountId);
      const savPkt = savAcc?.pockets?.find(p => p.id === g.pocketId);
      if (!otherAcc || !otherPkt || amountIDR <= 0) return;

      const otherRate = db.exchangeRates[otherAcc.currency] || 1;
      const amountInOtherCur = otherAcc.currency === 'IDR' ? amountIDR : Number((amountIDR / otherRate).toFixed(2));
      const savRate = savAcc ? (db.exchangeRates[savAcc.currency] || 1) : 1;
      const amountInSavCur = (!savAcc || savAcc.currency === 'IDR') ? amountIDR : Number((amountIDR / savRate).toFixed(2));

      if (actionType === 'deposit') {
        if (!(savAcc && savPkt && savAcc.id === otherAcc.id && savPkt.id === otherPkt.id)) {
          otherPkt.balance -= amountInOtherCur;
        }
        if (savPkt) savPkt.balance += amountInSavCur;
      } else {
        if (savPkt) savPkt.balance = Math.max(0, savPkt.balance - amountInSavCur);
        if (!(savAcc && savPkt && savAcc.id === otherAcc.id && savPkt.id === otherPkt.id)) {
          otherPkt.balance += amountInOtherCur;
        }
      }

      if (savPkt && savAcc) {
        enqueueGasCall('upsert', ['Pos', { id: savPkt.id, akun: savAcc.name, nama: savPkt.name, saldo: savPkt.balance }]);
      }
      enqueueGasCall('upsert', ['Pos', { id: otherPkt.id, akun: otherAcc.name, nama: otherPkt.name, saldo: otherPkt.balance }]);

      if (!g.history) g.history = [];
      g.history.unshift({ id: 'sh_' + Date.now(), type: actionType, amount: amountIDR, date, note: note || (actionType === 'deposit' ? 'Setor' : 'Tarik') });

      saveData();
      closeModal();
      showToast(actionType === 'deposit' ? 'Setoran tabungan berhasil' : 'Penarikan tabungan berhasil');
      render();
    }

    function submitDebtModal(e) {
      e.preventDefault();
      const type = document.getElementById('debt-type').value;
      const person = document.getElementById('debt-person').value.trim();
      const amount = Number(document.getElementById('debt-amount').value) || 0;
      const dueDate = document.getElementById('debt-due').value;
      const accountId = document.getElementById('debt-account').value;
      const pocketId = document.getElementById('debt-pocket').value;
      const note = document.getElementById('debt-note').value.trim();
      const todayStr = new Date().toISOString().slice(0, 10);

      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || amount <= 0) return;

      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? amount : Number((amount / rate).toFixed(2));
      if (type === 'payable') pkt.balance += amountInAccCur;
      else pkt.balance -= amountInAccCur;

      const newDebtId = 'debt_' + Date.now();
      db.debts.unshift({ id: newDebtId, type, person, totalAmount: amount, paidAmount: 0, dueDate, note, accountId, pocketId, createdAt: todayStr });

      enqueueGasCall('upsert', ['Hutang', {
        id: newDebtId,
        jenis: type === 'receivable' ? 'Piutang' : 'Hutang',
        pihak: person,
        total: amount,
        sisa: amount,
        tempo: dueDate,
        catatan: note
      }]);
      enqueueGasCall('upsert', ['Pos', { id: pkt.id, akun: acc.name, nama: pkt.name, saldo: pkt.balance }]);

      saveData();
      closeModal();
      showToast('Catatan hutang/piutang disimpan');
      render();
    }

    function openSettleDebtModal(debtId) {
      const d = db.debts.find(item => item.id === debtId);
      if (!d) return;
      const remaining = Math.max(0, d.totalAmount - d.paidAmount);
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">${d.type === 'payable' ? 'BAYAR HUTANG' : 'TERIMA PIUTANG'}</h3>

                class="w-full px-3.5 py-2.5 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-base font-medium text-ink" />
            </div>
            <div>

                ${db.accounts.map(a => `<option value="${a.id}" ${a.id === d.accountId ? 'selected' : ''}>${a.name}</option>`).join('')}

            </div>
          </form>
        </div>
      `);
    }

    function submitSettleDebt(e, debtId) {
      e.preventDefault();
      const d = db.debts.find(item => item.id === debtId);
      if (!d) return;
      const payVal = Number(document.getElementById('settle-amount').value) || 0;
      const accountId = document.getElementById('settle-account').value;
      const acc = db.accounts.find(a => a.id === accountId) || db.accounts[0];
      const pkt = acc?.pockets?.[0];
      if (!acc || !pkt || payVal <= 0) return;

      const todayStr = new Date().toISOString().slice(0, 10);
      d.paidAmount += payVal;
      if (d.type === 'payable') pkt.balance -= payVal;
      else pkt.balance += payVal;

      enqueueGasCall('payHutang', [d.id, acc.name, payVal, todayStr]);
      enqueueGasCall('upsert', ['Pos', { id: pkt.id, akun: acc.name, nama: pkt.name, saldo: pkt.balance }]);

      saveData();
      closeModal();
      showToast('Pembayaran dicatat');
      render();
    }

    function submitManageSubcategory(e, catId, subId) {
