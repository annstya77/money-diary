    * {

    }

    }

      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }

      background: rgba(66, 47, 14, 0.16);
      border-radius: 999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes catSway {
      0%, 100% { transform: rotate(-4deg) translateY(0); }
      50% { transform: rotate(4deg) translateY(-3px); }
    }
    @keyframes catSwayR {
      0%, 100% { transform: rotate(4deg) translateY(0); }
      50% { transform: rotate(-4deg) translateY(-3px); }
    }
    @keyframes catBob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.04); }
    }

    .cat-butter { animation: catSwayR 3.4s ease-in-out infinite; }
    .cat-bob { animation: catBob 2.6s ease-in-out infinite; }

    function loadData() {

        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultData();
        const parsed = JSON.parse(raw);
        const def = getDefaultData();
        return {
          gasConfig: { ...def.gasConfig, ...(parsed.gasConfig || {}) },
          pendingQueue: Array.isArray(parsed.pendingQueue) ? parsed.pendingQueue : [],
          security: { ...def.security, ...(parsed.security || {}) },
          exchangeRates: { ...def.exchangeRates, ...(parsed.exchangeRates || {}) },
          exchangeRateMeta: parsed.exchangeRateMeta || def.exchangeRateMeta,
          categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : def.categories,
          accounts: Array.isArray(parsed.accounts) && parsed.accounts.length ? parsed.accounts : def.accounts,
          transactions: Array.isArray(parsed.transactions) ? parsed.transactions : def.transactions,
          debts: Array.isArray(parsed.debts) ? parsed.debts : [],
          savingsGoals: Array.isArray(parsed.savingsGoals) ? parsed.savingsGoals : []
        };
      } catch (e) {

    // =========================================================================
    // 3. BRIDGE KOMUNIKASI LANGSUNG KE GOOGLE APPS SCRIPT (Code.gs)
    // =========================================================================
    async function callGasApi(fn, args = []) {
      const url = (db.gasConfig?.url || '').trim();
      const key = (db.gasConfig?.key || '').trim();
      if (!url || !key) {
        throw new Error('URL Web App atau Kunci Rahasia belum diisi');
      }

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key, fn, args })
      });

      const json = await res.json();
      if (!json || !json.ok) {
        throw new Error(json?.error || 'Respons API gagal');
      }
      return json.data;
    }

    function enqueueGasCall(fn, args = []) {
      if (!db.gasConfig?.url || !db.gasConfig?.key) return;
      db.pendingQueue.push({ id: 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), fn, args });
      saveData();
      flushGasQueue(true);
    }

    async function flushGasQueue(silent = true) {
      if (isSyncingGas) return;
      if (!db.gasConfig?.url || !db.gasConfig?.key) return;
      if (!db.pendingQueue || db.pendingQueue.length === 0) return;

      isSyncingGas = true;
      db.gasConfig.status = 'syncing';
      if (!silent) render();

      try {
        while (db.pendingQueue.length > 0) {
          const job = db.pendingQueue[0];
          await callGasApi(job.fn, job.args);
          db.pendingQueue.shift();
          saveData();
        }
        const now = new Date();
        db.gasConfig.lastSyncAt = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
        db.gasConfig.status = 'ok';
        saveData();
        if (!silent) showToast('Semua perubahan tersinkron ke Google Sheets');
      } catch (err) {
        db.gasConfig.status = 'error';
        saveData();
        if (!silent) showToast('Sync tertunda: ' + err.message, 'error');
      } finally {
        isSyncingGas = false;
        render();
      }
    }

    async function syncPullFromSheets(silent = false) {
      if (isSyncingGas) return;
      if (!db.gasConfig?.url || !db.gasConfig?.key) {
        if (!silent) showToast('Isi URL Web App & Kunci Rahasia di Pengaturan', 'error');
        return;
      }

      if (db.pendingQueue.length > 0) {
        await flushGasQueue(true);
      }

      isSyncingGas = true;
      db.gasConfig.status = 'syncing';
      if (!silent) render();

      try {
        const remote = await callGasApi('load', []);
        if (remote) {
          applyRemoteSheetsData(remote);
        }
        const now = new Date();
        db.gasConfig.lastSyncAt = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
        db.gasConfig.status = 'ok';
        saveData();
        if (!silent) showToast('Data berhasil dimuat dari Google Sheets!');
      } catch (err) {
        db.gasConfig.status = 'error';
        saveData();
        if (!silent) showToast('Gagal sync Sheets: ' + err.message, 'error');
      } finally {
        isSyncingGas = false;
        render();
      }
    }

    function applyRemoteSheetsData(remote) {
      if (Array.isArray(remote.akun) && remote.akun.length > 0) {
        const remotePos = Array.isArray(remote.pos) ? remote.pos : [];
        db.accounts = remote.akun
          .sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0))
          .map((a, idx) => {
            const oldAcc = db.accounts.find(x => x.id === a.id || x.name === a.nama);
            const matchedPos = remotePos
              .filter(p => p.akun === a.nama)
              .sort((x, y) => (Number(x.urut) || 0) - (Number(y.urut) || 0));

            const pockets = matchedPos.length > 0
              ? matchedPos.map((p, pi) => ({
                  id: p.id || ('pkt_' + a.id + '_' + pi),
                  name: p.nama,
                  balance: Number(p.saldo) || 0,
                  urut: Number(p.urut) || (pi + 1)
                }))
              : [{ id: 'pkt_' + a.id + '_0', name: 'Pocket Utama', balance: Number(a.saldo) || 0, urut: 1 }];

            return {
              id: a.id || ('acc_' + idx),
              name: a.nama,
              jenis: a.jenis || 'Bank',
              currency: a.cur || 'IDR',
              colorId: a.warna || oldAcc?.colorId || ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length].id,
              icon: oldAcc?.icon || (String(a.jenis).toLowerCase() === 'cash' ? 'wallet' : 'bank'),
              urut: Number(a.urut) || (idx + 1),
              pockets
            };
          });
      }

      if (Array.isArray(remote.kat) && remote.kat.length > 0) {
        const remoteAng = Array.isArray(remote.ang) ? remote.ang : [];
        db.categories = remote.kat
          .sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0))
          .map(k => {
            const type = k.type === 'in' ? 'income' : 'expense';
            const subNames = String(k.subs || '').split('|').map(s => s.trim()).filter(Boolean);
            const catBudgetRow = remoteAng.find(r => r.kat === k.nama && !r.sub);

            const subcategories = subNames.map((sn, si) => {
              const subBudgetRow = remoteAng.find(r => r.kat === k.nama && r.sub === sn);
              return {
                id: `sub_${k.id}_${si}`,
                name: sn,
                limit: subBudgetRow ? Number(subBudgetRow.nilai) || 0 : 0
              };
            });

            return {
              id: k.id,
              name: k.nama,
              type,
              grup: k.grup || 'Lainnya',
              directLimit: subcategories.length === 0 && catBudgetRow ? (Number(catBudgetRow.nilai) || 0) : 0,
              subcategories
            };
          });
      }

      const mergedTx = [];
      if (Array.isArray(remote.tx)) {
        remote.tx.forEach((t, idx) => {
          const type = t.type === 'in' ? 'income' : 'expense';
          const acc = db.accounts.find(a => a.name === t.akun) || db.accounts[0];
          const pkt = acc?.pockets?.find(p => p.name === t.pos) || acc?.pockets?.[0];
          const cat = db.categories.find(c => c.type === type && c.name === t.kat) || db.categories.find(c => c.type === type);
          const sub = cat?.subcategories?.find(s => s.name === t.sub);

          mergedTx.push({
            id: `tx_r_${t.type}_${t.row || idx}`,
            row: t.row,
            sig: t.sig,
            type,
            date: t.date,
            amount: Number(t.nilai) || 0,
            categoryId: cat ? cat.id : '',
            subcategoryId: sub ? sub.id : '',
            title: t.cat || '',
            accountId: acc ? acc.id : '',
            pocketId: pkt ? pkt.id : ''
          });
        });
      }

      if (Array.isArray(remote.trf)) {
        remote.trf.forEach(tr => {
          const srcAcc = db.accounts.find(a => a.name === tr.dariAkun) || db.accounts[0];
          const srcPkt = srcAcc?.pockets?.find(p => p.name === tr.dariPos) || srcAcc?.pockets?.[0];
          const dstAcc = db.accounts.find(a => a.name === tr.keAkun) || db.accounts[0];
          const dstPkt = dstAcc?.pockets?.find(p => p.name === tr.kePos) || dstAcc?.pockets?.[0];

          mergedTx.push({
            id: tr.id || ('trf_' + Date.now()),
            type: 'transfer',
            date: tr.tanggal,
            amount: Number(tr.nilai) || 0,
            nilaiKe: Number(tr.nilaiKe) || Number(tr.nilai) || 0,
            categoryId: '',
            subcategoryId: '',
            title: tr.catatan || `Transfer ke ${tr.kePos || tr.keAkun}`,
            accountId: srcAcc ? srcAcc.id : '',
            pocketId: srcPkt ? srcPkt.id : '',
            toAccountId: dstAcc ? dstAcc.id : '',
            toPocketId: dstPkt ? dstPkt.id : ''
          });
        });
      }

      if (mergedTx.length > 0) {
        db.transactions = mergedTx;
      }

      if (Array.isArray(remote.target)) {
        db.savingsGoals = remote.target.map((tg, idx) => {
          const oldGoal = db.savingsGoals.find(x => x.id === tg.id);
          const acc = db.accounts.find(a => a.name === tg.akun) || db.accounts[0];
          const pkt = acc?.pockets?.find(p => p.name === tg.pos) || acc?.pockets?.[0];
          const balIDR = pkt ? toIDR(pkt.balance, acc.currency) : 0;

          return {
            id: tg.id,
            name: tg.nama,
            targetAmount: Number(tg.target) || 0,
            currentAmount: balIDR,
            accountId: acc ? acc.id : '',
            pocketId: pkt ? pkt.id : '',
            deadline: tg.tenggat || '',
            colorId: oldGoal?.colorId || ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length].id,
            icon: oldGoal?.icon || 'celengan',
            note: oldGoal?.note || 'Terhubung ke Google Sheets',
            history: oldGoal?.history || []
          };
        });
      }

      if (Array.isArray(remote.hutang)) {
        db.debts = remote.hutang.map(h => {
          const isPiutang = String(h.jenis).toLowerCase() === 'piutang';
          const total = Number(h.total) || 0;
          const sisa = Number(h.sisa) || 0;
          return {
            id: h.id,
            type: isPiutang ? 'receivable' : 'payable',
            person: h.pihak,
            totalAmount: total,
            paidAmount: Math.max(0, total - sisa),
            dueDate: h.tempo || '',
            note: h.catatan || '',
            accountId: db.accounts[0]?.id || '',
            pocketId: db.accounts[0]?.pockets?.[0]?.id || ''
          };
        });
      }
    }

    function generateCatIconDataURL(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FBF6EA';
      ctx.fillRect(0, 0, size, size);

      const cx = size / 2;
      const cy = size * 0.56;
      const r = size * 0.30;

      ctx.fillStyle = '#F6D57A';
      ctx.strokeStyle = '#422F0E';
      ctx.lineWidth = Math.max(3, size * 0.03);
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(cx - r * 0.85, cy - r * 0.35);
      ctx.lineTo(cx - r * 0.58, cy - r * 1.25);
      ctx.lineTo(cx - r * 0.12, cy - r * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + r * 0.85, cy - r * 0.35);
      ctx.lineTo(cx + r * 0.58, cy - r * 1.25);
      ctx.lineTo(cx + r * 0.12, cy - r * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#FCE39C';
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.05, r * 0.88, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#422F0E';
      ctx.beginPath();
      ctx.arc(cx - r * 0.38, cy - r * 0.08, r * 0.11, 0, Math.PI * 2);
      ctx.arc(cx + r * 0.38, cy - r * 0.08, r * 0.11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#EF6545';
      ctx.beginPath();
      ctx.moveTo(cx, cy + r * 0.08);
      ctx.lineTo(cx - r * 0.12, cy + r * 0.22);
      ctx.lineTo(cx + r * 0.12, cy + r * 0.22);
      ctx.closePath();
      ctx.fill();

      const coinR = size * 0.14;
      const coinX = cx + r * 0.82;
      const coinY = cy + r * 0.68;
      ctx.fillStyle = '#F4C95D';
      ctx.beginPath();
      ctx.arc(coinX, coinY, coinR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#422F0E';
      ctx.font = `600 ${Math.round(coinR * 1.05)}px "Fredoka", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Rp', coinX, coinY + 1);

      return canvas.toDataURL('image/png');
    }

    function simpleHashPin(pin) {
      let hash = 0;
      const str = String(pin || '');
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return 'pin_' + Math.abs(hash).toString(36) + '_' + str.length;
    }

    function isSessionExpired() {
      if (!db.security?.enabled || !db.security?.pinHash) return false;
      if (db.security.lockedNow) return true;
      const last = Number(db.security.lastActiveAt) || 0;
      return (Date.now() - last) > SESSION_TIMEOUT_MS;
    }

    function touchSessionActivity() {
      if (!db.security) return;
      db.security.lastActiveAt = Date.now();
      saveData();
    }

    function updateLockScreenVisibility() {
      const lockEl = document.getElementById('lock-screen');
      if (!lockEl) return;
      if (isSessionExpired()) {
        lockEl.classList.remove('hidden');
        lockEl.classList.add('flex');
      } else {
        lockEl.classList.add('hidden');
        lockEl.classList.remove('flex');
        if (db.security?.enabled) {
          db.security.lastActiveAt = Date.now();
          saveData();
        }
      }
    }

    function submitUnlockApp(e) {
      e.preventDefault();
      const input = document.getElementById('lock-pin-input');
      const errMsg = document.getElementById('lock-error-msg');
      const entered = input?.value || '';

      if (simpleHashPin(entered) === db.security?.pinHash) {
        db.security.lockedNow = false;
        db.security.lastActiveAt = Date.now();
        saveData();
        if (input) input.value = '';
        if (errMsg) errMsg.classList.add('hidden');
        updateLockScreenVisibility();
        showToast('Aplikasi terbuka');
      } else {
        if (errMsg) errMsg.classList.remove('hidden');
      }
    }

    function lockAppNow() {
      if (!db.security?.enabled || !db.security?.pinHash) {
        openPinSetupModal();
        return;
      }
      db.security.lockedNow = true;
      saveData();
      updateLockScreenVisibility();
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      const icon = document.getElementById('toast-icon');
      const msgEl = document.getElementById('toast-msg');
      if (!toast || !msgEl) return;

      inner.className = type === 'error'
        ? 'bg-coral text-white text-xs font-normal px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2'
        : 'bg-ink text-[#FBF6EA] text-xs font-normal px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2';
      icon.textContent = type === 'error' ? '⚠️' : '✓';
      msgEl.textContent = msg;

      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    function formatNumberID(num, decimals = 0) {
      const n = Number(num) || 0;
      return n.toLocaleString('id-ID', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || CURRENCY_META.IDR;
      const n = Number(amount) || 0;
      const absStr = formatNumberID(Math.abs(n), meta.decimals);
      const sign = n < 0 ? '-' : '';
      return currency === 'IDR' ? `${sign}Rp ${absStr}` : `${sign}${meta.symbol} ${absStr}`;
    }

    function toIDR(amount, currency = 'IDR') {
      const rate = Number(db.exchangeRates?.[currency]) || 1;
      return (Number(amount) || 0) * rate;
    }

    function getTxCurrency(tx) {
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc ? acc.currency : 'IDR';
    }

    function getAccountTotalBalance(acc) {
      return (acc.pockets || []).reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    function getTotalNetWorthIDR() {
      return db.accounts.reduce((sum, acc) => sum + toIDR(getAccountTotalBalance(acc), acc.currency), 0);
    }

    function getCategoryLimit(cat) {
      if (cat.subcategories && cat.subcategories.length > 0) {
        return cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
      }
      return Number(cat.directLimit) || 0;
    }

    function getSavingGoalBalanceIDR(goal) {
      const acc = db.accounts.find(a => a.id === goal.accountId);
      const pkt = acc?.pockets?.find(p => p.id === goal.pocketId);
      if (acc && pkt) return Math.max(0, toIDR(pkt.balance, acc.currency));
      return Math.max(0, Number(goal.currentAmount) || 0);
    }

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(t => {
        if (!t.date) return false;
        const parts = t.date.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        return mode === 'yearly' ? y === year : (y === year && m === month);
      });
    }

    async function fetchLiveExchangeRates(silent = false) {
      if (isFetchingRates) return;
      isFetchingRates = true;
      if (!silent) render();
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/IDR');
        const data = await res.json();
        if (data && data.result === 'success' && data.rates) {
          Object.keys(CURRENCY_META).forEach(code => {
            if (code !== 'IDR' && data.rates[code] > 0) {
              const idrPerUnit = 1 / data.rates[code];
              db.exchangeRates[code] = code === 'JPY' ? Number(idrPerUnit.toFixed(2)) : Math.round(idrPerUnit);
            }
          });
          const now = new Date();
          const label = `${now.getDate()} ${MONTH_NAMES_ID[now.getMonth()]} ${now.getFullYear()}, ${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
          db.exchangeRateMeta = { source: 'live', lastUpdated: label };
          saveData();
          if (!silent) showToast('Kurs live (termasuk THB Baht) berhasil disinkronkan');
        }
      } catch (e) {
        if (!silent) showToast('Menggunakan kurs tersimpan lokal', 'error');
      } finally {
        isFetchingRates = false;
        render();
      }
    }

    function shiftPeriod(target, delta) {
      if (target === 'akun') {
        if (ui.akunPeriodMode === 'yearly') ui.akunYear += delta;
        else {
          ui.akunMonth += delta;
          if (ui.akunMonth < 0) { ui.akunMonth = 11; ui.akunYear -= 1; }
          if (ui.akunMonth > 11) { ui.akunMonth = 0; ui.akunYear += 1; }
        }
      } else if (target === 'stat') {
        if (ui.statPeriodMode === 'yearly') ui.statYear += delta;
        else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear -= 1; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear += 1; }
        }
      }
      render();

    function buildPieChartSvg(slices) {
      if (!slices || slices.length === 0) {
        return `
          <div class="w-48 h-48 mx-auto rounded-full bg-creamSoft border border-dashed border-[#DFD2B4] flex items-center justify-center text-center p-4">
            <span class="text-xs text-slate-400">Belum ada data pada periode ini</span>
          </div>
        `;
      }

      const cx = 180;
      const cy = 115;
      const r = 68;
      let startAngle = -Math.PI / 2;

      const paths = [];
      const callouts = [];

      slices.forEach((s, idx) => {
        const pct = s.pct || 0;
        const angle = (pct / 100) * Math.PI * 2;
        const endAngle = startAngle + angle;
        const midAngle = startAngle + angle / 2;

        const x1 = cx + r * Math.cos(startAngle);
        const y1 = cy + r * Math.sin(startAngle);
        const x2 = cx + r * Math.cos(endAngle);
        const y2 = cy + r * Math.sin(endAngle);
        const largeArc = angle > Math.PI ? 1 : 0;

        if (slices.length === 1 || pct >= 99.95) {
          paths.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.color}" stroke="#FFFDF8" stroke-width="2" />`);
        } else {
          paths.push(
            `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${s.color}" stroke="#FFFDF8" stroke-width="1.8" />`
          );
        }

        if (idx < 7 && pct >= 0.1) {
          const lx1 = cx + (r + 3) * Math.cos(midAngle);
          const ly1 = cy + (r + 3) * Math.sin(midAngle);
          const lx2 = cx + (r + 16) * Math.cos(midAngle);
          const ly2 = cy + (r + 16) * Math.sin(midAngle);
          const isRight = Math.cos(midAngle) >= 0;
          const labelX = isRight ? Math.min(352, lx2 + 8) : Math.max(8, lx2 - 8);
          const anchor = isRight ? 'start' : 'end';
          const shortName = s.name.length > 14 ? s.name.slice(0, 13) + '…' : s.name;

          callouts.push(`
            <polyline points="${lx1.toFixed(1)},${ly1.toFixed(1)} ${lx2.toFixed(1)},${ly2.toFixed(1)} ${labelX.toFixed(1)},${ly2.toFixed(1)}"
              fill="none" stroke="${s.color}" stroke-width="1.3" />
            <text x="${labelX.toFixed(1)}" y="${(ly2 - 3).toFixed(1)}" text-anchor="${anchor}"
              class="fill-ink text-[10px]" style="font-family:'Fredoka',sans-serif;font-weight:500;">${shortName}</text>
            <text x="${labelX.toFixed(1)}" y="${(ly2 + 9).toFixed(1)}" text-anchor="${anchor}"
              class="fill-slate-500 text-[9.5px]" style="font-family:'Fredoka',sans-serif;">${pct.toFixed(1)}%</text>
          `);
        }

        startAngle = endAngle;
      });

      return `
        <svg viewBox="0 0 360 230" class="w-full max-w-[360px] mx-auto overflow-visible">
          ${paths.join('')}
          ${callouts.join('')}
        </svg>
      `;
    }

    function renderStatistikView() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth);
      const periodLabel = ui.statPeriodMode === 'yearly'

      // Drilldown per kategori
      if (ui.drilldownCategoryId) {
        const cat = db.categories.find(c => c.id === ui.drilldownCategoryId);
        if (cat) {
          let catTxs = periodTxs.filter(t => t.type === cat.type && t.categoryId === cat.id);

            catTxs = catTxs.filter(t => t.subcategoryId === ui.drilldownSubcategoryId);

            </div>

      }

      // Hitung total pendapatan & pengeluaran periode terpilih
      let totalIncomeIDR = 0;
      let totalExpenseIDR = 0;
      periodTxs.forEach(t => {
        const valIDR = toIDR(t.amount, getTxCurrency(t));

        if (t.type === 'expense') totalExpenseIDR += valIDR;

          .filter(t => t.type === activeChartType && t.categoryId === cat.id)

        };

      const pieSlices = pieSlicesRaw.map((item, idx) => ({

      // Evaluasi Budget
      const expenseCats = db.categories.filter(c => c.type === 'expense');
      const totalBudgetLimit = expenseCats.reduce((s, c) => s + getCategoryLimit(c), 0);
      const budgetPctOverall = totalBudgetLimit > 0 ? (totalExpenseIDR / totalBudgetLimit) * 100 : 0;

      return `

              <button onclick="shiftPeriod('stat', -1)" class="w-8 h-8 rounded-xl bg-creamSoft flex items-center justify-center text-ink active:scale-95">‹</button>
              <span class="text-xs font-medium text-ink">${periodLabel}</span>
              <button onclick="shiftPeriod('stat', 1)" class="w-8 h-8 rounded-xl bg-creamSoft flex items-center justify-center text-ink active:scale-95">›</button>
            </div>

            <!-- Switch Tab Pendapatan vs Pengeluaran -->

              <button onclick="setStatChartType('income')"

                <div class="text-[11px] font-medium text-sage">Pendapatan</div>

              <button onclick="setStatChartType('expense')"

              </div>
              <div class="w-full h-2.5 rounded-full bg-creamSoft overflow-hidden">
                <div class="h-full rounded-full transition-all ${budgetPctOverall > 100 ? 'bg-coral' : budgetPctOverall > 80 ? 'bg-butter' : 'bg-sage'}"
                  style="width: ${Math.min(100, budgetPctOverall)}%;"></div>
              </div>
            </div>

            <div class="divide-y divide-stone-100 pt-1">
              ${expenseCats.map(cat => {
                const limit = getCategoryLimit(cat);
                const spent = periodTxs
                  .filter(t => t.type === 'expense' && t.categoryId === cat.id)
                  .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
                const pct = limit > 0 ? (spent / limit) * 100 : (spent > 0 ? 100 : 0);
                const isOver = limit > 0 && spent > limit;
                const isExpanded = Boolean(ui.expandedBudgetCats[cat.id]);
                const hasSubs = Array.isArray(cat.subcategories) && cat.subcategories.length > 0;

                return `
                  <div class="py-3 space-y-2">
                    <div class="flex items-center justify-between gap-2">
                      <button onclick="${hasSubs ? `toggleBudgetCatExpand('${cat.id}')` : `openCategoryDrilldown('${cat.id}')`}" class="flex items-center gap-2 text-left min-w-0">
                        <span class="text-xs font-medium text-ink truncate">${cat.name}</span>
                        ${hasSubs ? `<span class="text-[10px] px-1.5 py-0.5 rounded-md bg-creamSoft text-slate-500">${isExpanded ? '▲' : '▼'} Sub</span>` : ''}
                      </button>
                      <div class="text-right shrink-0">
                        <span class="text-xs font-medium ${isOver ? 'text-coral' : 'text-ink'}">${formatCurrency(spent)}</span>
                        <span class="text-[11px] text-slate-400"> / ${formatCurrency(limit)}</span>
                      </div>
                    </div>

                    <div class="w-full h-2 rounded-full bg-creamSoft overflow-hidden">
                      <div class="h-full rounded-full ${isOver ? 'bg-coral' : pct > 80 ? 'bg-butter' : 'bg-sage'}"
                        style="width: ${Math.min(100, pct)}%;"></div>
                    </div>

                    <div class="flex items-center justify-between text-[11px]">
                      <span class="${isOver ? 'text-coral font-medium' : 'text-slate-400'}">
                        ${limit > 0
                          ? (isOver
                              ? `Melebihi budget ${formatCurrency(spent - limit)}`
                              : `Sisa budget ${formatCurrency(limit - spent)}`)
                          : 'Belum ada batas limit'}
                      </span>
                      <button onclick="openCategoryDrilldown('${cat.id}')" class="text-sage font-medium hover:underline">Lihat detail ›</button>
                    </div>

                    ${hasSubs && isExpanded ? `
                      <div class="mt-2 pl-3 border-l-2 border-[#E8DEC5] space-y-2">
                        ${cat.subcategories.map(sub => {
                          const subSpent = periodTxs
                            .filter(t => t.type === 'expense' && t.categoryId === cat.id && t.subcategoryId === sub.id)
                            .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
                          const subLimit = Number(sub.limit) || 0;
                          const subPct = subLimit > 0 ? Math.min(100, (subSpent / subLimit) * 100) : (subSpent > 0 ? 100 : 0);
                          return `
                            <div class="space-y-1">
                              <div class="flex justify-between text-[11px]">
                                <span class="text-slate-600">${sub.name}</span>
                                <span class="text-ink font-medium">${formatCurrency(subSpent)} <span class="text-slate-400 font-normal">/ ${formatCurrency(subLimit)}</span></span>
                              </div>
                              <div class="w-full h-1.5 rounded-full bg-creamSoft overflow-hidden">
                                <div class="h-full rounded-full ${subLimit > 0 && subSpent > subLimit ? 'bg-coral' : 'bg-peanut'}" style="width: ${subPct}%;"></div>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. VIEW 3: AKUN, POCKET & TOTAL KEKAYAAN (HEADER ORANGE #FF9B71)
    // =========================================================================
    function openWealthDetailModal() {
      const year = ui.akunYear || 2026;
      const currentNetWorthIDR = getTotalNetWorthIDR();

      const monthlyNetFlow = Array.from({ length: 12 }, (_, mIdx) => {
        const mTxs = filterTransactionsByPeriod(db.transactions, 'monthly', year, mIdx);
        let inc = 0;
        let exp = 0;
        mTxs.forEach(t => {
          const val = toIDR(t.amount, getTxCurrency(t));
          if (t.type === 'income') inc += val;
          if (t.type === 'expense') exp += val;
        });
        return { monthIndex: mIdx, inc, exp, net: inc - exp };
      });

      const totalYearInc = monthlyNetFlow.reduce((s, x) => s + x.inc, 0);
      const totalYearExp = monthlyNetFlow.reduce((s, x) => s + x.exp, 0);
      const totalYearNet = totalYearInc - totalYearExp;

      const activeMonthIdx = ui.akunPeriodMode === 'monthly' ? ui.akunMonth : 11;
      const monthBalances = Array(12).fill(0);
      monthBalances[activeMonthIdx] = currentNetWorthIDR;

      for (let m = activeMonthIdx - 1; m >= 0; m--) {
        monthBalances[m] = monthBalances[m + 1] - monthlyNetFlow[m + 1].net;
      }
      for (let m = activeMonthIdx + 1; m < 12; m++) {
        monthBalances[m] = monthBalances[m - 1] + monthlyNetFlow[m].net;
      }

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h3 class="text-base font-medium uppercase text-ink">DETAIL KEKAYAAN (${year})</h3>
              <p class="text-[11px] text-slate-400">Rincian Januari – Desember • Mode ${ui.akunPeriodMode === 'yearly' ? 'Tahunan' : 'Bulanan'}</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>

          <div class="bg-creamSoft rounded-2xl p-3.5 border border-[#E8DEC5] flex items-center justify-between">
            <div>
              <span class="text-[11px] text-slate-500 block">Total Kekayaan Saat Ini</span>
              <span class="text-base font-medium text-ink">${formatCurrency(currentNetWorthIDR)}</span>
            </div>
            <span class="px-2.5 py-1 rounded-xl bg-creamCard border border-[#E8DEC5] text-[11px] font-medium text-ink">
              ${ui.akunPeriodMode === 'yearly' ? `Tahunan ${year}` : `Bulanan ${MONTH_NAMES_ID[ui.akunMonth]} ${year}`}
            </span>
          </div>

          <div class="max-h-72 overflow-y-auto divide-y divide-stone-100 border border-[#E8DEC5] rounded-2xl bg-creamCard px-3">
            ${monthlyNetFlow.map((row, idx) => {
              const estWealth = monthBalances[idx];
              const netSign = row.net >= 0 ? '+' : '-';
              return `
                <div class="py-2.5 flex items-center justify-between gap-2">
                  <div>
                    <div class="text-xs font-medium text-ink">${MONTH_FULL_NAMES_ID[idx]} ${year}</div>
                    <div class="text-[10px] text-slate-400">
                      Masuk: +${formatCurrency(row.inc)} • Keluar: -${formatCurrency(row.exp)}
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-xs font-medium text-ink">${formatCurrency(estWealth)}</div>
                    <div class="text-[10px] font-medium ${row.net >= 0 ? 'text-sage' : 'text-coral'}">
                      Selisih: ${netSign}${formatCurrency(Math.abs(row.net))}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="bg-creamSoft rounded-2xl p-3 border border-[#E8DEC5] grid grid-cols-3 gap-2 text-center">
            <div>
              <span class="text-[10px] text-slate-400 block">Masuk ${year}</span>
              <span class="text-xs font-medium text-sage">+${formatCurrency(totalYearInc)}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">Keluar ${year}</span>
              <span class="text-xs font-medium text-coral">-${formatCurrency(totalYearExp)}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">Selisih ${year}</span>
              <span class="text-xs font-medium text-ink">${totalYearNet >= 0 ? '+' : '-'}${formatCurrency(Math.abs(totalYearNet))}</span>
            </div>
          </div>

          <button onclick="closeModal()" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Tutup</button>
        </div>
      `);
    }

    function renderAkunView() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.akunPeriodMode, ui.akunYear, ui.akunMonth);
      const periodLabel = ui.akunPeriodMode === 'yearly'
        ? `${ui.akunYear}`
        : `${MONTH_NAMES_ID[ui.akunMonth]} ${ui.akunYear}`;

      let periodIn = 0;
      let periodOut = 0;
      periodTxs.forEach(t => {

        if (t.type === 'income') periodIn += val;
        if (t.type === 'expense') periodOut += val;

      const periodDiff = periodIn - periodOut;
      const totalNetWorthIDR = getTotalNetWorthIDR();

      const syncStatus = db.gasConfig?.status || 'offline';
      const syncDotColor = syncStatus === 'ok' ? 'bg-emerald-300' : syncStatus === 'syncing' ? 'bg-amber-200' : syncStatus === 'error' ? 'bg-red-200' : 'bg-[#FFF9EB]';
      const syncText = syncStatus === 'ok'
        ? `Sheets Sync ${db.gasConfig.lastSyncAt || ''}`

            ? `Antrean ${db.pendingQueue.length} item`

      return `

          <div class="rounded-3xl p-4 shadow-sm border space-y-3.5" style="background-color: #FF9B71; border-color: #EB8458;">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0">
                <h1 class="text-base font-medium uppercase tracking-wider text-[#FFFDF8] truncate">AKUN</h1>
                <button onclick="syncPullFromSheets(false)" class="inline-flex items-center gap-1.5 text-[11px] mt-0.5" style="color: #FFF9EB;">
                  <span class="w-2 h-2 rounded-full ${syncDotColor}"></span>
                  <span>${syncText}</span>
                  <span>↻</span>
                </button>
              </div>

              <button onclick="openAccountModal()" class="px-3.5 py-2 rounded-2xl text-xs font-medium shadow-sm active:scale-95 transition-all shrink-0" style="background-color: #422F0E; color: #FFF9EB;">
                + Akun
              </button>
            </div>

            <div class="flex items-center justify-between gap-2 pt-2 border-t" style="border-color: rgba(255, 253, 248, 0.45);">
              <div class="inline-flex rounded-2xl bg-creamCard p-1">
                <button onclick="setAkunPeriodMode('monthly')"
                  class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${ui.akunPeriodMode === 'monthly' ? 'bg-[#422F0E] text-[#FFF9EB]' : 'text-ink'}">
                  Bulanan
                </button>
                <button onclick="setAkunPeriodMode('yearly')"
                  class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${ui.akunPeriodMode === 'yearly' ? 'bg-[#422F0E] text-[#FFF9EB]' : 'text-ink'}">
                  Tahunan
                </button>
              </div>

              <div class="flex items-center gap-1.5 bg-creamCard rounded-2xl px-2 py-1">
                <button onclick="shiftPeriod('akun', -1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-ink">‹</button>
                <span class="text-xs font-medium text-ink px-1">${periodLabel}</span>
                <button onclick="shiftPeriod('akun', 1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-ink">›</button>
              </div>
            </div>
          </div>

          <!-- Kartu Total Kekayaan -->
          <div class="rounded-3xl p-4 shadow-sm border border-[#EED9A5] space-y-3" style="background-color: #FFF4D4;">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[11px] font-medium uppercase tracking-wider text-[#6B4C1E]">TOTAL KEKAYAAN (KONVERSI IDR)</span>
              <div class="flex items-center gap-1.5">
                <button onclick="fetchLiveExchangeRates(false)"
                  class="px-2.5 py-1 rounded-xl bg-creamCard border border-[#E5D3A3] text-[11px] font-medium text-ink hover:bg-creamSoft">
                  ${isFetchingRates ? '↻ ...' : '↻ Kurs'}
                </button>
                <button onclick="openWealthDetailModal()"
                  class="px-3 py-1 rounded-xl bg-ink text-[#FBF6EA] text-[11px] font-medium hover:opacity-95 active:scale-95 transition-all">
                  Detail
                </button>
              </div>
            </div>

            <div class="text-2xl font-medium text-ink tracking-tight">
              ${formatCurrency(totalNetWorthIDR)}
            </div>

            <div class="grid grid-cols-3 gap-2 pt-2.5 border-t border-[#E6D29E]">
              <div>
                <span class="text-[11px] text-slate-500 block">Masuk (${periodLabel})</span>
                <span class="text-xs font-medium text-sage">+${formatCurrency(periodIn)}</span>
              </div>
              <div>
                <span class="text-[11px] text-slate-500 block">Keluar (${periodLabel})</span>
                <span class="text-xs font-medium text-coral">-${formatCurrency(periodOut)}</span>
              </div>
              <div>
                <span class="text-[11px] text-slate-500 block">Selisih</span>
                <span class="text-xs font-medium ${periodDiff >= 0 ? 'text-ink' : 'text-coral'}">${periodDiff >= 0 ? '+' : '-'}${formatCurrency(Math.abs(periodDiff))}</span>
              </div>
            </div>
          </div>

          <!-- Daftar Akun & Pocket -->
          <div class="space-y-3">
            ${db.accounts.map(acc => {
              const col = getColorObj(acc.colorId);

                      </div>
                    </div>

                    <div class="flex items-center gap-1 shrink-0">
                      <button onclick="openPocketModal('${acc.id}')" class="px-2.5 py-1 rounded-xl bg-creamCard border border-[#E8DEC5] text-[11px] font-medium text-ink">+ Pocket</button>
                      <button onclick="openAccountModal('${acc.id}')" class="p-1.5 rounded-xl bg-creamCard border border-[#E8DEC5] text-slate-600 hover:text-ink" title="Edit Akun">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>

                    </div>
                  </div>

                  <div class="flex items-baseline justify-between gap-2">
                    <div class="text-base font-medium text-ink">${formatCurrency(totalBal, acc.currency)}</div>
                    ${acc.currency !== 'IDR' ? `<div class="text-[11px] text-slate-500">≈ ${formatCurrency(idrEquivalent, 'IDR')}</div>` : ''}
                  </div>

                  <div class="space-y-1.5 pt-1">
                    ${pockets.map(pkt => `
                      <div class="bg-creamCard/90 rounded-2xl px-3 py-2 flex items-center justify-between gap-2 border border-[#E8DEC5]/70">

                        <button onclick="openEditPocketModal('${acc.id}', '${pkt.id}')" class="px-2.5 py-1 rounded-xl bg-creamSoft text-[11px] font-medium text-ink hover:bg-butter/40 shrink-0">

                        </button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

    function closeSavingGoalDetail() { ui.selectedSavingGoalId = null; render(); }

    function saveGasSettings() {
      const url = (document.getElementById('gas-url-input')?.value || '').trim();
      const key = (document.getElementById('gas-key-input')?.value || '').trim();
      db.gasConfig = { ...(db.gasConfig || {}), url, key };
      saveData();
      showToast('Konfigurasi Google Sheets disimpan');
      if (url && key) syncPullFromSheets(true);
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `catatan-keuangan-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('File backup JSON berhasil diunduh');
    }

    function handleImportJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || ''));
          if (!parsed || typeof parsed !== 'object') throw new Error('Format JSON tidak valid');
          const def = getDefaultData();
          db = {
            ...def,
            ...parsed,
            gasConfig: { ...def.gasConfig, ...(parsed.gasConfig || {}) },
            security: { ...def.security, ...(parsed.security || {}) },
            exchangeRates: { ...def.exchangeRates, ...(parsed.exchangeRates || {}) }
          };
          saveData();
          showToast('Data berhasil dipulihkan dari JSON');
          render();
        } catch (err) {
          showToast('Gagal import JSON: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function openModal(html) {

      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      box.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function closeModalOnBackdrop(e) {
      if (e.target && e.target.id === 'modal-backdrop') closeModal();
    }

    function appendQuickZeros(inputId, zerosStr) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const digits = (inp.value || '').replace(/[^0-9]/g, '');
      if (!digits) return;
      const nextNum = Number(digits + zerosStr);
      if (!Number.isNaN(nextNum)) {
        inp.value = formatNumberID(nextNum);
      }
    }

    function formatAmountInput(inp) {
      const digits = (inp.value || '').replace(/[^0-9]/g, '');
      if (!digits) {
        inp.value = '';
        return;
      }
      inp.value = formatNumberID(Number(digits));
    }

    function parseFormattedAmount(val) {
      const digits = String(val || '').replace(/[^0-9]/g, '');
      return digits ? Number(digits) : 0;
    }

    function onTxTypeChange(type) {
      const catGroup = document.getElementById('tx-category-group');
      const trfTarget = document.getElementById('tx-transfer-target');
      const catSelect = document.getElementById('tx-cat-select');

      if (type === 'transfer') {
        catGroup?.classList.add('hidden');
        trfTarget?.classList.remove('hidden');
        return;
      }
      catGroup?.classList.remove('hidden');
      trfTarget?.classList.add('hidden');

      const filtered = db.categories.filter(c => c.type === type);
      if (catSelect) {
        catSelect.innerHTML = filtered.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }
      onTxCategoryChange();
    }

    function onTxCategoryChange() {
      const catId = document.getElementById('tx-cat-select')?.value;
      const subWrap = document.getElementById('tx-subcat-wrap');
      const cat = db.categories.find(c => c.id === catId);
      if (!subWrap) return;

      if (cat && Array.isArray(cat.subcategories) && cat.subcategories.length > 0) {

    function submitTxForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const type = fd.get('txType') || 'expense';
      const date = fd.get('txDate') || new Date().toISOString().slice(0, 10);
      const amount = parseFormattedAmount(fd.get('txAmount'));
      const accountId = fd.get('txAccountId');
      const pocketId = fd.get('txPocketId');
      const title = String(fd.get('txTitle') || '').trim();

      if (amount <= 0) {
        showToast('Masukkan nominal lebih dari 0', 'error');
        return;
      }

      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt) {
        showToast('Pilih akun dan pocket yang valid', 'error');
        return;
      }

      if (type === 'transfer') {
        const toAccountId = fd.get('txToAccountId');
        const toPocketId = fd.get('txToPocketId');
        const dstAcc = db.accounts.find(a => a.id === toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === toPocketId);
        if (!dstAcc || !dstPkt) {
          showToast('Pilih akun & pocket tujuan', 'error');
          return;
        }

        const fromIDR = toIDR(amount, acc.currency);
        const toAmount = dstAcc.currency === acc.currency
          ? amount
          : Number((fromIDR / (Number(db.exchangeRates?.[dstAcc.currency]) || 1)).toFixed(CURRENCY_META[dstAcc.currency]?.decimals || 2));

        pkt.balance = (Number(pkt.balance) || 0) - amount;
        dstPkt.balance = (Number(dstPkt.balance) || 0) + toAmount;

        db.transactions.unshift({
          id: 'trf_' + Date.now(),
          type: 'transfer',
          date,
          amount,
          nilaiKe: toAmount,
          title: title || `Transfer ke ${dstPkt.name}`,
          accountId,
          pocketId,
          toAccountId,
          toPocketId
        });
      } else {
        const categoryId = fd.get('txCategoryId') || '';
        const subcategoryId = fd.get('txSubcategoryId') || '';
        if (type === 'income') {
          pkt.balance = (Number(pkt.balance) || 0) + amount;
        } else {
          pkt.balance = (Number(pkt.balance) || 0) - amount;
        }

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type,
          date,
          amount,
          categoryId,
          subcategoryId,
          title,
          accountId,
          pocketId
        });
      }

      saveData();
      closeModal();
      showToast('Transaksi tersimpan');
      render();
    }

    function deleteTransaction(txId) {
      const idx = db.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = db.transactions[idx];
      const acc = db.accounts.find(a => a.id === tx.accountId);
      const pkt = acc?.pockets?.find(p => p.id === tx.pocketId);

      if (tx.type === 'income' && pkt) {
        pkt.balance = (Number(pkt.balance) || 0) - (Number(tx.amount) || 0);
      } else if (tx.type === 'expense' && pkt) {
        pkt.balance = (Number(pkt.balance) || 0) + (Number(tx.amount) || 0);
      } else if (tx.type === 'transfer') {
        const dstAcc = db.accounts.find(a => a.id === tx.toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === tx.toPocketId);
        if (pkt) pkt.balance = (Number(pkt.balance) || 0) + (Number(tx.amount) || 0);
        if (dstPkt) dstPkt.balance = (Number(dstPkt.balance) || 0) - (Number(tx.nilaiKe || tx.amount) || 0);
      }

      db.transactions.splice(idx, 1);
      saveData();
      showToast('Transaksi dihapus');
      render();
    }

      const targetAmount = parseFormattedAmount(fd.get('goalTarget'));
      const accountId = fd.get('goalAccountId');
      let pocketId = fd.get('goalPocketId');
      const newPocketName = String(fd.get('goalNewPocketName') || '').trim();
      const initAmountIDR = parseFormattedAmount(fd.get('goalInitAmount'));
      const deadline = fd.get('goalDeadline') || '';
      const note = String(fd.get('goalNote') || '').trim();
      const colorId = fd.get('goalColor') || 'emerald';
      const icon = fd.get('goalIcon') || 'celengan';

      if (!name || targetAmount <= 0) {
        showToast('Lengkapi nama & nominal target tabungan', 'error');
        return;
      }

      const acc = db.accounts.find(a => a.id === accountId) || db.accounts[0];
      if (!acc) return;
      acc.pockets = acc.pockets || [];

      let pkt = acc.pockets.find(p => p.id === pocketId);
      if (pocketId === '__NEW__' || !pkt) {
        const createdPkt = {
          id: 'pkt_' + Date.now(),
          name: newPocketName || name,
          balance: 0,
          urut: acc.pockets.length + 1
        };
        acc.pockets.push(createdPkt);
        pkt = createdPkt;
        pocketId = createdPkt.id;
      }

      const rate = Number(db.exchangeRates?.[acc.currency]) || 1;
      const initInAccCur = initAmountIDR / rate;

      if (goalId) {
        const g = db.savingsGoals.find(x => x.id === goalId);
        if (g) {
          if (initAmountIDR >= 0) {
            pkt.balance = initInAccCur;
          }
          g.name = name;
          g.targetAmount = targetAmount;
          g.accountId = acc.id;
          g.pocketId = pkt.id;
          g.deadline = deadline;
          g.note = note;
          g.colorId = colorId;
          g.icon = icon;
          g.currentAmount = getSavingGoalBalanceIDR(g);
        }
      } else {
        if (initAmountIDR > 0) {
          pkt.balance = (Number(pkt.balance) || 0) + initInAccCur;
        }
        const newGoal = {
          id: 'sav_' + Date.now(),
          name,
          targetAmount,
          currentAmount: 0,
          accountId: acc.id,
          pocketId: pkt.id,
          deadline,
          colorId,
          icon,
          note,
          history: initAmountIDR > 0 ? [{
            id: 'sh_' + Date.now(),
            type: 'deposit',
            amount: initAmountIDR,
            date: new Date().toISOString().slice(0, 10),
            note: `Saldo awal masuk ke pocket ${pkt.name}`
          }] : []
        };
        newGoal.currentAmount = getSavingGoalBalanceIDR(newGoal);
        db.savingsGoals.push(newGoal);
      }

      saveData();
      closeModal();
      showToast('Tabungan terhubung ke pocket & kekayaan');
      render();
    }

    function openSavingFundModal(goalId, mode) {
      const goal = db.savingsGoals.find(g => g.id === goalId);
      if (!goal) return;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">${mode === 'deposit' ? 'SETOR DANA TABUNGAN' : 'TARIK DANA TABUNGAN'}</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>
          <form onsubmit="submitSavingFund(event, '${goal.id}', '${mode}')" class="space-y-3">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Nominal (IDR)</label>
              <input type="text" id="sav-fund-amt" name="fundAmount" inputmode="numeric" oninput="formatAmountInput(this)" required placeholder="0"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink" />
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="appendQuickZeros('sav-fund-amt', '00')" class="flex-1 py-1.5 rounded-xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium">+00</button>
              <button type="button" onclick="appendQuickZeros('sav-fund-amt', '000')" class="flex-1 py-1.5 rounded-xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium">+000</button>
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Catatan</label>
              <input type="text" name="fundNote" placeholder="Catatan mutasi tabungan"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Konfirmasi</button>
          </form>
        </div>
      `);
    }

    function submitSavingFund(e, goalId, mode) {
      e.preventDefault();
      const goal = db.savingsGoals.find(g => g.id === goalId);
      if (!goal) return;
      const fd = new FormData(e.target);
      const amountIDR = parseFormattedAmount(fd.get('fundAmount'));
      const note = String(fd.get('fundNote') || '').trim();
      if (amountIDR <= 0) return;

      const acc = db.accounts.find(a => a.id === goal.accountId);
      const pkt = acc?.pockets?.find(p => p.id === goal.pocketId);
      if (acc && pkt) {
        const rate = Number(db.exchangeRates?.[acc.currency]) || 1;
        const deltaInCur = amountIDR / rate;
        pkt.balance = mode === 'deposit'
          ? (Number(pkt.balance) || 0) + deltaInCur
          : (Number(pkt.balance) || 0) - deltaInCur;
      }

      goal.history = goal.history || [];
      goal.history.unshift({
        id: 'sh_' + Date.now(),
        type: mode,
        amount: amountIDR,
        date: new Date().toISOString().slice(0, 10),
        note: note || (mode === 'deposit' ? 'Setor tabungan' : 'Tarik tabungan')
      });
      goal.currentAmount = getSavingGoalBalanceIDR(goal);

      saveData();
      closeModal();
      showToast(mode === 'deposit' ? 'Dana tabungan ditambahkan' : 'Dana tabungan ditarik');
      render();
    }

    function openDebtModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">CATAT HUTANG / PIUTANG</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>
          <form onsubmit="submitDebtForm(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Jenis</label>
              <select name="debtType" class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink">
                <option value="receivable">Piutang (Orang berhutang ke saya)</option>
                <option value="payable">Hutang (Saya berhutang ke orang)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Nama Pihak</label>
              <input type="text" name="debtPerson" required placeholder="Nama teman / lembaga"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Total Nominal (IDR)</label>
              <input type="text" name="debtTotal" inputmode="numeric" oninput="formatAmountInput(this)" required placeholder="0"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Jatuh Tempo (Opsional)</label>
              <input type="date" name="debtDue" class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Catatan</label>
              <input type="text" name="debtNote" placeholder="Keterangan"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Simpan</button>
          </form>
        </div>
      `);
    }

    function submitDebtForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const type = fd.get('debtType') || 'receivable';
      const person = String(fd.get('debtPerson') || '').trim();
      const totalAmount = parseFormattedAmount(fd.get('debtTotal'));
      const dueDate = fd.get('debtDue') || '';
      const note = String(fd.get('debtNote') || '').trim();
      if (!person || totalAmount <= 0) return;

      db.debts.unshift({
        id: 'debt_' + Date.now(),
        type,
        person,
        totalAmount,
        paidAmount: 0,
        dueDate,
        note
      });
      saveData();
      closeModal();
      showToast('Catatan hutang/piutang disimpan');
      render();
    }

    function openPayDebtModal(debtId) {
      const d = db.debts.find(x => x.id === debtId);
      if (!d) return;
      const sisa = Math.max(0, (Number(d.totalAmount) || 0) - (Number(d.paidAmount) || 0));
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">CATAT PEMBAYARAN (${d.person})</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>
          <p class="text-xs text-slate-500">Sisa saat ini: <strong class="text-ink">${formatCurrency(sisa)}</strong></p>
          <form onsubmit="submitPayDebt(event, '${d.id}')" class="space-y-3">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Nominal Bayar (IDR)</label>
              <input type="text" name="payAmt" value="${formatNumberID(sisa)}" inputmode="numeric" oninput="formatAmountInput(this)" required
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Simpan Pembayaran</button>
          </form>
        </div>
      `);
    }

    function submitPayDebt(e, debtId) {
      e.preventDefault();
      const d = db.debts.find(x => x.id === debtId);
      if (!d) return;
      const fd = new FormData(e.target);
      const amt = parseFormattedAmount(fd.get('payAmt'));
      if (amt <= 0) return;
      d.paidAmount = Math.min(Number(d.totalAmount) || 0, (Number(d.paidAmount) || 0) + amt);
      saveData();
      closeModal();
      showToast('Pembayaran tercatat');
      render();
    }

    function deleteDebt(debtId) {
      db.debts = db.debts.filter(d => d.id !== debtId);
      saveData();
      showToast('Catatan dihapus');
      render();
    }

    // =========================================================================
    // 15. MAIN RENDER & BOOTSTRAP
    // =========================================================================
    function render() {
      updateLockScreenVisibility();
      updateFabVisibility();
      renderBottomNav();

      const mainEl = document.getElementById('main-content');
      if (!mainEl) return;

      if (ui.activeTab === 'transaksi') {
        mainEl.innerHTML = renderTransaksiView();
      } else if (ui.activeTab === 'statistik') {
        mainEl.innerHTML = renderStatistikView();
      } else if (ui.activeTab === 'tabungan') {
        mainEl.innerHTML = renderTabunganView();
      } else if (ui.activeTab === 'hutang') {
        mainEl.innerHTML = renderHutangView();
      } else if (ui.activeTab === 'pengaturan') {
        mainEl.innerHTML = renderPengaturanView();
      } else {
        mainEl.innerHTML = renderAkunView();
      }
    }

    (function initApp() {
      initPWAAssets();
      render();
      if (db.gasConfig?.url && db.gasConfig?.key) {
        syncPullFromSheets(true);
      }
      fetchLiveExchangeRates(true);
    })();
  </script>
</body>
</html>
