    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultData();
        const parsed = JSON.parse(raw);
        const def = getDefaultData();
        return {
          ...def,
          ...parsed,
          exchangeRates: { ...def.exchangeRates, ...(parsed.exchangeRates || {}) },
          exchangeRateMeta: { ...def.exchangeRateMeta, ...(parsed.exchangeRateMeta || {}) },
          gasConfig: { ...def.gasConfig, ...(parsed.gasConfig || {}) },
          security: { ...def.security, ...(parsed.security || {}) },
          monthlyBudgets: parsed.monthlyBudgets || {},
          recurringTransactions: Array.isArray(parsed.recurringTransactions) ? parsed.recurringTransactions : []
        };
      } catch (e) {
        return getDefaultData();
      }
    }

    // =========================================================================
    // 3. FORMAT ANGKA (###.###.###) & KONVERSI MATA UANG
    // =========================================================================
    function formatNumberID(num) {
      const val = Math.round(Number(num) || 0);
      const sign = val < 0 ? '-' : '';
      const absStr = Math.abs(val).toString();
      return sign + absStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || { symbol: currency + ' ', decimals: 0 };
      const num = Number(amount) || 0;
      const sign = num < 0 ? '-' : '';
      const absVal = Math.abs(num);

      if (meta.decimals === 0 || Number.isInteger(absVal)) {
        const formatted = Math.round(absVal).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return `${sign}${meta.symbol} ${formatted}`;
      }

      const fixed = absVal.toFixed(meta.decimals);
      const [intPart, decPart] = fixed.split('.');
      const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${sign}${meta.symbol} ${intFormatted},${decPart}`;
    }

    function toIDR(amount, currency = 'IDR') {
      const rate = Number(db.exchangeRates?.[currency]) || 1;
      return (Number(amount) || 0) * rate;
    }

    function getTxCurrency(tx) {
      if (tx.currency) return tx.currency;
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc?.currency || 'IDR';
    }

    function getColorObj(colorId) {
      return ACCOUNT_COLORS.find(c => c.id === colorId) || ACCOUNT_COLORS[0];
    }

    function getAccountTotalBalance(acc) {
      return (acc.pockets || []).reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    function getTotalNetWorthIDR() {
      return db.accounts.reduce((sum, acc) => sum + toIDR(getAccountTotalBalance(acc), acc.currency), 0);
    }

    function getSavingGoalBalanceIDR(goal) {
      const acc = db.accounts.find(a => a.id === goal.accountId);
      const pkt = acc?.pockets?.find(p => p.id === goal.pocketId);
      if (acc && pkt) {
        return toIDR(Number(pkt.balance) || 0, acc.currency);
      }
      return Number(goal.currentAmount) || 0;
    }

    async function fetchLiveExchangeRates(silent = false) {
      if (isFetchingRates) return;
      isFetchingRates = true;
      if (!silent) render();
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/IDR');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && data.rates) {
          Object.keys(CURRENCY_META).forEach(code => {
            if (code === 'IDR') {
              db.exchangeRates.IDR = 1;
            } else if (data.rates[code]) {
              db.exchangeRates[code] = Number((1 / data.rates[code]).toFixed(2));
            }
          });
          db.exchangeRateMeta = {
            lastUpdated: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
            source: 'Live API'
          };
          saveData();
          if (!silent) showToast('Kurs mata uang diperbarui');
        }
      } catch (e) {
        if (!silent) showToast('Gagal memperbarui kurs (pakai kurs tersimpan)', 'error');
      } finally {
        isFetchingRates = false;
        render();
      }
    }

    // =========================================================================

    function initPWAAssets() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="32" fill="#B9D5F5"/><circle cx="64" cy="68" r="34" fill="#FFF7F0"/><path d="M40 44 L48 26 L60 40 Z" fill="#FFF7F0"/><path d="M88 44 L80 26 L68 40 Z" fill="#FFF7F0"/><circle cx="53" cy="66" r="4" fill="#49647D"/><circle cx="75" cy="66" r="4" fill="#49647D"/><path d="M59 75 Q64 80 69 75" stroke="#49647D" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
      const appleIcon = document.getElementById('apple-touch-icon');
      if (appleIcon) appleIcon.href = iconUrl;

      const manifest = {
        name: 'Catatan Keuangan',
        short_name: 'Keuangan',
        start_url: './',
        display: 'standalone',
        background_color: '#F8FAFF',
        theme_color: '#B9D5F5',
        icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml' }]
      };
      const manifestEl = document.getElementById('pwa-manifest');
      if (manifestEl) {
        manifestEl.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      }

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {

      if (deferredPrompt) {

    // =========================================================================
    // 5. GOOGLE SHEETS SYNC (APPS SCRIPT)
    // =========================================================================
    async function syncPullFromSheets(silent = false) {
      const url = db.gasConfig?.url;
      const key = db.gasConfig?.key;
      if (!url || !key) {
        if (!silent) showToast('Isi URL & Kunci Google Apps Script di Pengaturan', 'error');
        return;
      }

      db.gasConfig.status = 'syncing';
      if (!silent) render();

      try {
        const res = await fetch(`${url}?key=${encodeURIComponent(key)}&action=pull`);
        const json = await res.json();
        if (json && json.status === 'ok' && json.data) {
          const remote = json.data;
          if (Array.isArray(remote.accounts) && remote.accounts.length) db.accounts = remote.accounts;
          if (Array.isArray(remote.categories) && remote.categories.length) db.categories = remote.categories;
          if (Array.isArray(remote.transactions)) db.transactions = remote.transactions;
          if (Array.isArray(remote.savingsGoals)) db.savingsGoals = remote.savingsGoals;
          if (Array.isArray(remote.debts)) db.debts = remote.debts;
          if (remote.monthlyBudgets) db.monthlyBudgets = remote.monthlyBudgets;
          if (Array.isArray(remote.recurringTransactions)) db.recurringTransactions = remote.recurringTransactions;
        }
        db.gasConfig.status = 'ok';
        db.gasConfig.lastSyncAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        saveData();
        if (!silent) showToast('Sinkronisasi Sheets berhasil');
      } catch (e) {
        db.gasConfig.status = 'error';
        saveData();
        if (!silent) showToast('Gagal terhubung ke Google Sheets', 'error');
      }
      render();
    }

    // =========================================================================
    // 6. KEAMANAN PIN & TOAST
    // =========================================================================
    function simpleHashPin(pin) {
      let h = 2166136261;
      for (let i = 0; i < pin.length; i++) {
        h ^= pin.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return (h >>> 0).toString(16);
    }

    function isAppLocked() {
      if (!db.security?.enabled || !db.security?.pinHash) return false;
      const until = Number(localStorage.getItem(PIN_SESSION_KEY) || 0);
      return Date.now() > until;
    }

    function updateLockScreenVisibility() {
      const lockEl = document.getElementById('lock-screen');
      if (!lockEl) return;
      if (isAppLocked()) {
        lockEl.classList.remove('hidden');
      } else {
        lockEl.classList.add('hidden');
      }
    }

    function unlockWithPin() {
      const inp = document.getElementById('pin-unlock-input');
      const val = (inp?.value || '').trim();
      if (simpleHashPin(val) === db.security.pinHash) {
        localStorage.setItem(PIN_SESSION_KEY, String(Date.now() + 48 * 3600 * 1000));
        if (inp) inp.value = '';
        updateLockScreenVisibility();
        showToast('Aplikasi terbuka');
      } else {
        showToast('PIN salah', 'error');
      }
    }

    function lockAppNow() {
      localStorage.removeItem(PIN_SESSION_KEY);
      updateLockScreenVisibility();
    }

    function submitPinSetup(e) {
      e.preventDefault();

        return;

      db.security = { enabled: true, pinHash: simpleHashPin(pin) };
      localStorage.setItem(PIN_SESSION_KEY, String(Date.now() + 48 * 3600 * 1000));
      saveData();
      closeModal();
      showToast('PIN keamanan diaktifkan');
      render();
    }

    function disablePinSecurity() {
      db.security = { enabled: false, pinHash: '' };

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(tx => {
        if (!tx.date) return false;
        const parts = tx.date.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        if (mode === 'yearly') return y === year;
        return y === year && m === month;
      });
    }

    function shiftPeriod(scope, delta) {
      if (scope === 'tx') {
        if (ui.txPeriodMode === 'yearly') {
          ui.txYear += delta;
        } else {
          ui.txMonth += delta;
          if (ui.txMonth < 0) { ui.txMonth = 11; ui.txYear--; }
          if (ui.txMonth > 11) { ui.txMonth = 0; ui.txYear++; }
        }
      } else if (scope === 'stat') {
        if (ui.statPeriodMode === 'yearly') {
          ui.statYear += delta;
        } else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear--; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear++; }
        }
      } else if (scope === 'akun') {
        if (ui.akunPeriodMode === 'yearly') {
          ui.akunYear += delta;
        } else {
          ui.akunMonth += delta;
          if (ui.akunMonth < 0) { ui.akunMonth = 11; ui.akunYear--; }
          if (ui.akunMonth > 11) { ui.akunMonth = 0; ui.akunYear++; }
        }
      } else if (scope === 'pocket') {
        if (ui.pocketDetailTab === 'monthly') {
          ui.pocketDetailYear += delta;
        } else if (ui.pocketDetailTab === 'daily') {
          ui.pocketDetailMonth += delta;
          if (ui.pocketDetailMonth < 0) { ui.pocketDetailMonth = 11; ui.pocketDetailYear--; }
          if (ui.pocketDetailMonth > 11) { ui.pocketDetailMonth = 0; ui.pocketDetailYear++; }
        }
      }
      render();
    }

    function getMonthBudgetKey(year, month) {
      return `${year}-${String(month + 1).padStart(2, '0')}`;
    }

    function ensureMonthBudget(year, month) {
      db.monthlyBudgets = db.monthlyBudgets || {};
      const key = getMonthBudgetKey(year, month);
      if (db.monthlyBudgets[key]) return db.monthlyBudgets[key];

      const snapshot = {};
      db.categories.forEach(cat => {
        if (cat.type !== 'expense') return;
        const subsMap = {};
        (cat.subcategories || []).forEach(s => { subsMap[s.id] = Number(s.limit) || 0; });
        snapshot[cat.id] = {
          directLimit: Number(cat.directLimit) || 0,
          subs: subsMap
        };
      });
      db.monthlyBudgets[key] = snapshot;
      return snapshot;
    }

    function polarToCartesian(cx, cy, r, angleInDegrees) {
      const angleInRadians = ((angleInDegrees - 90) * Math.PI) / 180.0;
      return {
        x: cx + r * Math.cos(angleInRadians),
        y: cy + r * Math.sin(angleInRadians)
      };
    }

    function describePieSlice(cx, cy, r, startAngle, endAngle) {
      if (endAngle - startAngle >= 359.99) {
        return `M ${cx} ${cy - r} A ${r} ${r} 0 1 0 ${cx - 0.01} ${cy - r} Z`;
      }
      const start = polarToCartesian(cx, cy, r, endAngle);
      const end = polarToCartesian(cx, cy, r, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
      return [
        'M', cx, cy,
        'L', start.x.toFixed(2), start.y.toFixed(2),
        'A', r, r, 0, largeArcFlag, 0, end.x.toFixed(2), end.y.toFixed(2),
        'Z'
      ].join(' ');
    }

    function renderPieChartSection(periodTxs) {
      const pieMode = ui.statPieMode === 'income' ? 'income' : 'expense';
      const matchingTxs = periodTxs.filter(t => t.type === pieMode);

      const totalsByCat = {};
      matchingTxs.forEach(t => {
        const val = toIDR(t.amount, getTxCurrency(t));
        if (val <= 0) return;
        const cat = db.categories.find(c => c.id === t.categoryId);
        const label = cat?.name || (pieMode === 'income' ? 'Pemasukan Lainnya' : 'Pengeluaran Lainnya');
        totalsByCat[label] = (totalsByCat[label] || 0) + val;
      });

      const entries = Object.entries(totalsByCat)
        .map(([name, amount]) => ({ name, amount }))
        .sort((a, b) => b.amount - a.amount);

      const totalAmount = entries.reduce((s, e) => s + e.amount, 0);
      const coloredEntries = entries.map((e, idx) => ({
        ...e,
        color: PIE_PALETTE[idx % PIE_PALETTE.length],
        pct: totalAmount > 0 ? (e.amount / totalAmount) * 100 : 0
      }));

      let svgHtml = '';
      if (totalAmount <= 0 || coloredEntries.length === 0) {
        svgHtml = `
          <div class="py-10 text-center text-xs text-[#8094A6]">
            Belum ada data ${pieMode === 'income' ? 'pendapatan' : 'pengeluaran'} pada periode ini.
          </div>
        `;
      } else {
        const cx = 200;
        const cy = 128;
        const r = 74;
        let currentAngle = 0;

        const slicesAndCallouts = coloredEntries.map((item, idx) => {
          const sweep = (item.amount / totalAmount) * 360;
          const startAngle = currentAngle;
          const endAngle = idx === coloredEntries.length - 1 ? 360 : currentAngle + sweep;
          const midAngle = startAngle + (endAngle - startAngle) / 2;
          currentAngle = endAngle;

          const pathD = describePieSlice(cx, cy, r, startAngle, endAngle);
          const edgePt = polarToCartesian(cx, cy, r + 3, midAngle);
          const isRight = Math.cos(((midAngle - 90) * Math.PI) / 180) >= 0;
          const elbowPt = {
            x: edgePt.x + (isRight ? 12 : -12),
            y: edgePt.y
          };
          const tipPt = {
            x: isRight ? 305 : 95,
            y: elbowPt.y
          };

          const showCallout = coloredEntries.length <= 8 || item.pct >= 2.5;
          if (!showCallout) {
            return `<path d="${pathD}" fill="${item.color}" stroke="#FFF7F0" stroke-width="1.5" />`;
          }

          const shortName = item.name.length > 14 ? item.name.slice(0, 13) + '…' : item.name;
          const textAnchor = isRight ? 'start' : 'end';
          const textX = isRight ? tipPt.x + 4 : tipPt.x - 4;

          return `
            <path d="${pathD}" fill="${item.color}" stroke="#FFF7F0" stroke-width="1.5" />
            <polyline points="${edgePt.x.toFixed(1)},${edgePt.y.toFixed(1)} ${elbowPt.x.toFixed(1)},${elbowPt.y.toFixed(1)} ${tipPt.x.toFixed(1)},${tipPt.y.toFixed(1)}"
              fill="none" stroke="${item.color}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            <text x="${textX}" y="${(tipPt.y - 2).toFixed(1)}" text-anchor="${textAnchor}" fill="#49647D" font-size="10.5" font-weight="700">${shortName}</text>
            <text x="${textX}" y="${(tipPt.y + 10).toFixed(1)}" text-anchor="${textAnchor}" fill="#8094A6" font-size="9.5">${item.pct.toFixed(1)}%</text>
          `;
        }).join('');

        svgHtml = `
          <svg viewBox="0 0 400 256" class="w-full h-auto overflow-visible">
            ${slicesAndCallouts}
          </svg>
        `;
      }

      const legendRowsHtml = coloredEntries.length === 0 ? '' : `
        <div class="divide-y divide-[#E6ECF2] pt-2 border-t border-[#E6ECF2]">
          ${coloredEntries.map(item => `
            <div class="py-2.5 flex items-center justify-between gap-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="px-2 py-0.5 rounded-lg text-[11px] font-medium text-[#49647D] shrink-0" style="background-color: ${item.color};">
                  ${Math.round(item.pct)}%
                </span>
                <span class="text-xs font-medium text-ink truncate">${item.name}</span>
              </div>
              <span class="text-xs font-medium text-ink shrink-0">${formatCurrency(item.amount)}</span>
            </div>
          `).join('')}
        </div>
      `;

      return `
        <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E6ECF2] space-y-2">
          ${svgHtml}
          ${legendRowsHtml}
        </div>
      `;
    }

    // =========================================================================

    function setAkunPeriodMode(m) { ui.akunPeriodMode = m; render(); }

    function openPocketDetail(accId, pktId) {
      ui.selectedPocketDetail = { accId, pktId };
      ui.pocketDetailTab = 'daily';
      render();
    }

    function closePocketDetail() {
      ui.selectedPocketDetail = null;
      render();
    }

    function setPocketDetailTab(tab) {
      ui.pocketDetailTab = tab;
      render();
    }

    function getPocketFlowOnTx(tx, accId, pktId) {
      const amt = Number(tx.amount) || 0;
      if (tx.type === 'income' && tx.accountId === accId && tx.pocketId === pktId) {
        return amt;
      }
      if (tx.type === 'expense' && tx.accountId === accId && tx.pocketId === pktId) {
        return -amt;
      }
      if (tx.type === 'transfer') {
        let delta = 0;
        if (tx.accountId === accId && tx.pocketId === pktId) {
          delta -= amt;
        }
        if (tx.toAccountId === accId && tx.toPocketId === pktId) {
          delta += (Number(tx.nilaiKe ?? tx.amount) || 0);
        }
        return delta;
      }
      return 0;
    }

    function renderPocketDetailView() {
      const ref = ui.selectedPocketDetail;
      const acc = db.accounts.find(a => a.id === ref?.accId);
      const pkt = acc?.pockets?.find(p => p.id === ref?.pktId);
      if (!acc || !pkt) {
        ui.selectedPocketDetail = null;
        return renderAkunView();
      }

      const cur = acc.currency || 'IDR';
      const currentBal = Number(pkt.balance) || 0;
      const tab = ui.pocketDetailTab || 'daily';
      const yr = ui.pocketDetailYear;
      const mo = ui.pocketDetailMonth;

      const pocketEvents = [];
      db.transactions.forEach(tx => {
        const flow = getPocketFlowOnTx(tx, acc.id, pkt.id);
        if (flow !== 0 && tx.date) {
          pocketEvents.push({
            id: tx.id,
            date: tx.date,
            flow,
            deposit: flow > 0 ? flow : 0,
            withdraw: flow < 0 ? Math.abs(flow) : 0,
            tx
          });
        }
      });

      const totalAllFlow = pocketEvents.reduce((s, e) => s + e.flow, 0);
      const baselineBeforeEvents = currentBal - totalAllFlow;

      let rowsHtml = '';
      let periodDeposit = 0;
      let periodWithdraw = 0;
      let periodTotal = 0;
      let periodLabel = '';

      if (tab === 'daily') {
        periodLabel = `${MONTH_NAMES_ID[mo]} ${yr}`;
        const monthPrefix = `${yr}-${String(mo + 1).padStart(2, '0')}`;
        const allSorted = [...pocketEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        let running = baselineBeforeEvents;
        const withRunning = allSorted.map(ev => {
          running += ev.flow;
          return { ...ev, runningBalance: running };
        });

        const monthRows = withRunning.filter(r => r.date.startsWith(monthPrefix)).reverse();
        periodDeposit = monthRows.reduce((s, r) => s + r.deposit, 0);
        periodWithdraw = monthRows.reduce((s, r) => s + r.withdraw, 0);
        periodTotal = periodDeposit - periodWithdraw;

        if (monthRows.length === 0) {
          rowsHtml = `<div class="py-10 text-center text-xs text-[#8094A6]">Belum ada mutasi pada pocket ini di ${periodLabel}.</div>`;
        } else {
          rowsHtml = `
            <div class="divide-y divide-[#E6ECF2]">
              ${monthRows.map(r => {
                const parts = r.date.split('-');
                const dayNum = parts[2] || '';
                const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
                const dtObj = new Date(Number(parts[0]), (Number(parts[1]) || 1) - 1, Number(parts[2]) || 1);
                const dayName = dayNames[dtObj.getDay()] || '';
                const cat = db.categories.find(c => c.id === r.tx.categoryId);
                const sub = cat?.subcategories?.find(s => s.id === r.tx.subcategoryId);
                const titleText = r.tx.title || (r.tx.type === 'transfer' ? 'Transfer Antar-Pocket' : (sub?.name || cat?.name || 'Transaksi'));

                return `
                  <div class="py-3 flex items-center justify-between gap-2.5">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 text-center shrink-0">
                        <div class="text-sm font-medium text-ink leading-none">${dayNum}</div>
                        <span class="inline-block mt-1 px-1.5 py-0.5 rounded bg-creamSoft text-[10px] text-[#8094A6]">${dayName}</span>
                      </div>
                      <div class="min-w-0">
                        <div class="text-xs font-medium text-ink truncate">${titleText}</div>
                        <div class="text-[11px] text-[#8094A6] truncate">${r.date} • ${r.tx.type === 'transfer' ? 'Transfer' : (cat?.name || 'Umum')}</div>
                      </div>
                    </div>

                    <div class="text-right shrink-0">
                      <div class="text-xs font-medium ${r.flow >= 0 ? 'text-sage' : 'text-coral'}">
                        ${r.flow >= 0 ? '+' : '-'}${formatCurrency(Math.abs(r.flow), cur)}
                      </div>
                      <div class="text-[10px] text-[#8094A6]">Saldo: ${formatCurrency(r.runningBalance, cur)}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }
      } else if (tab === 'monthly') {
        periodLabel = `${yr}`;
        const allSorted = [...pocketEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const monthBuckets = Array.from({ length: 12 }, (_, mIdx) => ({
          mIdx,
          deposit: 0,
          withdraw: 0,
          net: 0,
          endBalance: baselineBeforeEvents
        }));

        allSorted.forEach(ev => {
          const parts = ev.date.split('-');
          const eYr = parseInt(parts[0], 10);
          const eMo = parseInt(parts[1], 10) - 1;
          if (eYr === yr && eMo >= 0 && eMo < 12) {
            monthBuckets[eMo].deposit += ev.deposit;
            monthBuckets[eMo].withdraw += ev.withdraw;
            monthBuckets[eMo].net += ev.flow;
          }
        });

        let accBeforeYr = baselineBeforeEvents;
        allSorted.forEach(ev => {
          const eYr = parseInt(ev.date.split('-')[0], 10);
          if (eYr < yr) accBeforeYr += ev.flow;
        });
        let runYr = accBeforeYr;
        for (let m = 0; m
