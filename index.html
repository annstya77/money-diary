    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultData();
        const parsed = JSON.parse(raw);
        const def = getDefaultData();
        return {
          ...def,
          ...parsed,
          exchangeRates: { ...def.exchangeRates, ...(parsed.exchangeRates || {}) },
          exchangeRateMeta: { ...def.exchangeRateMeta, ...(parsed.exchangeRateMeta || {}) },
          gasConfig: { ...def.gasConfig, ...(parsed.gasConfig || {}) },
          security: { ...def.security, ...(parsed.security || {}) },
          monthlyBudgets: parsed.monthlyBudgets || {},
          recurringTransactions: Array.isArray(parsed.recurringTransactions) ? parsed.recurringTransactions : []
        };
      } catch (e) {
        return getDefaultData();
      }
    }

    // =========================================================================
    // 3. FORMAT ANGKA (###.###.###) & KONVERSI MATA UANG
    // =========================================================================
    function formatNumberID(num) {
      const val = Math.round(Number(num) || 0);
      const sign = val < 0 ? '-' : '';
      const absStr = Math.abs(val).toString();
      return sign + absStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || { symbol: currency + ' ', decimals: 0 };
      const num = Number(amount) || 0;
      const sign = num < 0 ? '-' : '';
      const absVal = Math.abs(num);

      if (meta.decimals === 0 || Number.isInteger(absVal)) {
        const formatted = Math.round(absVal).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return `${sign}${meta.symbol} ${formatted}`;
      }

      const fixed = absVal.toFixed(meta.decimals);
      const [intPart, decPart] = fixed.split('.');
      const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${sign}${meta.symbol} ${intFormatted},${decPart}`;
    }

    function toIDR(amount, currency = 'IDR') {
      const rate = Number(db.exchangeRates?.[currency]) || 1;
      return (Number(amount) || 0) * rate;
    }

    function getTxCurrency(tx) {
      if (tx.currency) return tx.currency;
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc?.currency || 'IDR';
    }

    function getColorObj(colorId) {
      return ACCOUNT_COLORS.find(c => c.id === colorId) || ACCOUNT_COLORS[0];
    }

    function getAccountTotalBalance(acc) {
      return (acc.pockets || []).reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    function getTotalNetWorthIDR() {
      return db.accounts.reduce((sum, acc) => sum + toIDR(getAccountTotalBalance(acc), acc.currency), 0);
    }

    function getSavingGoalBalanceIDR(goal) {
      const acc = db.accounts.find(a => a.id === goal.accountId);
      const pkt = acc?.pockets?.find(p => p.id === goal.pocketId);
      if (acc && pkt) {
        return toIDR(Number(pkt.balance) || 0, acc.currency);
      }
      return Number(goal.currentAmount) || 0;
    }

    async function fetchLiveExchangeRates(silent = false) {
      if (isFetchingRates) return;
      isFetchingRates = true;
      if (!silent) render();
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/IDR');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && data.rates) {
          Object.keys(CURRENCY_META).forEach(code => {
            if (code === 'IDR') {
              db.exchangeRates.IDR = 1;
            } else if (data.rates[code]) {
              db.exchangeRates[code] = Number((1 / data.rates[code]).toFixed(2));
            }
          });
          db.exchangeRateMeta = {
            lastUpdated: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
            source: 'Live API'
          };
          saveData();
          if (!silent) showToast('Kurs mata uang diperbarui');
        }
      } catch (e) {
        if (!silent) showToast('Gagal memperbarui kurs (pakai kurs tersimpan)', 'error');
      } finally {
        isFetchingRates = false;
        render();
      }
    }

    // =========================================================================

    // =========================================================================
    function initPWAAssets() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="32" fill="#f8db91"/><circle cx="64" cy="68" r="34" fill="#FFFDF7"/><path d="M40 44 L48 26 L60 40 Z" fill="#FFFDF7"/><path d="M88 44 L80 26 L68 40 Z" fill="#FFFDF7"/><circle cx="53" cy="66" r="4" fill="#3C3226"/><circle cx="75" cy="66" r="4" fill="#3C3226"/><path d="M59 75 Q64 80 69 75" stroke="#3C3226" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
      const appleIcon = document.getElementById('apple-touch-icon');
      if (appleIcon) appleIcon.href = iconUrl;

      const manifest = {
        name: 'Catatan Keuangan',
        short_name: 'Keuangan',
        start_url: './',
        display: 'standalone',
        background_color: '#FBF6EA',
        theme_color: '#f8db91',
        icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml' }]
      };
      const manifestEl = document.getElementById('pwa-manifest');
      if (manifestEl) {
        manifestEl.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      }

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function triggerInstallApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(() => { deferredPrompt = null; });
      } else {
        showToast('Gunakan menu browser "Add to Home Screen" untuk install');

    // =========================================================================
    // 5. GOOGLE SHEETS SYNC (APPS SCRIPT)
    // =========================================================================
    async function syncPullFromSheets(silent = false) {
      const url = db.gasConfig?.url;
      const key = db.gasConfig?.key;
      if (!url || !key) {
        if (!silent) showToast('Isi URL & Kunci Google Apps Script di Pengaturan', 'error');
        return;
      }

      db.gasConfig.status = 'syncing';
      if (!silent) render();

      try {
        const res = await fetch(`${url}?key=${encodeURIComponent(key)}&action=pull`);
        const json = await res.json();
        if (json && json.status === 'ok' && json.data) {
          const remote = json.data;
          if (Array.isArray(remote.accounts) && remote.accounts.length) db.accounts = remote.accounts;
          if (Array.isArray(remote.categories) && remote.categories.length) db.categories = remote.categories;
          if (Array.isArray(remote.transactions)) db.transactions = remote.transactions;
          if (Array.isArray(remote.savingsGoals)) db.savingsGoals = remote.savingsGoals;
          if (Array.isArray(remote.debts)) db.debts = remote.debts;
          if (remote.monthlyBudgets) db.monthlyBudgets = remote.monthlyBudgets;
          if (Array.isArray(remote.recurringTransactions)) db.recurringTransactions = remote.recurringTransactions;
        }
        db.gasConfig.status = 'ok';
        db.gasConfig.lastSyncAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        saveData();
        if (!silent) showToast('Sinkronisasi Sheets berhasil');
      } catch (e) {
        db.gasConfig.status = 'error';
        saveData();
        if (!silent) showToast('Gagal terhubung ke Google Sheets', 'error');
      }
      render();
    }

    // =========================================================================
    // 6. KEAMANAN PIN & TOAST
    // =========================================================================
    function simpleHashPin(pin) {
      let h = 2166136261;
      for (let i = 0; i < pin.length; i++) {
        h ^= pin.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return (h >>> 0).toString(16);
    }

    function isAppLocked() {
      if (!db.security?.enabled || !db.security?.pinHash) return false;
      const until = Number(localStorage.getItem(PIN_SESSION_KEY) || 0);
      return Date.now() > until;
    }

    function updateLockScreenVisibility() {
      const lockEl = document.getElementById('lock-screen');
      if (!lockEl) return;
      if (isAppLocked()) {
        lockEl.classList.remove('hidden');
      } else {
        lockEl.classList.add('hidden');
      }
    }

    function unlockWithPin() {
      const inp = document.getElementById('pin-unlock-input');
      const val = (inp?.value || '').trim();
      if (simpleHashPin(val) === db.security.pinHash) {
        localStorage.setItem(PIN_SESSION_KEY, String(Date.now() + 48 * 3600 * 1000));
        if (inp) inp.value = '';
        updateLockScreenVisibility();
        showToast('Aplikasi terbuka');
      } else {
        showToast('PIN salah', 'error');
      }
    }

    function lockAppNow() {
      localStorage.removeItem(PIN_SESSION_KEY);
      updateLockScreenVisibility();
    }

    function openPinSetupModal() {
      const active = Boolean(db.security?.enabled && db.security?.pinHash);
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">${active ? 'UBAH / NONAKTIFKAN PIN' : 'ATUR PIN KEAMANAN'}</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>
          <form onsubmit="submitPinSetup(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">PIN Baru (4–6 digit angka)</label>
              <input type="password" name="newPin" inputmode="numeric" maxlength="6" placeholder="••••"
                class="w-full px-3.5 py-2.5 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-sm tracking-widest text-ink" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Simpan PIN</button>
            ${active ? `<button type="button" onclick="disablePinSecurity()" class="w-full py-2.5 rounded-2xl bg-coralLight text-coral text-xs font-medium">Nonaktifkan PIN</button>` : ''}
          </form>
        </div>
      `);
    }

    function submitPinSetup(e) {
      e.preventDefault();
      const pin = String(new FormData(e.target).get('newPin') || '').trim();
      if (!/^\d{4,6}$/.test(pin)) {
        showToast('PIN harus 4–6 digit angka', 'error');
        return;
      }
      db.security = { enabled: true, pinHash: simpleHashPin(pin) };
      localStorage.setItem(PIN_SESSION_KEY, String(Date.now() + 48 * 3600 * 1000));
      saveData();
      closeModal();
      showToast('PIN keamanan diaktifkan');
      render();
    }

    function disablePinSecurity() {
      db.security = { enabled: false, pinHash: '' };
      localStorage.removeItem(PIN_SESSION_KEY);
      saveData();
      closeModal();
      showToast('PIN dinonaktifkan');
      render();
    }

    let toastTimer = null;
    function showToast(msg, type = 'ok') {
      const el = document.getElementById('toast-banner');
      if (!el) return;
      el.textContent = msg;
      el.className = `fixed top-4 left-1/2 -translate-x-1/2 z-[90] px-4 py-2.5 rounded-2xl shadow-lg text-xs font-medium tracking-wide max-w-[90vw] text-center ${
        type === 'error' ? 'bg-coral text-white' : 'bg-ink text-[#FBF6EA]'
      }`;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(tx => {
        if (!tx.date) return false;
        const parts = tx.date.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        if (mode === 'yearly') return y === year;
        return y === year && m === month;
      });
    }

    function shiftPeriod(scope, delta) {
      if (scope === 'tx') {
        if (ui.txPeriodMode === 'yearly') {
          ui.txYear += delta;
        } else {
          ui.txMonth += delta;
          if (ui.txMonth < 0) { ui.txMonth = 11; ui.txYear--; }
          if (ui.txMonth > 11) { ui.txMonth = 0; ui.txYear++; }
        }
      } else if (scope === 'stat') {
        if (ui.statPeriodMode === 'yearly') {
          ui.statYear += delta;
        } else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear--; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear++; }
        }
      } else if (scope === 'akun') {
        if (ui.akunPeriodMode === 'yearly') {
          ui.akunYear += delta;
        } else {
          ui.akunMonth += delta;
          if (ui.akunMonth < 0) { ui.akunMonth = 11; ui.akunYear--; }
          if (ui.akunMonth > 11) { ui.akunMonth = 0; ui.akunYear++; }
        }
      } else if (scope === 'pocket') {
        if (ui.pocketDetailTab === 'monthly') {
          ui.pocketDetailYear += delta;
        } else if (ui.pocketDetailTab === 'daily') {
          ui.pocketDetailMonth += delta;
          if (ui.pocketDetailMonth < 0) { ui.pocketDetailMonth = 11; ui.pocketDetailYear--; }
          if (ui.pocketDetailMonth > 11) { ui.pocketDetailMonth = 0; ui.pocketDetailYear++; }
        }
      }
      render();
    }

    // =========================================================================
    // 9. VIEW 2: STATISTIK & EVALUASI ANGGARAN
    //    - Progress kategori: hijau #c6da77 (merah #E05A5A jika melewati limit)

    // =========================================================================
    function setStatPeriodMode(m) { ui.statPeriodMode = m; render(); }

    function toggleBudgetCatExpand(catId) {
      ui.expandedBudgetCats[catId] = !ui.expandedBudgetCats[catId];
      render();
    }

    function getMonthBudgetKey(year, month) {
      return `${year}-${String(month + 1).padStart(2, '0')}`;
    }

    function ensureMonthBudget(year, month) {
      db.monthlyBudgets = db.monthlyBudgets || {};
      const key = getMonthBudgetKey(year, month);
      if (db.monthlyBudgets[key]) return db.monthlyBudgets[key];

      const snapshot = {};
      db.categories.forEach(cat => {
        if (cat.type !== 'expense') return;
        const subsMap = {};
        (cat.subcategories || []).forEach(s => { subsMap[s.id] = Number(s.limit) || 0; });
        snapshot[cat.id] = {
          directLimit: Number(cat.directLimit) || 0,
          subs: subsMap
        };
      });
      db.monthlyBudgets[key] = snapshot;
      return snapshot;
    }

    function renderStatistikView() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth);
      const periodLabel = ui.statPeriodMode === 'yearly' ? `${ui.statYear}` : `${MONTH_NAMES_ID[ui.statMonth]} ${ui.statYear}`;
      const mBud = ensureMonthBudget(ui.statYear, ui.statMonth);
      const multiplier = ui.statPeriodMode === 'yearly' ? 12 : 1;

      const expCats = db.categories.filter(c => c.type === 'expense');

      const budgetCards = expCats.map(cat => {
        const hasSubs = Array.isArray(cat.subcategories) && cat.subcategories.length > 0;
        const entry = mBud[cat.id] || { directLimit: cat.directLimit || 0, subs: {} };

        let catSpent = 0;
        let catLimit = 0;
        let subRowsHtml = '';

        if (hasSubs) {
          subRowsHtml = cat.subcategories.map(sub => {
            const subLimit = ((entry.subs && entry.subs[sub.id] !== undefined) ? Number(entry.subs[sub.id]) : (Number(sub.limit) || 0)) * multiplier;
            const subSpent = periodTxs
              .filter(t => t.type === 'expense' && t.categoryId === cat.id && t.subcategoryId === sub.id)
              .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);

            catLimit += subLimit;
            catSpent += subSpent;

            const subPct = subLimit > 0 ? Math.min(100, (subSpent / subLimit) * 100) : (subSpent > 0 ? 100 : 0);
            const subOverLimit = subLimit > 0 ? subSpent > subLimit : subSpent > 0;
            const subBarColor = subOverLimit ? '#E05A5A' : '#77bcda';

            return `
              <div class="pl-3 border-l-2 border-[#E8DEC5] space-y-1">
                <div class="flex items-center justify-between text-xs">
                  <span class="text-ink">${sub.name}</span>
                  <div>
                    <span class="font-medium ${subOverLimit ? 'text-coral' : 'text-ink'}">${formatCurrency(subSpent)}</span>
                    <span class="text-slate-400"> / ${formatCurrency(subLimit)}</span>
                  </div>
                </div>
                <div class="w-full h-2 rounded-full bg-creamSoft overflow-hidden">
                  <div class="h-full rounded-full transition-all" style="width: ${subPct}%; background-color: ${subBarColor};"></div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          catLimit = (entry.directLimit !== undefined ? Number(entry.directLimit) : (Number(cat.directLimit) || 0)) * multiplier;
          catSpent = periodTxs
            .filter(t => t.type === 'expense' && t.categoryId === cat.id)
            .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        }

        const catPct = catLimit > 0 ? Math.min(100, (catSpent / catLimit) * 100) : (catSpent > 0 ? 100 : 0);
        const catOverLimit = catLimit > 0 ? catSpent > catLimit : catSpent > 0;
        const catBarColor = catOverLimit ? '#E05A5A' : '#c6da77';
        const sisaBudget = catLimit - catSpent;
        const isExpanded = ui.expandedBudgetCats[cat.id] !== false;

        return `
          <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5] space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-sm font-medium text-ink truncate">${cat.name}</span>
                ${hasSubs ? `
                  <button onclick="toggleBudgetCatExpand('${cat.id}')"

    // 10. VIEW 3: AKUN, DETAIL POCKET (HARIAN/BULANAN/SETIAP TAHUN) & TRANSFER POCKET
    // =========================================================================
    function setAkunPeriodMode(m) { ui.akunPeriodMode = m; render(); }

    function openPocketDetail(accId, pktId) {
      ui.selectedPocketDetail = { accId, pktId };
      ui.pocketDetailTab = 'daily';
      render();
    }

    function closePocketDetail() {
      ui.selectedPocketDetail = null;
      render();
    }

    function setPocketDetailTab(tab) {
      ui.pocketDetailTab = tab;
      render();
    }

    function getPocketFlowOnTx(tx, accId, pktId) {
      const amt = Number(tx.amount) || 0;
      if (tx.type === 'income' && tx.accountId === accId && tx.pocketId === pktId) {
        return amt;
      }
      if (tx.type === 'expense' && tx.accountId === accId && tx.pocketId === pktId) {
        return -amt;
      }
      if (tx.type === 'transfer') {
        let delta = 0;
        if (tx.accountId === accId && tx.pocketId === pktId) {
          delta -= amt;
        }
        if (tx.toAccountId === accId && tx.toPocketId === pktId) {
          delta += (Number(tx.nilaiKe ?? tx.amount) || 0);
        }
        return delta;
      }
      return 0;
    }

    function renderPocketDetailView() {
      const ref = ui.selectedPocketDetail;
      const acc = db.accounts.find(a => a.id === ref?.accId);
      const pkt = acc?.pockets?.find(p => p.id === ref?.pktId);
      if (!acc || !pkt) {
        ui.selectedPocketDetail = null;
        return renderAkunView();
      }

      const cur = acc.currency || 'IDR';
      const currentBal = Number(pkt.balance) || 0;
      const tab = ui.pocketDetailTab || 'daily';
      const yr = ui.pocketDetailYear;
      const mo = ui.pocketDetailMonth;

      const pocketEvents = [];
      db.transactions.forEach(tx => {
        const flow = getPocketFlowOnTx(tx, acc.id, pkt.id);
        if (flow !== 0 && tx.date) {
          pocketEvents.push({
            id: tx.id,
            date: tx.date,
            flow,
            deposit: flow > 0 ? flow : 0,
            withdraw: flow < 0 ? Math.abs(flow) : 0,
            tx
          });
        }
      });

      const totalAllFlow = pocketEvents.reduce((s, e) => s + e.flow, 0);
      const baselineBeforeEvents = currentBal - totalAllFlow;

      let rowsHtml = '';
      let periodDeposit = 0;
      let periodWithdraw = 0;
      let periodTotal = 0;
      let periodLabel = '';

      if (tab === 'daily') {
        periodLabel = `${MONTH_NAMES_ID[mo]} ${yr}`;
        const monthPrefix = `${yr}-${String(mo + 1).padStart(2, '0')}`;
        const allSorted = [...pocketEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        let running = baselineBeforeEvents;
        const withRunning = allSorted.map(ev => {
          running += ev.flow;
          return { ...ev, runningBalance: running };
        });

        const monthRows = withRunning.filter(r => r.date.startsWith(monthPrefix)).reverse();
        periodDeposit = monthRows.reduce((s, r) => s + r.deposit, 0);
        periodWithdraw = monthRows.reduce((s, r) => s + r.withdraw, 0);
        periodTotal = periodDeposit - periodWithdraw;

        if (monthRows.length === 0) {
          rowsHtml = `<div class="py-10 text-center text-xs text-slate-400">Belum ada mutasi pada pocket ini di ${periodLabel}.</div>`;
        } else {
          rowsHtml = `
            <div class="divide-y divide-stone-100">
              ${monthRows.map(r => {
                const parts = r.date.split('-');
                const dayNum = parts[2] || '';
                const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
                const dtObj = new Date(Number(parts[0]), (Number(parts[1]) || 1) - 1, Number(parts[2]) || 1);
                const dayName = dayNames[dtObj.getDay()] || '';
                const cat = db.categories.find(c => c.id === r.tx.categoryId);
                const sub = cat?.subcategories?.find(s => s.id === r.tx.subcategoryId);
                const titleText = r.tx.title || (r.tx.type === 'transfer' ? 'Transfer Antar-Pocket' : (sub?.name || cat?.name || 'Transaksi'));

                return `
                  <div class="py-3 flex items-center justify-between gap-2.5">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 text-center shrink-0">
                        <div class="text-sm font-medium text-ink leading-none">${dayNum}</div>
                        <span class="inline-block mt-1 px-1.5 py-0.5 rounded bg-creamSoft text-[10px] text-slate-500">${dayName}</span>
                      </div>
                      <div class="min-w-0">
                        <div class="text-xs font-medium text-ink truncate">${titleText}</div>
                        <div class="text-[11px] text-slate-400 truncate">${r.date} • ${r.tx.type === 'transfer' ? 'Transfer' : (cat?.name || 'Umum')}</div>
                      </div>
                    </div>

                    <div class="text-right shrink-0">
                      <div class="text-xs font-medium ${r.flow >= 0 ? 'text-sage' : 'text-coral'}">
                        ${r.flow >= 0 ? '+' : '-'}${formatCurrency(Math.abs(r.flow), cur)}
                      </div>
                      <div class="text-[10px] text-slate-400">Saldo: ${formatCurrency(r.runningBalance, cur)}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }
      } else if (tab === 'monthly') {
        periodLabel = `${yr}`;
        const allSorted = [...pocketEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const monthBuckets = Array.from({ length: 12 }, (_, mIdx) => ({
          mIdx,
          deposit: 0,
          withdraw: 0,
          net: 0,
          endBalance: baselineBeforeEvents
        }));

        allSorted.forEach(ev => {
          const parts = ev.date.split('-');
          const eYr = parseInt(parts[0], 10);
          const eMo = parseInt(parts[1], 10) - 1;
          if (eYr === yr && eMo >= 0 && eMo < 12) {
            monthBuckets[eMo].deposit += ev.deposit;
            monthBuckets[eMo].withdraw += ev.withdraw;
            monthBuckets[eMo].net += ev.flow;
          }
        });

        let accBeforeYr = baselineBeforeEvents;
        allSorted.forEach(ev => {
          const eYr = parseInt(ev.date.split('-')[0], 10);
          if (eYr < yr) accBeforeYr += ev.flow;
        });
        let runYr = accBeforeYr;
        for (let m = 0; m < 12; m++) {
          runYr += monthBuckets[m].net;
          monthBuckets[m].endBalance = runYr;
        }

        periodDeposit = monthBuckets.reduce((s, b) => s + b.deposit, 0);
        periodWithdraw = monthBuckets.reduce((s, b) => s + b.withdraw, 0);
        periodTotal = periodDeposit - periodWithdraw;

        rowsHtml = `
          <div class="divide-y divide-stone-100">
            ${[...monthBuckets].reverse().map(b => {
              const lastDay = new Date(yr, b.mIdx + 1, 0).getDate();
              const mm = String(b.mIdx + 1).padStart(2, '0');
              return `
                <div class="py-3 flex items-center justify-between gap-2">
                  <div>
                    <div class="text-xs font-medium text-ink">${MONTH_NAMES_ID[b.mIdx]} ${yr}</div>
                    <div class="text-[10px] text-slate-400">01.${mm} ~ ${String(lastDay).padStart(2, '0')}.${mm}</div>
                  </div>
                  <div class="text-right">
                    <div class="text-xs font-medium text-sage">+${formatCurrency(b.deposit, cur)}</div>
                    <div class="text-[11px] text-coral">-${formatCurrency(b.withdraw, cur)}</div>
                  </div>
                  <div class="text-right shrink-0">
                    <div class="text-xs font-medium ${b.net >= 0 ? 'text-ink' : 'text-coral'}">${b.net >= 0 ? '+' : '-'}${formatCurrency(Math.abs(b.net), cur)}</div>
                    <div class="text-[10px] text-slate-400">Saldo ${formatCurrency(b.endBalance, cur)}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        periodLabel = 'Setiap Tahun';
        const yearsSet = new Set([yr]);
        pocketEvents.forEach(ev => {
          const eYr = parseInt(ev.date.split('-')[0], 10);
          if (!Number.isNaN(eYr)) yearsSet.add(eYr);
        });
        const sortedYears = [...yearsSet].sort((a, b) => a - b);
        const allSorted = [...pocketEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

        let running = baselineBeforeEvents;
        const yearMap = {};
        sortedYears.forEach(y => {
          yearMap[y] = { year: y, deposit: 0, withdraw: 0, net: 0, endBalance: running };
        });

        allSorted.forEach(ev => {
          const eYr = parseInt(ev.date.split('-')[0], 10);
          running += ev.flow;
          if (yearMap[eYr]) {
            yearMap[eYr].deposit += ev.deposit;
            yearMap[eYr].withdraw += ev.withdraw;
            yearMap[eYr].net += ev.flow;
            yearMap[eYr].endBalance = running;
          }
        });

        periodDeposit = Object.values(yearMap).reduce((s, y) => s + y.deposit, 0);
        periodWithdraw = Object.values(yearMap).reduce((s, y) => s + y.withdraw, 0);
        periodTotal = periodDeposit - periodWithdraw;

        rowsHtml = `
          <div class="divide-y divide-stone-100">
            ${sortedYears.reverse().map(y => {
              const item = yearMap[y];
              return `
                <div class="py-3 flex items-center justify-between gap-2">
                  <div>
                    <div class="text-xs font-medium text-ink">${y}</div>
                    <div class="text-[10px] text-slate-400">01.01.${String(y).slice(-2)} ~ 31.12.${String(y).slice(-2)}</div>
                  </div>
                  <div class="text-right">
                    <div class="text-xs font-medium text-sage">+${formatCurrency(item.deposit, cur)}</div>
                    <div class="text-[11px] text-coral">-${formatCurrency(item.withdraw, cur)}</div>
                  </div>
                  <div class="text-right shrink-0">
                    <div class="text-xs font-medium ${item.net >= 0 ? 'text-ink' : 'text-coral'}">${item.net >= 0 ? '+' : '-'}${formatCurrency(Math.abs(item.net), cur)}</div>
                    <div class="text-[10px] text-slate-400">Saldo ${formatCurrency(item.endBalance, cur)}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <div class="p-4 space-y-4">
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #f8db91; border-color: #E2C06B;">
            <div class="flex items-center justify-between gap-2">
              <button onclick="closePocketDetail()" class="px-3 py-1.5 rounded-xl bg-creamCard text-ink text-xs font-medium">
                ← Kembali
              </button>
              <div class="flex items-center gap-1.5">
                <button onclick="openTransferPocketModal('${acc.id}', '${pkt.id}')" class="px-2.5 py-1.5 rounded-xl bg-creamCard text-ink text-xs font-medium">
                  ⇄ Transfer
                </button>
                <button onclick="openEditPocketModal('${acc.id}', '${pkt.id}')" class="px-2.5 py-1.5 rounded-xl bg-creamCard text-ink text-xs font-medium">
                  Edit / Hapus
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-medium text-[#422F0E]">${pkt.name}</h2>
                <p class="text-xs" style="color: #422F0E;">${acc.name} • Saldo Saat Ini: <strong>${formatCurrency(currentBal, cur)}</strong></p>
              </div>
              ${tab !== 'yearly' ? `
                <div class="flex items-center gap-1 bg-creamCard rounded-2xl px-2 py-1">
                  <button onclick="shiftPeriod('pocket', -1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-ink">‹</button>
                  <span class="text-xs font-medium text-ink px-1">${periodLabel}</span>
                  <button onclick="shiftPeriod('pocket', 1)" class="w-7 h-7 rounded-xl bg-creamSoft flex items-center justify-center text-xs text-ink">›</button>
                </div>
              ` : ''}
            </div>

            <div class="grid grid-cols-3 gap-1 bg-creamCard p-1 rounded-2xl">
              <button onclick="setPocketDetailTab('daily')"
                class="py-1.5 rounded-xl text-xs font-medium transition-all ${tab === 'daily' ? 'bg-[#422F0E] text-[#FFF9EB]' : 'text-ink'}">
                Harian
              </button>
              <button onclick="setPocketDetailTab('monthly')"
                class="py-1.5 rounded-xl text-xs font-medium transition-all ${tab === 'monthly' ? 'bg-[#422F0E] text-[#FFF9EB]' : 'text-ink'}">
                Bulanan
              </button>
              <button onclick="setPocketDetailTab('yearly')"
                class="py-1.5 rounded-xl text-xs font-medium transition-all ${tab === 'yearly' ? 'bg-[#422F0E] text-[#FFF9EB]' : 'text-ink'}">

              </button>
            </div>
          </div>

          <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5] space-y-3">
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-creamSoft rounded-2xl p-2.5">
                <span class="text-[10px] text-slate-500 block">Masuk</span>
                <span class="text-xs font-medium text-sage">+${formatCurrency(periodDeposit, cur)}</span>

              <div class="bg-creamSoft rounded-2xl p-2.5">
                <span class="text-[10px] text-slate-500 block">Keluar</span>
                <span class="text-xs font-medium text-coral">-${formatCurrency(periodWithdraw, cur)}</span>
              </div>
              <div class="bg-creamSoft rounded-2xl p-2.5">
                <span class="text-[10px] text-slate-500 block">Total</span>
                <span class="text-xs font-medium ${periodTotal >= 0 ? 'text-ink' : 'text-coral'}">${periodTotal >= 0 ? '+' : '-'}${formatCurrency(Math.abs(periodTotal), cur)}</span>
              </div>
            </div>

            ${rowsHtml}
          </div>
        </div>
      `;
    }

    function openWealthDetailModal() {
      const year = ui.akunYear || 2026;
      const currentNetWorthIDR = getTotalNetWorthIDR();

      const monthlyNetFlow = Array.from({ length: 12 }, (_, mIdx) => {
        const mTxs = filterTransactionsByPeriod(db.transactions, 'monthly', year, mIdx);
        let inc = 0;
        let exp = 0;
        mTxs.forEach(t => {
          const val = toIDR(t.amount, getTxCurrency(t));
          if (t.type === 'income') inc += val;
          if (t.type === 'expense') exp += val;
        });
        return { monthIndex: mIdx, inc, exp, net: inc - exp };
      });

      const totalYearInc = monthlyNetFlow.reduce((s, x) => s + x.inc, 0);
      const totalYearExp = monthlyNetFlow.reduce((s, x) => s + x.exp, 0);
      const totalYearNet = totalYearInc - totalYearExp;

      const activeMonthIdx = ui.akunPeriodMode === 'monthly' ? ui.akunMonth : 11;
      const monthBalances = Array(12).fill(0);
      monthBalances[activeMonthIdx] = currentNetWorthIDR;

      for (let m = activeMonthIdx - 1; m >= 0; m--) {
        monthBalances[m] = monthBalances[m + 1] - monthlyNetFlow[m + 1].net;
      }
      for (let m = activeMonthIdx + 1; m < 12; m++) {
        monthBalances[m] = monthBalances[m - 1] + monthlyNetFlow[m].net;
      }

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h3 class="text-base font-medium uppercase text-ink">DETAIL KEKAYAAN (${year})</h3>
              <p class="text-[11px] text-slate-400">Rincian Januari – Desember • Mode ${ui.akunPeriodMode === 'yearly' ? 'Tahunan' : 'Bulanan'}</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>

          <div class="bg-creamSoft rounded-2xl p-3.5 border border-[#E8DEC5] flex items-center justify-between">
            <div>
              <span class="text-[11px] text-slate-500 block">Total Kekayaan Saat Ini</span>
              <span class="text-base font-medium text-ink">${formatCurrency(currentNetWorthIDR)}</span>
            </div>
            <span class="px-2.5 py-1 rounded-xl bg-creamCard border border-[#E8DEC5] text-[11px] font-medium text-ink">
              ${ui.akunPeriodMode === 'yearly' ? `Tahunan ${year}` : `Bulanan ${MONTH_NAMES_ID[ui.akunMonth]} ${year}`}
            </span>
          </div>

          <div class="max-h-72 overflow-y-auto divide-y divide-stone-100 border border-[#E8DEC5] rounded-2xl bg-creamCard px-3">
            ${monthlyNetFlow.map((row, idx) => {
              const estWealth = monthBalances[idx];
              const netSign = row.net >= 0 ? '+' : '-';
              return `
                <div class="py-2.5 flex items-center justify-between gap-2">
                  <div>
                    <div class="text-xs font-medium text-ink">${MONTH_FULL_NAMES_ID[idx]} ${year}</div>
                    <div class="text-[10px] text-slate-400">
                      Masuk: +${formatCurrency(row.inc)} • Keluar: -${formatCurrency(row.exp)}
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-xs font-medium text-ink">${formatCurrency(estWealth)}</div>
                    <div class="text-[10px] font-medium ${row.net >= 0 ? 'text-sage' : 'text-coral'}">
                      Selisih: ${netSign}${formatCurrency(Math.abs(row.net))}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="bg-creamSoft rounded-2xl p-3 border border-[#E8DEC5] grid grid-cols-3 gap-2 text-center">
            <div>
              <span class="text-[10px] text-slate-400 block">Masuk ${year}</span>
              <span class="text-xs font-medium text-sage">+${formatCurrency(totalYearInc)}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">Keluar ${year}</span>
              <span class="text-xs font-medium text-coral">-${formatCurrency(totalYearExp)}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">Selisih ${year}</span>
              <span class="text-xs font-medium text-ink">${totalYearNet >= 0 ? '+' : '-'}${formatCurrency(Math.abs(totalYearNet))}</span>
            </div>
          </div>

          <button onclick="closeModal()" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Tutup</button>
        </div>
      `);
    }

    function renderAkunView() {
      if (ui.selectedPocketDetail) {
        return renderPocketDetailView();
      }

      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.akunPeriodMode, ui.akunYear, ui.akunMonth);
      const periodLabel = ui.akunPeriodMode === 'yearly'
        ? `${ui.akunYear}`
        : `${MONTH_NAMES_ID[ui.akunMonth]} ${ui.akunYear}`;

      let periodIn = 0;
      let periodOut = 0;
      periodTxs.forEach(t => {
        const val = toIDR(t.amount, getTxCurrency(t));
        if (t.type === 'income') periodIn += val;
        if (t.type === 'expense') periodOut += val;
      });
      const periodDiff = periodIn - periodOut;
      const totalNetWorthIDR = getTotalNetWorthIDR();

      const syncStatus = db.gasConfig?.status || 'offline';
      const syncDotColor = syncStatus === 'ok' ? 'bg-emerald-400' : syncStatus === 'syncing' ? 'bg-amber-500' : syncStatus === 'error' ? 'bg-red-500' : 'bg-[#422F0E]';
      const syncText = syncStatus === 'ok'
        ? `Sheets Sync ${db.gasConfig.lastSyncAt || ''}`
        : syncStatus === 'syncing'
          ? 'Menyinkronkan...'
          : db.pendingQueue?.length > 0
            ? `Antrean ${db.pendingQueue.length} item`
            : 'Mode Lokal';

      return `
        <div class="p-4 space-y-4">
          <div class="rounded-3xl p-4 shadow-sm border space-y-3.5" style="background-color: #f8db91; border-color: #E2C06B;">

    function setDebtFilter(f) { ui.debtFilter = f; render(); }

    function renderHutangView() {
      const list = db.debts.filter(d => ui.debtFilter === 'ALL' ? true : d.type === ui.debtFilter);
      const totalHutang = db.debts
        .filter(d => d.type === 'payable')
        .reduce((s, d) => s + Math.max(0, (Number(d.totalAmount) || 0) - (Number(d.paidAmount) || 0)), 0);
      const totalPiutang = db.debts
        .filter(d => d.type === 'receivable')

      return `

              ].map(tab => `
                <button onclick="setDebtFilter('${tab.id}')"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all ${ui.debtFilter === tab.id ? 'bg-[#422F0E] text-[#FFF9EB]' : 'bg-creamCard text-ink'}">
                  ${tab.label}

              `).join('')}
            </div>

            <div class="grid grid-cols-2 gap-2.5 pt-1 border-t" style="border-color: rgba(66, 47, 14, 0.14);">

                <span class="text-[11px] text-coral block">Sisa Hutang</span>
                <span class="text-sm font-medium text-ink">${formatCurrency(totalHutang)}</span>

              <div class="bg-creamCard rounded-2xl p-3">
                <span class="text-[11px] text-sage block">Sisa Piutang</span>

              const paid = Number(d.paidAmount) || 0;

              const isPiutang = d.type === 'receivable';
              return `
                <div class="bg-creamCard rounded-3xl p-4 shadow-sm border border-[#E8DEC5] space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div>

                      <div class="text-[11px] text-slate-400">${d.note || 'Tanpa catatan'}${d.dueDate ? ` • Tempo: ${d.dueDate}` : ''}</div>

                    <button onclick="deleteDebt('${d.id}')" class="text-xs text-slate-300 hover:text-coral">✕</button>

                    </div>
                    ${sisa > 0 ? `
                      <button onclick="openPayDebtModal('${d.id}')" class="px-3 py-1 rounded-xl bg-ink text-[#FBF6EA] text-[11px] font-medium">

                  </div>
                </div>
              `;
            }).join('')}
          </div>

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `catatan-keuangan-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('File backup JSON berhasil diunduh');
    }

    function handleImportJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || ''));
          if (!parsed || typeof parsed !== 'object') throw new Error('Format JSON tidak valid');
          const def = getDefaultData();
          db = {
            ...def,
            ...parsed,
            gasConfig: { ...def.gasConfig, ...(parsed.gasConfig || {}) },
            security: { ...def.security, ...(parsed.security || {}) },
            exchangeRates: { ...def.exchangeRates, ...(parsed.exchangeRates || {}) }
          };
          saveData();
          showToast('Data berhasil dipulihkan dari JSON');
          render();
        } catch (err) {
          showToast('Gagal import JSON: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function buildDateFromYearMonthDay(year, monthIndex, dayOfMonth) {
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      const clampedDay = Math.min(Math.max(1, Number(dayOfMonth) || 1), lastDay);
      return `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(clampedDay).padStart(2, '0')}`;
    }

    function executeRecurringEntry(rec, dateStr) {
      const acc = db.accounts.find(a => a.id === rec.accountId) || db.accounts[0];
      const pkt = acc?.pockets?.find(p => p.id === rec.pocketId) || acc?.pockets?.[0];
      if (!acc || !pkt || !(Number(rec.amount) > 0)) return false;

      const amount = Number(rec.amount);
      if (rec.type === 'transfer') {
        const dstAcc = db.accounts.find(a => a.id === rec.toAccountId) || db.accounts[0];
        const dstPkt = dstAcc?.pockets?.find(p => p.id === rec.toPocketId) || dstAcc?.pockets?.[0];
        if (!dstAcc || !dstPkt) return false;

        const fromIDR = toIDR(amount, acc.currency);
        const toAmount = dstAcc.currency === acc.currency
          ? amount
          : Number((fromIDR / (Number(db.exchangeRates?.[dstAcc.currency]) || 1)).toFixed(CURRENCY_META[dstAcc.currency]?.decimals || 2));

        pkt.balance = (Number(pkt.balance) || 0) - amount;
        dstPkt.balance = (Number(dstPkt.balance) || 0) + toAmount;

        const trfId = 'trf_rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
        const trfNote = rec.title || `Transfer berulang ke ${dstPkt.name}`;
        db.transactions.unshift({
          id: trfId,
          type: 'transfer',
          date: dateStr,
          amount,
          nilaiKe: toAmount,
          title: trfNote,
          accountId: acc.id,
          pocketId: pkt.id,
          toAccountId: dstAcc.id,
          toPocketId: dstPkt.id,
          recurringId: rec.id
        });
        recordTransferToLinkedSavingsGoals(dstAcc.id, dstPkt.id, fromIDR, dateStr, trfNote, trfId);
      } else {
        if (rec.type === 'income') {
          pkt.balance = (Number(pkt.balance) || 0) + amount;
        } else {
          pkt.balance = (Number(pkt.balance) || 0) - amount;
        }
        db.transactions.unshift({
          id: 'tx_rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          type: rec.type,
          date: dateStr,
          amount,
          categoryId: rec.categoryId || '',
          subcategoryId: rec.subcategoryId || '',
          title: rec.title || 'Transaksi Berulang',
          accountId: acc.id,
          pocketId: pkt.id,
          recurringId: rec.id
        });
      }
      return true;
    }

    function processDueRecurringTransactions() {
      db.recurringTransactions = Array.isArray(db.recurringTransactions) ? db.recurringTransactions : [];
      if (db.recurringTransactions.length === 0) return false;

      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      let createdAny = false;

      db.recurringTransactions.forEach(rec => {
        if (rec.active === false) return;
        const startDate = rec.startDate || todayStr;
        const [sy, sm] = startDate.split('-').map(n => parseInt(n, 10));
        const dayOfMonth = Math.min(Math.max(1, Number(rec.dayOfMonth) || 1), 31);

        let curYear = sy || now.getFullYear();
        let curMonthIdx = (sm || (now.getMonth() + 1)) - 1;
        const endYear = now.getFullYear();
        const endMonthIdx = now.getMonth();

        while (curYear < endYear || (curYear === endYear && curMonthIdx <= endMonthIdx)) {
          const runDate = buildDateFromYearMonthDay(curYear, curMonthIdx, dayOfMonth);
          const monthKey = `${curYear}-${String(curMonthIdx + 1).padStart(2, '0')}`;
          rec.triggeredMonths = Array.isArray(rec.triggeredMonths) ? rec.triggeredMonths : [];

          if (runDate >= startDate && runDate <= todayStr && !rec.triggeredMonths.includes(monthKey)) {
            const ok = executeRecurringEntry(rec, runDate);
            if (ok) {
              rec.triggeredMonths.push(monthKey);
              rec.lastRunDate = runDate;
              createdAny = true;
            }
          }

          curMonthIdx += 1;
          if (curMonthIdx > 11) {
            curMonthIdx = 0;
            curYear += 1;
          }
        }
      });

      if (createdAny) saveData();
      return createdAny;
    }

    function appendQuickZeros(inputId, zerosStr) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const digits = (inp.value || '').replace(/[^0-9]/g, '');
      if (!digits) return;
      const nextNum = Number(digits + zerosStr);
      if (!Number.isNaN(nextNum)) inp.value = formatNumberID(nextNum);
    }

    function formatAmountInput(inp) {
      const digits = (inp.value || '').replace(/[^0-9]/g, '');
      if (!digits) { inp.value = ''; return; }
      inp.value = formatNumberID(Number(digits));
    }

    function parseFormattedAmount(val) {
      const digits = String(val || '').replace(/[^0-9]/g, '');
      return digits ? Number(digits) : 0;
    }

    function submitTransferPocketForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const date = fd.get('trfDate') || new Date().toISOString().slice(0, 10);
      const amount = parseFormattedAmount(fd.get('trfAmount'));
      const fromAccId = fd.get('fromAccountId');
      const fromPktId = fd.get('fromPocketId');
      const toAccId = fd.get('toAccountId');
      const toPktId = fd.get('toPocketId');
      const note = String(fd.get('trfNote') || '').trim();

      if (amount <= 0) {
        showToast('Masukkan nominal transfer lebih dari 0', 'error');
        return;
      }
      if (fromAccId === toAccId && fromPktId === toPktId) {
        showToast('Pocket asal dan tujuan tidak boleh sama', 'error');
        return;
      }

      const srcAcc = db.accounts.find(a => a.id === fromAccId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === fromPktId);
      const dstAcc = db.accounts.find(a => a.id === toAccId);
      const dstPkt = dstAcc?.pockets?.find(p => p.id === toPktId);

      if (!srcAcc || !srcPkt || !dstAcc || !dstPkt) {
        showToast('Pilih pocket asal dan tujuan yang valid', 'error');
        return;
      }

      const fromIDR = toIDR(amount, srcAcc.currency);
      const toAmount = dstAcc.currency === srcAcc.currency
        ? amount
        : Number((fromIDR / (Number(db.exchangeRates?.[dstAcc.currency]) || 1)).toFixed(CURRENCY_META[dstAcc.currency]?.decimals || 2));

      srcPkt.balance = (Number(srcPkt.balance) || 0) - amount;
      dstPkt.balance = (Number(dstPkt.balance) || 0) + toAmount;

      const trfId = 'trf_' + Date.now();
      const trfTitle = note || `Transfer ke ${dstPkt.name}`;
      db.transactions.unshift({
        id: trfId,
        type: 'transfer',
        date,
        amount,
        nilaiKe: toAmount,
        title: trfTitle,
        accountId: srcAcc.id,
        pocketId: srcPkt.id,
        toAccountId: dstAcc.id,
        toPocketId: dstPkt.id
      });

      recordTransferToLinkedSavingsGoals(dstAcc.id, dstPkt.id, fromIDR, date, trfTitle, trfId);
      saveData();
      closeModal();
      showToast('Transfer antar-pocket berhasil');
      render();
    }

    function onTxTypeChange(type) {
      const catGroup = document.getElementById('tx-category-group');
      const trfTarget = document.getElementById('tx-transfer-target');
      const catSelect = document.getElementById('tx-cat-select');

      if (type === 'transfer') {
        catGroup?.classList.add('hidden');
        trfTarget?.classList.remove('hidden');
        return;
      }
      catGroup?.classList.remove('hidden');
      trfTarget?.classList.add('hidden');

      const filtered = db.categories.filter(c => c.type === type);
      if (catSelect) {
        catSelect.innerHTML = filtered.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }
      onTxCategoryChange();
    }

    function onTxCategoryChange() {
      const catId = document.getElementById('tx-cat-select')?.value;
      const subWrap = document.getElementById('tx-subcat-wrap');
      const cat = db.categories.find(c => c.id === catId);
      if (!subWrap) return;

      if (cat && Array.isArray(cat.subcategories) && cat.subcategories.length > 0) {
        subWrap.innerHTML = `
          <label class="block text-[11px] text-slate-500 mb-1">Sub-Kategori</label>
          <select name="txSubcategoryId" class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink">
            ${cat.subcategories.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
          </select>
        `;
      } else {
        subWrap.innerHTML = '';
      }
    }

    function onTxAccountChange() {
      const accId = document.getElementById('tx-acc-select')?.value;
      const pktSelect = document.getElementById('tx-pkt-select');
      const acc = db.accounts.find(a => a.id === accId);
      if (pktSelect && acc) {
        pktSelect.innerHTML = (acc.pockets || []).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      }
    }

    function onTxToAccountChange() {
      const accId = document.getElementById('tx-to-acc-select')?.value;
      const pktSelect = document.getElementById('tx-to-pkt-select');
      const acc = db.accounts.find(a => a.id === accId);
      if (pktSelect && acc) {
        pktSelect.innerHTML = (acc.pockets || []).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      }
    }

    function submitTxForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const type = fd.get('txType') || 'expense';
      const date = fd.get('txDate') || new Date().toISOString().slice(0, 10);
      const amount = parseFormattedAmount(fd.get('txAmount'));
      const accountId = fd.get('txAccountId');
      const pocketId = fd.get('txPocketId');
      const title = String(fd.get('txTitle') || '').trim();

      if (amount <= 0) {
        showToast('Masukkan nominal lebih dari 0', 'error');
        return;
      }

      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt) {
        showToast('Pilih akun dan pocket yang valid', 'error');
        return;
      }

      if (type === 'transfer') {
        const toAccountId = fd.get('txToAccountId');
        const toPocketId = fd.get('txToPocketId');
        const dstAcc = db.accounts.find(a => a.id === toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === toPocketId);
        if (!dstAcc || !dstPkt) {
          showToast('Pilih akun & pocket tujuan', 'error');
          return;
        }

        const fromIDR = toIDR(amount, acc.currency);
        const toAmount = dstAcc.currency === acc.currency
          ? amount
          : Number((fromIDR / (Number(db.exchangeRates?.[dstAcc.currency]) || 1)).toFixed(CURRENCY_META[dstAcc.currency]?.decimals || 2));

        pkt.balance = (Number(pkt.balance) || 0) - amount;
        dstPkt.balance = (Number(dstPkt.balance) || 0) + toAmount;

        const trfId = 'trf_' + Date.now();
        const trfNote = title || `Transfer ke ${dstPkt.name}`;
        db.transactions.unshift({
          id: trfId,
          type: 'transfer',
          date,
          amount,
          nilaiKe: toAmount,
          title: trfNote,
          accountId,
          pocketId,
          toAccountId,
          toPocketId
        });
        recordTransferToLinkedSavingsGoals(toAccountId, toPocketId, fromIDR, date, trfNote, trfId);
      } else {
        const categoryId = fd.get('txCategoryId') || '';
        const subcategoryId = fd.get('txSubcategoryId') || '';
        if (type === 'income') {
          pkt.balance = (Number(pkt.balance) || 0) + amount;
        } else {
          pkt.balance = (Number(pkt.balance) || 0) - amount;
        }

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type,
          date,
          amount,
          categoryId,
          subcategoryId,
          title,
          accountId,
          pocketId
        });
      }

      const isRecurring = Boolean(fd.get('txIsRecurring'));
      if (isRecurring) {
        const recDay = Math.min(Math.max(1, parseInt(fd.get('txRecDay'), 10) || 1), 31);
        const recStartDate = fd.get('txRecStartDate') || date;
        const [ry, rm] = recStartDate.split('-').map(n => parseInt(n, 10));
        const firstRunDate = buildDateFromYearMonthDay(ry || new Date().getFullYear(), (rm || 1) - 1, recDay);
        const firstMonthKey = `${ry || new Date().getFullYear()}-${String(rm || 1).padStart(2, '0')}`;
        const triggeredMonths = firstRunDate <= new Date().toISOString().slice(0, 10) ? [firstMonthKey] : [];

        db.recurringTransactions = db.recurringTransactions || [];
        db.recurringTransactions.unshift({
          id: 'rec_' + Date.now(),
          active: true,
          type,
          amount,
          title: title || (type === 'transfer' ? 'Transfer Berulang' : 'Transaksi Berulang'),
          categoryId: fd.get('txCategoryId') || '',
          subcategoryId: fd.get('txSubcategoryId') || '',
          accountId,
          pocketId,
          toAccountId: fd.get('txToAccountId') || '',
          toPocketId: fd.get('txToPocketId') || '',
          dayOfMonth: recDay,
          startDate: recStartDate,
          lastRunDate: triggeredMonths.length ? firstRunDate : '',
          triggeredMonths
        });
      }

      saveData();
      closeModal();
      showToast(isRecurring ? 'Transaksi tersimpan & dijadwalkan berulang' : 'Transaksi tersimpan');
      render();
    }

    function deleteTransaction(txId) {
      const idx = db.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = db.transactions[idx];
      const acc = db.accounts.find(a => a.id === tx.accountId);
      const pkt = acc?.pockets?.find(p => p.id === tx.pocketId);

      if (tx.type === 'income' && pkt) {
        pkt.balance = (Number(pkt.balance) || 0) - (Number(tx.amount) || 0);
      } else if (tx.type === 'expense' && pkt) {
        pkt.balance = (Number(pkt.balance) || 0) + (Number(tx.amount) || 0);
      } else if (tx.type === 'transfer') {
        const dstAcc = db.accounts.find(a => a.id === tx.toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === tx.toPocketId);
        if (pkt) pkt.balance = (Number(pkt.balance) || 0) + (Number(tx.amount) || 0);
        if (dstPkt) dstPkt.balance = (Number(dstPkt.balance) || 0) - (Number(tx.nilaiKe || tx.amount) || 0);
      }

      if (tx.type === 'transfer' && tx.toAccountId && tx.toPocketId) {
        db.savingsGoals.forEach(g => {
          if (g.accountId === tx.toAccountId && g.pocketId === tx.toPocketId && Array.isArray(g.history)) {
            g.history = g.history.filter(h => h.linkedTxId !== tx.id);
          }
        });
      }
      db.transactions.splice(idx, 1);
      syncSavingsGoalsWithPockets();
      saveData();
      showToast('Transaksi dihapus');
      render();
    }

    function moveAccountOrder(accId, delta) {
      const sorted = [...db.accounts].sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0));
      const idx = sorted.findIndex(a => a.id === accId);
      const targetIdx = idx + delta;
      if (idx === -1 || targetIdx < 0 || targetIdx >= sorted.length) return;
      const tmp = sorted[idx];
      sorted[idx] = sorted[targetIdx];
      sorted[targetIdx] = tmp;
      sorted.forEach((a, i) => { a.urut = i + 1; });
      db.accounts = sorted;
      saveData();
      render();
    }

    function deleteAccount(accId) {
      if (db.accounts.length <= 1) {
        showToast('Minimal harus ada 1 akun tersisa', 'error');
        return;
      }
      const acc = db.accounts.find(a => a.id === accId);
      if (!acc) return;
      if (!confirm(`Hapus akun "${acc.name}" beserta seluruh pocket di dalamnya?`)) return;

      db.accounts = db.accounts.filter(a => a.id !== accId);
      db.accounts.sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0)).forEach((a, i) => { a.urut = i + 1; });

      const fallbackAcc = db.accounts[0];
      const fallbackPkt = fallbackAcc?.pockets?.[0];
      db.savingsGoals.forEach(g => {
        if (g.accountId === accId) {
          g.accountId = fallbackAcc ? fallbackAcc.id : '';
          g.pocketId = fallbackPkt ? fallbackPkt.id : '';
        }
      });

      if (ui.selectedPocketDetail?.accId === accId) ui.selectedPocketDetail = null;

      saveData();
      closeModal();
      showToast('Akun dihapus');
      render();
    }

          </div>

            <div class="grid grid-cols-3 gap-2.5">
              <div class="col-span-2">
                <label class="block text-[11px] text-slate-500 mb-1">Nama Akun</label>
                <input type="text" name="accName" value="${acc ? acc.name : ''}" required placeholder="Contoh: Bank BCA / Dompet Baht"
                  class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
              </div>
              <div>

                  ${Array.from({ length: maxOrder }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === currentOrder ? 'selected' : ''}>Ke-${n}</option>`).join('')}
                </select>

                </select>
              </div>
              <div>
                <label class="block text-[11px] text-slate-500 mb-1">Mata Uang</label>
                <select name="accCurrency" class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink">
                  ${Object.keys(CURRENCY_META).map(c => `<option value="${c}" ${acc?.currency === c ? 'selected' : ''}>${c} (${CURRENCY_META[c].symbol})</option>`).join('')}
                </select>
              </div>
            </div>
            <div>

    function submitAccountForm(e, accId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = String(fd.get('accName') || '').trim();
      const jenis = fd.get('accJenis') || 'Bank';
      const currency = fd.get('accCurrency') || 'IDR';
      const colorId = fd.get('accColor') || 'emerald';
      const icon = fd.get('accIcon') || (jenis === 'Cash' ? 'wallet' : 'bank');
      const targetOrder = Math.max(1, parseInt(fd.get('accOrder'), 10) || 1);
      if (!name) return;

      const sorted = [...db.accounts].sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0));

      if (accId) {
        const idx = sorted.findIndex(a => a.id === accId);
        if (idx !== -1) {
          const acc = sorted[idx];
          acc.name = name;
          acc.jenis = jenis;
          acc.currency = currency;
          acc.colorId = colorId;
          acc.icon = icon;
          sorted.splice(idx, 1);
          sorted.splice(Math.min(sorted.length, targetOrder - 1), 0, acc);
        }
      } else {
        const initBal = parseFormattedAmount(fd.get('accInitBal'));
        const newAcc = {
          id: 'acc_' + Date.now(),
          name,
          jenis,
          currency,
          colorId,
          icon,
          urut: targetOrder,
          pockets: [
            { id: 'pkt_' + Date.now(), name: 'Pocket Utama', balance: initBal, urut: 1 }
          ]
        };
        sorted.splice(Math.min(sorted.length, targetOrder - 1), 0, newAcc);
      }

      sorted.forEach((a, i) => { a.urut = i + 1; });
      db.accounts = sorted;

      saveData();
      closeModal();
      showToast('Akun tersimpan');
      render();
    }

    function openPocketModal(accId) {
      const acc = db.accounts.find(a => a.id === accId);
      if (!acc) return;

    function deletePocket(accId, pktId) {
      const acc = db.accounts.find(a => a.id === accId);
      if (!acc) return;
      const pockets = acc.pockets || [];
      if (pockets.length <= 1) {
        showToast('Minimal harus ada 1 pocket di dalam akun', 'error');
        return;
      }
      const pkt = pockets.find(p => p.id === pktId);
      if (!pkt) return;
      if (!confirm(`Hapus pocket "${pkt.name}" dari ${acc.name}?`)) return;

      acc.pockets = pockets.filter(p => p.id !== pktId);
      acc.pockets.sort((a, b) => (a.urut || 0) - (b.urut || 0)).forEach((p, idx) => { p.urut = idx + 1; });

      const fallbackPkt = acc.pockets[0];
      db.savingsGoals.forEach(g => {
        if (g.accountId === accId && g.pocketId === pktId && fallbackPkt) {
          g.pocketId = fallbackPkt.id;
        }
      });

      if (ui.selectedPocketDetail?.accId === accId && ui.selectedPocketDetail?.pktId === pktId) {
        ui.selectedPocketDetail = null;
      }

      saveData();
      closeModal();
      showToast('Pocket dihapus');

      const targetIdx = idx + delta;
      if (idx === -1 || targetIdx < 0 || targetIdx >= sorted.length) return;
      const tmp = sorted[idx];
      sorted[idx] = sorted[targetIdx];
      sorted[targetIdx] = tmp;
      sorted.forEach((g, i) => { g.urut = i + 1; });
      db.savingsGoals = sorted;
      saveData();
      render();
    }

    function submitSavingGoal(e, goalId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = String(fd.get('goalName') || '').trim();
      const targetAmount = parseFormattedAmount(fd.get('goalTarget'));
      const accountId = fd.get('goalAccountId');
      let pocketId = fd.get('goalPocketId');
      const newPocketName = String(fd.get('goalNewPocketName') || '').trim();
      const initAmountIDR = parseFormattedAmount(fd.get('goalInitAmount'));
      const deadline = fd.get('goalDeadline') || '';
      const note = String(fd.get('goalNote') || '').trim();
      const colorId = fd.get('goalColor') || 'emerald';
      const icon = fd.get('goalIcon') || 'celengan';

      if (!name || targetAmount <= 0) {
        showToast('Lengkapi nama & nominal target tabungan', 'error');
        return;
      }

      const acc = db.accounts.find(a => a.id === accountId) || db.accounts[0];
      if (!acc) return;
      acc.pockets = acc.pockets || [];

      let pkt = acc.pockets.find(p => p.id === pocketId);
      if (pocketId === '__NEW__' || !pkt) {
        const createdPkt = {
          id: 'pkt_' + Date.now(),
          name: newPocketName || name,
          balance: 0,
          urut: acc.pockets.length + 1
        };
        acc.pockets.push(createdPkt);
        pkt = createdPkt;
        pocketId = createdPkt.id;
      }

      const targetOrder = Math.max(1, parseInt(fd.get('goalOrder'), 10) || 1);
      const rate = Number(db.exchangeRates?.[acc.currency]) || 1;
      const initInAccCur = initAmountIDR / rate;
      const sortedGoals = [...db.savingsGoals].sort((a, b) => (Number(a.urut) || 0) - (Number(b.urut) || 0));

      if (goalId) {
        const idx = sortedGoals.findIndex(x => x.id === goalId);
        if (idx !== -1) {
          const g = sortedGoals[idx];
          if (initAmountIDR >= 0) pkt.balance = initInAccCur;
          g.name = name;
          g.targetAmount = targetAmount;
          g.accountId = acc.id;
          g.pocketId = pkt.id;
          g.deadline = deadline;
          g.note = note;
          g.colorId = colorId;
          g.icon = icon;
          g.currentAmount = getSavingGoalBalanceIDR(g);
          sortedGoals.splice(idx, 1);
          sortedGoals.splice(Math.min(sortedGoals.length, targetOrder - 1), 0, g);
        }
      } else {
        if (initAmountIDR > 0) pkt.balance = (Number(pkt.balance) || 0) + initInAccCur;
        const newGoal = {
          id: 'sav_' + Date.now(),
          name,
          targetAmount,
          currentAmount: 0,
          accountId: acc.id,
          pocketId: pkt.id,
          deadline,
          colorId,
          icon,
          note,
          urut: targetOrder,
          history: initAmountIDR > 0 ? [{
            id: 'sh_' + Date.now(),
            type: 'deposit',
            amount: initAmountIDR,
            date: new Date().toISOString().slice(0, 10),
            note: `Saldo awal masuk ke pocket ${pkt.name}`
          }] : []
        };
        newGoal.currentAmount = getSavingGoalBalanceIDR(newGoal);
        sortedGoals.splice(Math.min(sortedGoals.length, targetOrder - 1), 0, newGoal);
      }

      sortedGoals.forEach((g, i) => { g.urut = i + 1; });
      db.savingsGoals = sortedGoals;

      saveData();
      closeModal();
      showToast('Tabungan terhubung ke pocket & kekayaan');
      render();
    }

    function syncSavingsGoalsWithPockets() {

    function recordTransferToLinkedSavingsGoals(dstAccountId, dstPocketId, amountIDR, date, note, txId) {
      const linkedGoals = db.savingsGoals.filter(g => g.accountId === dstAccountId && g.pocketId === dstPocketId);
      if (linkedGoals.length === 0 || amountIDR <= 0) return;
      linkedGoals.forEach(goal => {
        goal.history = goal.history || [];
        const alreadyLogged = txId && goal.history.some(h => h.linkedTxId === txId);
        if (!alreadyLogged) {
          goal.history.unshift({
            id: 'sh_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
            linkedTxId: txId || '',
            type: 'deposit',
            amount: amountIDR,
            date: date || new Date().toISOString().slice(0, 10),
            note: note || 'Transfer masuk ke pocket tabungan'
          });
        }
        goal.currentAmount = getSavingGoalBalanceIDR(goal);
      });
    }
