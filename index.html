      if (!goal) return;
      const isDeposit = mode === 'deposit';
      const curBalIDR = getSavingGoalBalanceIDR(goal);
      const goalAcc = db.accounts.find(a => a.id === goal.accountId);
      const goalPkt = goalAcc?.pockets?.find(p => p.id === goal.pocketId);
      const today = new Date().toISOString().slice(0, 10);

      let defaultAcc = db.accounts.find(a => a.id !== goal.accountId) || db.accounts[0];
      let defaultPkt = (defaultAcc?.pockets || []).find(p => !(defaultAcc.id === goal.accountId && p.id === goal.pocketId)) || defaultAcc?.pockets?.[0];

      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="text-[11px] font-medium uppercase tracking-wider text-sage">${goal.name}</div>
              <h3 class="text-base font-medium uppercase text-ink">${isDeposit ? 'SETOR KE TABUNGAN' : 'TARIK DARI TABUNGAN'}</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-creamSoft text-slate-600 flex items-center justify-center text-xs shrink-0">✕</button>
          </div>

          <div class="bg-creamSoft border border-[#E8DEC5] rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2">
            <span class="text-xs text-slate-500">Saldo Tabungan Saat Ini:</span>
            <div class="text-right">
              <div class="text-xs font-medium text-ink">${formatCurrency(curBalIDR)}</div>
              <div class="text-[11px] font-medium text-sage">${goalAcc?.name || '-'} (${goalPkt?.name || '-'})</div>
            </div>
          </div>

          <form onsubmit="submitSavingFund(event, '${goal.id}', '${mode}')" class="space-y-3">
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] text-slate-600 mb-1">Nominal (Rp)</label>
                <input type="text" id="sav-fund-amt" name="fundAmount" inputmode="numeric" oninput="formatAmountInput(this)" required placeholder="0"
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink focus:outline-none focus:border-peanut" />
              </div>
              <div>
                <label class="block text-[11px] text-slate-600 mb-1">Tanggal</label>
                <input type="date" name="fundDate" value="${today}" required
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink focus:outline-none focus:border-peanut" />
              </div>
            </div>

            <div class="flex gap-2">
              <button type="button" onclick="appendQuickZeros('sav-fund-amt', '00')" class="flex-1 py-1.5 rounded-xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink">+00</button>
              <button type="button" onclick="appendQuickZeros('sav-fund-amt', '000')" class="flex-1 py-1.5 rounded-xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink">+000</button>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] text-slate-600 mb-1">${isDeposit ? 'Sumber Dana (Akun)' : 'Pindahkan ke Akun'}</label>
                <select id="sav-counter-acc" name="counterAccountId" onchange="onSavingCounterAccChange('${goal.id}', '${mode}')"
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink focus:outline-none focus:border-peanut">
                  ${db.accounts.map(a => `<option value="${a.id}" ${a.id === defaultAcc?.id ? 'selected' : ''}>${a.name} (${a.currency})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] text-slate-600 mb-1">Pocket</label>
                <select id="sav-counter-pkt" name="counterPocketId"
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink focus:outline-none focus:border-peanut">
                  ${(defaultAcc?.pockets || []).map(p => {
                    const disabled = isDeposit && defaultAcc.id === goal.accountId && p.id === goal.pocketId;
                    return `<option value="${p.id}" ${p.id === defaultPkt?.id ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${p.name} (${formatCurrency(p.balance, defaultAcc.currency)})</option>`;
                  }).join('')}
                </select>
              </div>
            </div>

            <div>
              <label class="block text-[11px] text-slate-600 mb-1">Catatan</label>
              <input type="text" name="fundNote" placeholder="${isDeposit ? 'Contoh: Sisihan gaji mingguan' : 'Contoh: Pencairan dana target'}"
                class="w-full px-3 py-2.5 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink focus:outline-none focus:border-peanut" />
            </div>

            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <button type="button" onclick="closeModal()" class="py-3 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-ink text-xs font-medium">Batal</button>
              <button type="submit" class="py-3 rounded-2xl text-xs font-medium shadow-sm ${isDeposit ? 'bg-sage text-white' : 'bg-ink text-[#FBF6EA]'}">
                ${isDeposit ? 'Setor Sekarang' : 'Tarik Sekarang'}
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function onSavingCounterAccChange(goalId, mode) {
      const goal = db.savingsGoals.find(g => g.id === goalId);
      const accId = document.getElementById('sav-counter-acc')?.value;
      const pktSel = document.getElementById('sav-counter-pkt');
      const acc = db.accounts.find(a => a.id === accId);
      if (!pktSel || !acc) return;
      const isDeposit = mode === 'deposit';
      const pockets = acc.pockets || [];
      const firstValid = pockets.find(p => !(isDeposit && goal && acc.id === goal.accountId && p.id === goal.pocketId)) || pockets[0];

      pktSel.innerHTML = pockets.map(p => {
        const disabled = isDeposit && goal && acc.id === goal.accountId && p.id === goal.pocketId;
        return `<option value="${p.id}" ${p.id === firstValid?.id ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${p.name} (${formatCurrency(p.balance, acc.currency)})</option>`;
      }).join('');
    }

    function submitSavingFund(e, goalId, mode) {
      e.preventDefault();
      const goal = db.savingsGoals.find(g => g.id === goalId);
      if (!goal) return;
      const fd = new FormData(e.target);
      const amountIDR = parseFormattedAmount(fd.get('fundAmount'));
      const txDate = fd.get('fundDate') || new Date().toISOString().slice(0, 10);
      const counterAccId = fd.get('counterAccountId');
      const counterPktId = fd.get('counterPocketId');
      const note = String(fd.get('fundNote') || '').trim();

      if (amountIDR <= 0) {
        showToast('Masukkan nominal lebih dari 0', 'error');
        return;
      }

      const goalAcc = db.accounts.find(a => a.id === goal.accountId);
      const goalPkt = goalAcc?.pockets?.find(p => p.id === goal.pocketId);
      const counterAcc = db.accounts.find(a => a.id === counterAccId);
      const counterPkt = counterAcc?.pockets?.find(p => p.id === counterPktId);

      if (!goalAcc || !goalPkt || !counterAcc || !counterPkt) {
        showToast('Akun atau pocket belum lengkap', 'error');
        return;
      }

      if (goalAcc.id === counterAcc.id && goalPkt.id === counterPkt.id) {
        showToast('Pilih pocket yang berbeda dengan pocket tabungan', 'error');
        return;
      }

      const goalRate = Number(db.exchangeRates?.[goalAcc.currency]) || 1;
      const counterRate = Number(db.exchangeRates?.[counterAcc.currency]) || 1;
      const goalDec = CURRENCY_META[goalAcc.currency]?.decimals || 0;
      const counterDec = CURRENCY_META[counterAcc.currency]?.decimals || 0;

      const amtInGoalCur = goalAcc.currency === 'IDR' ? amountIDR : Number((amountIDR / goalRate).toFixed(goalDec));
      const amtInCounterCur = counterAcc.currency === 'IDR' ? amountIDR : Number((amountIDR / counterRate).toFixed(counterDec));

      const newTxId = 'trf_' + Date.now();

      if (mode === 'deposit') {
        counterPkt.balance = (Number(counterPkt.balance) || 0) - amtInCounterCur;
        goalPkt.balance = (Number(goalPkt.balance) || 0) + amtInGoalCur;

        db.transactions.unshift({
          id: newTxId,
          type: 'transfer',
          date: txDate,
          amount: amtInCounterCur,
          nilaiKe: amtInGoalCur,
          title: note || `Setor tabungan: ${goal.name}`,
          accountId: counterAcc.id,
          pocketId: counterPkt.id,
          toAccountId: goalAcc.id,
          toPocketId: goalPkt.id
        });
      } else {
        goalPkt.balance = (Number(goalPkt.balance) || 0) - amtInGoalCur;
        counterPkt.balance = (Number(counterPkt.balance) || 0) + amtInCounterCur;

        db.transactions.unshift({
          id: newTxId,
          type: 'transfer',
          date: txDate,
          amount: amtInGoalCur,
          nilaiKe: amtInCounterCur,
          title: note || `Tarik tabungan: ${goal.name}`,
          accountId: goalAcc.id,
          pocketId: goalPkt.id,
          toAccountId: counterAcc.id,
          toPocketId: counterPkt.id
        });
      }

      goal.history = goal.history || [];
      goal.history.unshift({
        id: 'sh_' + Date.now(),
        linkedTxId: newTxId,
        type: mode,
        amount: amountIDR,
        date: txDate,
        note: note || (mode === 'deposit'
          ? `Dari ${counterAcc.name} (${counterPkt.name})`
          : `Ke ${counterAcc.name} (${counterPkt.name})`)
      });

      syncSavingsGoalsWithPockets();
      saveData();
      closeModal();
      showToast(mode === 'deposit' ? 'Dana disetor & pocket tersinkron' : 'Dana ditarik & dipindahkan ke pocket');
      render();
    }

    function openDebtModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">CATAT HUTANG / PIUTANG</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>
          <form onsubmit="submitDebtForm(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Jenis</label>
              <select name="debtType" class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink">
                <option value="receivable">Piutang (Orang berhutang ke saya)</option>
                <option value="payable">Hutang (Saya berhutang ke orang)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Nama Pihak</label>
              <input type="text" name="debtPerson" required placeholder="Nama teman / lembaga"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Total Nominal (IDR)</label>
              <input type="text" name="debtTotal" inputmode="numeric" oninput="formatAmountInput(this)" required placeholder="0"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Jatuh Tempo (Opsional)</label>
              <input type="date" name="debtDue" class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Catatan</label>
              <input type="text" name="debtNote" placeholder="Keterangan"
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs text-ink" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Simpan</button>
          </form>
        </div>
      `);
    }

    function submitDebtForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const type = fd.get('debtType') || 'receivable';
      const person = String(fd.get('debtPerson') || '').trim();
      const totalAmount = parseFormattedAmount(fd.get('debtTotal'));
      const dueDate = fd.get('debtDue') || '';
      const note = String(fd.get('debtNote') || '').trim();
      if (!person || totalAmount <= 0) return;

      db.debts.unshift({
        id: 'debt_' + Date.now(),
        type,
        person,
        totalAmount,
        paidAmount: 0,
        dueDate,
        note
      });
      saveData();
      closeModal();
      showToast('Catatan hutang/piutang disimpan');
      render();
    }

    function openPayDebtModal(debtId) {
      const d = db.debts.find(x => x.id === debtId);
      if (!d) return;
      const sisa = Math.max(0, (Number(d.totalAmount) || 0) - (Number(d.paidAmount) || 0));
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-medium uppercase text-ink">CATAT PEMBAYARAN (${d.person})</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-creamSoft text-slate-500">✕</button>
          </div>
          <p class="text-xs text-slate-500">Sisa saat ini: <strong class="text-ink">${formatCurrency(sisa)}</strong></p>
          <form onsubmit="submitPayDebt(event, '${d.id}')" class="space-y-3">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">Nominal Bayar (IDR)</label>
              <input type="text" name="payAmt" value="${formatNumberID(sisa)}" inputmode="numeric" oninput="formatAmountInput(this)" required
                class="w-full px-3 py-2 rounded-2xl bg-creamSoft border border-[#E8DEC5] text-xs font-medium text-ink" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-ink text-[#FBF6EA] text-xs font-medium">Simpan Pembayaran</button>
          </form>
        </div>
      `);
    }

    function submitPayDebt(e, debtId) {
      e.preventDefault();
      const d = db.debts.find(x => x.id === debtId);
      if (!d) return;
      const fd = new FormData(e.target);
      const amt = parseFormattedAmount(fd.get('payAmt'));
      if (amt <= 0) return;
      d.paidAmount = Math.min(Number(d.totalAmount) || 0, (Number(d.paidAmount) || 0) + amt);
      saveData();
      closeModal();
      showToast('Pembayaran tercatat');
      render();
    }

    function deleteDebt(debtId) {
      db.debts = db.debts.filter(d => d.id !== debtId);
      saveData();
      showToast('Catatan dihapus');
      render();
    }

    // =========================================================================
    // 16. MAIN RENDER & BOOTSTRAP
    // =========================================================================
    function render() {
      updateLockScreenVisibility();
      updateFabVisibility();
      renderBottomNav();

      const mainEl = document.getElementById('main-content');
      if (!mainEl) return;

      if (ui.activeTab === 'transaksi') {
        mainEl.innerHTML = renderTransaksiView();
      } else if (ui.activeTab === 'statistik') {
        mainEl.innerHTML = renderStatistikView();
      } else if (ui.activeTab === 'tabungan') {
        mainEl.innerHTML = renderTabunganView();
      } else if (ui.activeTab === 'hutang') {
        mainEl.innerHTML = renderHutangView();
      } else if (ui.activeTab === 'pengaturan') {
        mainEl.innerHTML = renderPengaturanView();
      } else {
        mainEl.innerHTML = renderAkunView();
      }
    }

    (function initApp() {
      initPWAAssets();
      processDueRecurringTransactions();
      render();
      if (db.gasConfig?.url && db.gasConfig?.key) {
        syncPullFromSheets(true);
      }
      fetchLiveExchangeRates(true);
    })();
  </script>
</body>
</html>
